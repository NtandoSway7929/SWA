name: Admin Insights accessible chart data tables

on:
  pull_request:
    branches: ["main"]
    paths:
      - "admin-dashboard/admin-workspace.js"
      - "admin-dashboard/admin-workspace.css"
      - "admin-dashboard/index.html"
      - "scripts/admin-insight-data-table.test.cjs"
      - ".github/workflows/admin-insights-data-table.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate workspace JavaScript
        run: node --check admin-dashboard/admin-workspace.js

      - name: Test Insights chart data tables
        run: node scripts/admin-insight-data-table.test.cjs

name: Admin Table Controls Isolated Browser Preview

on:
  push:
    branches: ["design/admin-dashboard-top-nav-hybrid-hero", "feature/lead-cards-full-details"]
    paths:
      - "admin-dashboard/admin-dashboard-redesign.css"
      - "admin-dashboard/admin-lead-cards.css"
      - "admin-dashboard/admin-record-cards.css"
      - "admin-dashboard/admin-workspace.js"
      - "admin-dashboard/index.html"
      - "scripts/admin-dashboard-redesign.test.cjs"
      - "scripts/admin-lead-cards.test.cjs"
      - "scripts/admin-record-cards.test.cjs"
      - "scripts/admin-table-controls-dashboard-smoke.cjs"
      - ".github/workflows/admin-table-controls-preview.yml"
  pull_request:
    branches: ["main", "feature/admin-table-controls-phase-2"]
    paths:
      - "admin-dashboard/admin-table-controls.js"
      - "admin-dashboard/admin-workspace.css"
      - "admin-dashboard/admin-lead-cards.css"
      - "admin-dashboard/admin-record-cards.css"
      - "admin-dashboard/admin-workspace.js"
      - "admin-dashboard/index.html"
      - "scripts/admin-table-controls-dashboard-smoke.cjs"
      - "scripts/admin-lead-cards.test.cjs"
      - "scripts/admin-record-cards.test.cjs"
      - "scripts/admin-table-controls-db-smoke.cjs"
      - "scripts/first-contact-automation-db-smoke.cjs"
      - "scripts/due-work-notification-db-smoke.cjs"
      - "scripts/admin-dashboard-business-controls.test.cjs"
      - "supabase/migrations/20261107190000_swayphics_first_contact_task_automation.sql"
      - "supabase/migrations/20261107210000_escalate_unassigned_due_work.sql"
      - "supabase/swayphics-admin-notifications.sql"
      - "supabase/swayphics-business-flow.sql"
      - "tests/admin-table-controls-db/first-contact-automation-test.sql"
      - "tests/admin-table-controls-preview/**"
      - "tests/admin-table-controls-db/**"
      - "scripts/admin-table-controls-browser.test.cjs"
      - ".github/workflows/admin-table-controls-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

# Avoid multiple PR commits consuming runners while each downloads Chromium.
concurrency:
  group: admin-table-controls-preview-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-browser-preview:
    name: Test admin automation with synthetic data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Record exact validation revision
        run: |
          echo "Validating commit: $GITHUB_SHA"
          git log -1 --format='%h %s'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install isolated browser and local Supabase test dependencies
        run: npm install --no-save --no-package-lock playwright@1.64.1 supabase@2.121.0

      - name: Install headless Chromium
        timeout-minutes: 8
        run: npx playwright install --with-deps --only-shell chromium

      - name: Start local-only preview server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/admin-table-preview-server.log 2>&1 &
          echo $! > /tmp/admin-table-preview-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/tests/admin-table-controls-preview/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/admin-table-preview-server.log
          exit 1

      - name: Verify responsive record-card renderers
        run: node scripts/admin-record-cards.test.cjs

      - name: Verify lead-card structure and full-details entry point
        run: node scripts/admin-lead-cards.test.cjs

      - name: Run desktop and mobile browser checks
        run: |
          mkdir -p artifacts
          node scripts/admin-table-controls-browser.test.cjs

      - name: Exercise the actual dashboard with in-memory mocked API data
        shell: bash
        run: |
          set -euo pipefail
          node scripts/admin-table-controls-dashboard-smoke.cjs

      - name: Verify authenticated persistence against disposable local Supabase
        shell: bash
        run: |
          set -euo pipefail
          CLI="$GITHUB_WORKSPACE/node_modules/.bin/supabase"
          TEST_DIR="$(mktemp -d)"
          cleanup() {
            (cd "$TEST_DIR" && "$CLI" stop --no-backup) >/dev/null 2>&1 || true
            rm -rf "$TEST_DIR"
          }
          trap cleanup EXIT

          # Start an unlinked, throwaway stack. This step has no Supabase
          # access token, project reference, or hosted database credentials.
          cd "$TEST_DIR"
          "$CLI" init
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/tests/admin-table-controls-db/schema.sql" \
            "supabase/migrations/20261023000000_admin_table_controls_test_schema.sql"
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261107190000_swayphics_first_contact_task_automation.sql" \
            "supabase/migrations/20261107190000_swayphics_first_contact_task_automation.sql"
          cp "$GITHUB_WORKSPACE/supabase/migrations/20261107210000_escalate_unassigned_due_work.sql" \
            "supabase/migrations/20261107210000_escalate_unassigned_due_work.sql"
          cp "$GITHUB_WORKSPACE/tests/admin-table-controls-db/first-contact-automation-test.sql" \
            "supabase/migrations/20261107210100_automation_test_rpcs.sql"
          "$CLI" start
          # Replay the copied schema, production migration under test, and
          # test-only RPC against this throwaway database before exercising it.
          "$CLI" db reset --local --yes
          "$CLI" status --output env > "$RUNNER_TEMP/local-supabase.env"

          set -a
          # status --output env contains only local endpoint/key variables.
          source "$RUNNER_TEMP/local-supabase.env"
          set +a
          export SUPABASE_LOCAL_API_URL="$API_URL"
          cd "$GITHUB_WORKSPACE"
          node scripts/admin-table-controls-db-smoke.cjs
          node scripts/first-contact-automation-db-smoke.cjs
          node scripts/due-work-notification-db-smoke.cjs

      - name: Upload isolated test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-table-controls-isolated-preview
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop local preview server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/admin-table-preview-server.pid ]]; then
            kill "$(cat /tmp/admin-table-preview-server.pid)" || true
          fi

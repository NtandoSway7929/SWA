name: InnerMe One-Request Citation Abstention Check (isolated)

# Temporary test workflow. Runs only when this file is added to the isolated UI
# branch. User explicitly authorized one provider-backed chat request after
# confirming the test-only/no-billing condition. Remove this workflow after the run.
on:
  push:
    branches:
      - feature/innerme-chat-layout-v1
    paths:
      - ".github/workflows/innerme-citation-quality-once.yml"

permissions:
  contents: read

concurrency:
  group: innerme-citation-quality-once
  cancel-in-progress: false

jobs:
  citation-abstention:
    name: One read-only chat against the isolated test project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require isolated credentials and authorized no-billing condition
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
          CONFIRM_NO_BILLING: "true"
        run: |
          set -euo pipefail
          if [[ "${CONFIRM_NO_BILLING}" != "true" ]]; then
            echo "::error::No-billing condition was not confirmed. No provider request sent."
            exit 1
          fi
          for name in INNERME_TEST_ADMIN_EMAIL INNERME_TEST_ADMIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing isolated test-admin secret ${name}; no provider request sent."
              exit 1
            fi
          done
          echo "PASS: isolated credentials are configured and the user-authorized no-billing condition is recorded."

      - name: Authenticate and run exactly one read-only citation-abstention probe
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/innerme-cite-login-request.json /tmp/innerme-cite-login-response.json /tmp/innerme-cite-preflight-request.json /tmp/innerme-cite-preflight-response.json /tmp/innerme-cite-telemetry-preflight.json /tmp/innerme-cite-chat-request.json /tmp/innerme-cite-chat-response.sse /tmp/innerme-cite-chat-headers.txt /tmp/innerme-cite-chat-status.txt /tmp/innerme-cite-result.json /tmp/innerme-cite-usage.json' EXIT

          SUPABASE_URL="https://ofqofhnlzbouclvvrmzd.supabase.co"
          SUPABASE_PUBLISHABLE_KEY="sb_publishable_p4UqpaLvEx_93XJSWvzo6Q_loju0xzW"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path("/tmp/innerme-cite-login-request.json").write_text(json.dumps({
              "email": os.environ["INNERME_TEST_ADMIN_EMAIL"],
              "password": os.environ["INNERME_TEST_ADMIN_PASSWORD"],
          }), encoding="utf-8")
          PY

          login_status="$(curl --silent --show-error --max-time 20 \
            -o /tmp/innerme-cite-login-response.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/innerme-cite-login-request.json)"
          if [[ "${login_status}" != "200" ]]; then
            echo "::error::Isolated sign-in returned HTTP ${login_status}; no chat/provider request sent."
            exit 1
          fi

          ACCESS_TOKEN="$(python3 - <<'PY'
          import json
          from pathlib import Path
          token = json.loads(Path("/tmp/innerme-cite-login-response.json").read_text(encoding="utf-8")).get("access_token")
          if not isinstance(token, str) or not token:
              raise SystemExit("No access token in isolated test-project sign-in response.")
          print(token, end="")
          PY
          )"
          echo "::add-mask::${ACCESS_TOKEN}"

          # This action is a metadata-only preflight; it does not call an LLM.
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("/tmp/innerme-cite-preflight-request.json").write_text(json.dumps({
              "action": "innerme_workspace_read_health",
              "message": "Preflight provider configuration for one isolated read-only chat.",
          }), encoding="utf-8")
          PY
          preflight_status="$(curl --silent --show-error --max-time 25 \
            -o /tmp/innerme-cite-preflight-response.json -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' --data-binary @/tmp/innerme-cite-preflight-request.json)"
          if [[ "${preflight_status}" != "200" ]]; then
            echo "::error::Preflight returned HTTP ${preflight_status}; no chat/provider request sent."
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/innerme-cite-preflight-response.json").read_text(encoding="utf-8"))
          configured = payload.get("provider_configuration", {}).get("gemini_key_configured")
          if configured is not True:
              raise SystemExit("Isolated Gemini key is not confirmed configured; no chat/provider request sent.")
          print("PASS: isolated Gemini secret is configured.")
          PY

          telemetry_preflight_status="$(curl --silent --show-error --max-time 15 \
            -o /tmp/innerme-cite-telemetry-preflight.json -w '%{http_code}' \
            --get "${SUPABASE_URL}/rest/v1/innerme_provider_usage" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            --data-urlencode 'select=request_id' --data-urlencode 'limit=0')"
          if [[ "${telemetry_preflight_status}" != "200" ]]; then
            echo "::error::Telemetry preflight returned HTTP ${telemetry_preflight_status}; no chat/provider request sent."
            exit 1
          fi

          # The project currently has no innerme_knowledge rows. This checks
          # that an answer drawn from the injected roadmap/system context does
          # not fabricate a numbered citation without retrieved evidence.
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("/tmp/innerme-cite-chat-request.json").write_text(json.dumps({
              "action": "assistant_chat",
              "message": "What does the InnerMe roadmap say Phase 29 covers? Answer in one concise sentence and distinguish documented scope from runtime-tested behaviour.",
              "stream_response": True,
          }), encoding="utf-8")
          PY

          status="$(curl --silent --show-error --max-time 45 \
            -D /tmp/innerme-cite-chat-headers.txt \
            -o /tmp/innerme-cite-chat-response.sse -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' --data-binary @/tmp/innerme-cite-chat-request.json)"
          echo "CHAT_HTTP_STATUS=${status}"
          if [[ "${status}" != "200" ]]; then
            echo "::error::Single chat request returned HTTP ${status}."
            head -c 1000 /tmp/innerme-cite-chat-response.sse || true
            exit 1
          fi

          python3 - <<'PY'
          import json, re, uuid
          from pathlib import Path
          headers = {}
          for line in Path("/tmp/innerme-cite-chat-headers.txt").read_text(encoding="utf-8", errors="replace").splitlines():
              if ":" in line:
                  k, v = line.split(":", 1)
                  headers[k.strip().lower()] = v.strip()
          request_id = headers.get("x-innerme-request-id", "")
          try:
              uuid.UUID(request_id)
          except (ValueError, AttributeError):
              raise SystemExit("No valid request ID returned; cannot correlate provider attempts.")

          raw = Path("/tmp/innerme-cite-chat-response.sse").read_text(encoding="utf-8", errors="replace")
          events = []
          for frame in raw.replace("\r\n", "\n").split("\n\n"):
              if not frame.strip():
                  continue
              name, data = "message", []
              for line in frame.splitlines():
                  if line.startswith("event:"):
                      name = line[6:].strip()
                  elif line.startswith("data:"):
                      data.append(line[5:].lstrip())
              if not data:
                  continue
              text = "\n".join(data).strip()
              if not text or text == "[DONE]":
                  continue
              events.append((name, json.loads(text)))
          if any(name == "error" for name, _ in events):
              raise SystemExit("Stream emitted an error event: " + str([x for x in events if x[0] == "error"][0][1])[:300])
          done = [body for name, body in events if name == "done"]
          if len(done) != 1:
              raise SystemExit(f"Expected exactly one terminal done event, got {len(done)}.")
          payload = done[0]
          answer = payload.get("answer")
          if not isinstance(answer, str) or not answer.strip():
              raise SystemExit("No final answer in the terminal stream event.")
          if payload.get("read_only") is not True:
              raise SystemExit("The answer did not preserve the read-only contract.")
          retrieval = payload.get("knowledge_retrieval")
          if not isinstance(retrieval, dict) or retrieval.get("retrieval_error"):
              raise SystemExit("Knowledge retrieval status is missing or unhealthy.")
          matches = retrieval.get("match_count")
          if matches != 0:
              raise SystemExit(f"Expected zero retrieved knowledge records in this isolated check, got {matches}; citation-absence result is inconclusive.")
          markers = re.findall(r"(?<!\w)\[(?:[1-9]\d*)\]", answer)
          if markers:
              raise SystemExit("FAIL: answer fabricated numbered knowledge citation(s) with zero retrieved records: " + ", ".join(markers))
          Path("/tmp/innerme-cite-result.json").write_text(json.dumps({
              "request_id": request_id,
              "match_count": matches,
              "answer": answer,
              "numeric_citations": markers,
          }), encoding="utf-8")
          print("REQUEST_ID=" + request_id)
          print("KNOWLEDGE_MATCH_COUNT=0")
          print("NUMERIC_CITATIONS=0")
          print("FINAL_ANSWER=" + " ".join(answer.split()))
          print("PASS: no numbered knowledge citation was invented when retrieval returned zero records.")
          PY

          REQUEST_ID="$(python3 -c 'import json; print(json.load(open("/tmp/innerme-cite-result.json"))["request_id"])')"
          curl --silent --show-error --fail-with-body --max-time 20 \
            --get "${SUPABASE_URL}/rest/v1/innerme_provider_usage" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            --data-urlencode 'select=request_id,attempt_number,provider,model,outcome,http_status,latency_ms,input_tokens,output_tokens,total_tokens,error_code,fallback_reason' \
            --data-urlencode "request_id=eq.${REQUEST_ID}" \
            --data-urlencode 'order=attempt_number.asc' \
            -o /tmp/innerme-cite-usage.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("/tmp/innerme-cite-usage.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list) or len(rows) != 1:
              raise SystemExit(f"Expected exactly one provider attempt, found {len(rows) if isinstance(rows, list) else 'invalid telemetry'}.")
          row = rows[0]
          if row.get("provider") != "gemini" or row.get("outcome") != "success":
              raise SystemExit("Expected one successful Gemini attempt; observed " + json.dumps(row))
          print("PROVIDER_ATTEMPTS=1")
          print("PROVIDER=gemini")
          print("MODEL=" + str(row.get("model")))
          print("OUTCOME=success")
          print("HTTP_STATUS=" + str(row.get("http_status")))
          print("LATENCY_MS=" + str(row.get("latency_ms")))
          print("TOKEN_COUNTS=" + json.dumps({
              "input": row.get("input_tokens"),
              "output": row.get("output_tokens"),
              "total": row.get("total_tokens"),
          }, separators=(",", ":")))
          PY

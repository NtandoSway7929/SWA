name: Probe Supabase Edge Runtime Pinned TCP and TLS

on:
  pull_request:
    branches:
      - main
      - agent/innerme-integration-registry-spec
    paths:
      - "supabase/tests/edge-runtime-egress/**"
      - ".github/workflows/validate-innerme-egress-runtime.yml"
  push:
    branches:
      - feature/innerme-municipal-money-gateway
    paths:
      - "supabase/tests/edge-runtime-egress/**"
      - ".github/workflows/validate-innerme-egress-runtime.yml"

permissions:
  contents: read

jobs:
  pinned-tcp-tls:
    name: Verify raw TCP and TLS behavior in Supabase Edge Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create short-lived test CA and server certificate
        run: |
          mkdir -p "$RUNNER_TEMP/egress-certs"
          cd "$RUNNER_TEMP/egress-certs"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout ca.key -out ca.crt -days 2 \
            -subj "/CN=InnerMe Egress CI Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -new -newkey rsa:2048 -nodes \
            -keyout server.key -out server.csr \
            -subj "/CN=municipaldata.treasury.gov.za"
          printf '%s\n' \
            "basicConstraints=critical,CA:FALSE" \
            "keyUsage=critical,digitalSignature,keyEncipherment" \
            "extendedKeyUsage=serverAuth" \
            "subjectAltName=DNS:municipaldata.treasury.gov.za" \
            > server.ext
          openssl x509 -req -in server.csr \
            -CA ca.crt -CAkey ca.key -CAcreateserial \
            -out server.crt -days 2 -extfile server.ext

      - name: Start local mock TLS destination
        run: |
          docker network create innerme-egress-ci
          docker run -d --name innerme-mock-tls \
            --network innerme-egress-ci --network-alias mocktls \
            -v "$RUNNER_TEMP/egress-certs:/certs:ro" \
            -v "$GITHUB_WORKSPACE/supabase/tests/edge-runtime-egress/mock-tls-server.mjs:/app/server.mjs:ro" \
            node:22-alpine node /app/server.mjs

      - name: Start pinned Supabase Edge Runtime image
        run: |
          docker run -d --name innerme-edge-runtime \
            --network innerme-egress-ci -p 9000:9000 \
            -v "$GITHUB_WORKSPACE/supabase/tests/edge-runtime-egress/main:/services/main:ro" \
            -v "$GITHUB_WORKSPACE/supabase/tests/edge-runtime-egress/user:/services/egress-probe:ro" \
            supabase/edge-runtime:v1.77.9 \
            start --main-service /services/main -p 9000

      - name: Wait for Edge Runtime
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs innerme-edge-runtime
          exit 1

      - name: Exercise DNS, pinned TCP, TLS SNI and hostname verification
        run: |
          ca_cert="$(cat "$RUNNER_TEMP/egress-certs/ca.crt")"
          payload="$(jq -n --arg ca "$ca_cert" '{caCert: $ca}')"
          http_status="$(curl --silent --show-error --max-time 30 \
            --output "$RUNNER_TEMP/egress-response.json" \
            --write-out '%{http_code}' \
            -H "Content-Type: application/json" \
            --data "$payload" \
            http://127.0.0.1:9000/egress-probe)"
          body="$(cat "$RUNNER_TEMP/egress-response.json")"
          printf 'HTTP status: %s\n' "$http_status"
          printf 'Response body: %s\n' "$body"
          printf '%s\n' "$body" | jq .
          test "$http_status" = "200"
          printf '%s\n' "$body" | jq -e '
            .dnsResolution == true and
            .tcpConnectedToLiteralIp == true and
            .tlsCertificateHostnameVerified == true and
            .tlsSni == "municipaldata.treasury.gov.za" and
            .httpHostHeader == "municipaldata.treasury.gov.za" and
            .wrongHostnameRejected == true and
            .testOnlyPrivateDestination == true
          '
      - name: Print runtime logs on failure
        if: failure()
        run: |
          docker logs innerme-edge-runtime || true
          docker logs innerme-mock-tls || true

      - name: Clean up local CI containers
        if: always()
        run: |
          docker rm -f innerme-edge-runtime innerme-mock-tls || true
          docker network rm innerme-egress-ci || true

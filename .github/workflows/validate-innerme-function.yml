name: Validate InnerMe Edge Function

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/swayphics-ai/**"
      - "supabase/config.toml"
      - ".github/workflows/validate-innerme-function.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/functions/swayphics-ai/**"
      - "supabase/config.toml"
      - ".github/workflows/validate-innerme-function.yml"

permissions:
  contents: read

jobs:
  check:
    name: Type-check source and verify health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check checked-in Edge Function source
        run: deno check --no-lock supabase/functions/swayphics-ai/index.ts

      - name: Non-mutating production health GET
        env:
          INNERME_HEALTH_URL: https://sqifhribgsqfaxgtobsa.supabase.co/functions/v1/swayphics-ai
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 "$INNERME_HEALTH_URL")"
          printf '%s' "$response" | python3 -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          if payload.get("ok") is not True or payload.get("service") != "swayphics-ai":
              raise SystemExit(f"Unexpected health payload: {payload!r}")
          print("Production health GET passed.")
          '

name: Validate InnerMe Edge Function

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/swayphics-ai/**"
      - "supabase/config.toml"
      - ".github/workflows/validate-innerme-function.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/functions/swayphics-ai/**"
      - "supabase/config.toml"
      - ".github/workflows/validate-innerme-function.yml"

permissions:
  contents: read

jobs:
  check:
    name: Deno type and module check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check production Edge Function source
        run: deno check --no-lock supabase/functions/swayphics-ai/index.ts

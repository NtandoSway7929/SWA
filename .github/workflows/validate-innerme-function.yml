name: Validate InnerMe Edge Function

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/swayphics-ai/**"
      - "supabase/functions/tests/innerme-evidence-traceability.test.mjs"
      - "supabase/functions/innerme-retrieval-smoke-test/**"
      - "supabase/config.toml"
      - ".github/workflows/validate-innerme-function.yml"
      - "scripts/innerme-routing-experiment.mjs"
      - "scripts/innerme-routing-experiment.test.mjs"
      - ".github/workflows/innerme-routing-experiment.yml"
      - "docs/innerme-routing-experiment.md"
      - "scripts/innerme-semantic-retrieval-regression.test.mjs"
      - "scripts/innerme-retrieval-ranking.test.mjs"
      - "supabase/functions/innerme-retrieval-smoke-test/regression-baseline.json"
      - "supabase/migrations/20261016034000_innerme_zero_cost_quota_exhaustion_fix.sql"
      - "scripts/innerme-zero-cost-provider-guard.test.mjs"
      - "supabase/migrations/20261016050000_innerme_trigger_search_path_hardening.sql"
      - "scripts/innerme-trigger-search-path.test.mjs"
      - "supabase/migrations/20261016060000_innerme_public_rate_limit_search_path_hardening.sql"
      - "scripts/innerme-public-rate-limit-search-path.test.mjs"
      - "supabase/migrations/20261016070000_innerme_policy_definer_search_path_hardening.sql"
      - "scripts/innerme-policy-definer-search-path.test.mjs"
      - "supabase/migrations/20261016080000_innerme_trust_definer_search_path_hardening.sql"
      - "scripts/innerme-trust-definer-search-path.test.mjs"
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/functions/swayphics-ai/**"
      - "supabase/functions/tests/innerme-evidence-traceability.test.mjs"
      - "supabase/functions/innerme-retrieval-smoke-test/**"
      - "supabase/config.toml"
      - ".github/workflows/validate-innerme-function.yml"
      - "scripts/innerme-routing-experiment.mjs"
      - "scripts/innerme-routing-experiment.test.mjs"
      - ".github/workflows/innerme-routing-experiment.yml"
      - "docs/innerme-routing-experiment.md"
      - "supabase/functions/innerme-retrieval-smoke-test/regression-baseline.json"
      - "scripts/innerme-retrieval-ranking.test.mjs"
      - "scripts/innerme-semantic-retrieval-regression.test.mjs"
      - "supabase/migrations/20261016034000_innerme_zero_cost_quota_exhaustion_fix.sql"
      - "scripts/innerme-zero-cost-provider-guard.test.mjs"
      - "supabase/migrations/20261016050000_innerme_trigger_search_path_hardening.sql"
      - "scripts/innerme-trigger-search-path.test.mjs"
      - "supabase/migrations/20261016060000_innerme_public_rate_limit_search_path_hardening.sql"
      - "scripts/innerme-public-rate-limit-search-path.test.mjs"
      - "supabase/migrations/20261016070000_innerme_policy_definer_search_path_hardening.sql"
      - "scripts/innerme-policy-definer-search-path.test.mjs"
      - "supabase/migrations/20261016080000_innerme_trust_definer_search_path_hardening.sql"
      - "scripts/innerme-trust-definer-search-path.test.mjs"

permissions:
  contents: read

jobs:
  check:
    name: Type-check source and verify health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check checked-in Edge Function source
        run: deno check --no-lock supabase/functions/swayphics-ai/index.ts

      - name: Type-check isolated semantic retrieval smoke endpoint
        run: deno check --no-lock supabase/functions/innerme-retrieval-smoke-test/index.ts

      - name: Test authenticated action guard and provider routing without API calls
        run: deno test --no-lock --allow-env supabase/functions/swayphics-ai/auth.integration.test.ts supabase/functions/swayphics-ai/innerme-provider-routing.test.ts supabase/functions/swayphics-ai/innerme-workspace-intelligence.test.ts supabase/functions/swayphics-ai/innerme-context-compaction.test.ts supabase/functions/swayphics-ai/innerme-execution-contracts.test.ts supabase/functions/swayphics-ai/innerme-context-manifest.test.ts supabase/functions/swayphics-ai/innerme-run-controller.test.ts

      - name: Test paired routing experiment without provider calls
        run: |
          node --check scripts/innerme-routing-experiment.mjs
          node --test scripts/innerme-routing-experiment.test.mjs
          node scripts/innerme-routing-experiment.mjs --dry-run

      - name: Test retrieval score-gap selection without provider calls
        run: |
          node --check scripts/innerme-retrieval-ranking.test.mjs
          node --test scripts/innerme-retrieval-ranking.test.mjs

      - name: Test isolated regression bearer-token parsing
        run: |
          node --check supabase/functions/innerme-retrieval-smoke-test/auth-header.mjs
          node --check scripts/innerme-semantic-retrieval-auth.test.mjs
          node --test scripts/innerme-semantic-retrieval-auth.test.mjs

      - name: Validate versioned semantic retrieval regression baseline
        run: |
          node --check scripts/innerme-semantic-retrieval-regression.test.mjs
          node --test scripts/innerme-semantic-retrieval-regression.test.mjs

      - name: Test zero-cost quota exhaustion guard without provider calls
        run: |
          node --check scripts/innerme-zero-cost-provider-guard.test.mjs
          node --test scripts/innerme-zero-cost-provider-guard.test.mjs

      - name: Test InnerMe evidence traceability formatting
        run: |
          node --check supabase/functions/tests/innerme-evidence-traceability.test.mjs
          node --test supabase/functions/tests/innerme-evidence-traceability.test.mjs

      - name: Test InnerMe trigger search-path hardening migration
        run: |
          node --check scripts/innerme-trigger-search-path.test.mjs
          node --test scripts/innerme-trigger-search-path.test.mjs

      - name: Test InnerMe public rate-limit RPC search-path hardening
        run: |
          node --check scripts/innerme-public-rate-limit-search-path.test.mjs
          node --test scripts/innerme-public-rate-limit-search-path.test.mjs

      - name: Test InnerMe Phase 30 policy definer search-path hardening
        run: |
          node --check scripts/innerme-policy-definer-search-path.test.mjs
          node --test scripts/innerme-policy-definer-search-path.test.mjs

      - name: Test InnerMe trust/calibration definer search-path hardening
        run: |
          node --check scripts/innerme-trust-definer-search-path.test.mjs
          node --test scripts/innerme-trust-definer-search-path.test.mjs

      - name: Non-mutating isolated test health GET
        env:
          INNERME_HEALTH_URL: https://ofqofhnlzbouclvvrmzd.supabase.co/functions/v1/swayphics-ai
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 "$INNERME_HEALTH_URL")"
          printf '%s' "$response" | python3 -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          if payload.get("ok") is not True or payload.get("service") != "swayphics-ai":
              raise SystemExit(f"Unexpected isolated test health payload: {payload!r}")
          print("Isolated test health GET passed.")
          '

      - name: Verify isolated test rejects unauthenticated action requests
        env:
          INNERME_ACTION_URL: https://ofqofhnlzbouclvvrmzd.supabase.co/functions/v1/swayphics-ai
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 -o /tmp/innerme-test-auth.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"action":"execute_innerme_action","proposal_id":"00000000-0000-0000-0000-000000000000"}' \
            "$INNERME_ACTION_URL")"
          if [[ "$status" != "401" ]]; then
            cat /tmp/innerme-test-auth.json
            echo "Expected isolated test endpoint to reject missing authentication with HTTP 401; got $status."
            exit 1
          fi
          python3 -c '
          import json
          with open("/tmp/innerme-test-auth.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          if payload.get("error") != "Authentication is required.":
              raise SystemExit(f"Unexpected isolated auth rejection: {payload!r}")
          print("Isolated test unauthorized-action guard passed.")
          '

      - name: Verify production rejects unauthenticated action requests
        env:
          INNERME_ACTION_URL: https://sqifhribgsqfaxgtobsa.supabase.co/functions/v1/swayphics-ai
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 -o /tmp/innerme-production-auth.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"action":"execute_innerme_action","proposal_id":"00000000-0000-0000-0000-000000000000"}' \
            "$INNERME_ACTION_URL")"
          if [[ "$status" != "401" ]]; then
            cat /tmp/innerme-production-auth.json
            echo "Expected production endpoint to reject missing authentication with HTTP 401; got $status."
            exit 1
          fi
          python3 -c '
          import json
          with open("/tmp/innerme-production-auth.json", encoding="utf-8") as handle:
              payload = json.load(handle)
          application_rejection = payload.get("error") == "Authentication is required."
          gateway_rejection = (
              payload.get("code") == "UNAUTHORIZED_NO_AUTH_HEADER"
              and payload.get("message") == "Missing authorization header"
          )
          if not (application_rejection or gateway_rejection):
              raise SystemExit(f"Unexpected production auth rejection: {payload!r}")
          print("Production unauthorized-action guard passed at the gateway or application layer.")
          '

      - name: Verify production endpoint reachability and health behavior
        env:
          INNERME_HEALTH_URL: https://sqifhribgsqfaxgtobsa.supabase.co/functions/v1/swayphics-ai
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 -o /tmp/innerme-production-health.json -w '%{http_code}' "$INNERME_HEALTH_URL")"
          if [[ "$status" != "200" && "$status" != "401" ]]; then
            cat /tmp/innerme-production-health.json
            echo "Expected production health GET to return 200 or the expected JWT gateway rejection (401); got $status."
            exit 1
          fi
          export INNERME_HEALTH_STATUS="$status"
          python3 - <<'PY'
          import json
          import os

          with open("/tmp/innerme-production-health.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          status = os.environ["INNERME_HEALTH_STATUS"]
          if status == "200":
              if payload.get("ok") is not True or payload.get("service") != "swayphics-ai":
                  raise SystemExit(f"Unexpected health payload: {payload!r}")
              print("Production health GET passed.")
          else:
              if (
                  payload.get("code") != "UNAUTHORIZED_NO_AUTH_HEADER"
                  or payload.get("message") != "Missing authorization header"
              ):
                  raise SystemExit(f"Unexpected production health rejection: {payload!r}")
              print("Production gateway is reachable; JWT enforcement prevents anonymous health checks.")
          PY

name: Validate Swayphics site

on:
  push:
    branches: ["main", "feature/admin-table-controls-phase-2", "design/admin-dashboard-top-nav-hybrid-hero", "feature/automatic-payment-receipts"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test Business Opportunity Finder preview
        run: |
          set -e
          node --check business-opportunity-finder/business-opportunity-finder.js
          node scripts/business-opportunity-finder.test.cjs
          node scripts/business-opportunity-finder-flow.test.cjs
          node scripts/business-assessment-admin.test.cjs
          node scripts/business-assessment-conversion.test.cjs
          node scripts/business-assessment-lead-history.test.cjs
          node scripts/business-assessment-proposal-snapshot.test.cjs
          node --check admin-dashboard/business-assessment-lead-history.js
          node scripts/business-assessment-conversion.test.cjs
          node --check admin-dashboard/business-assessments.js
          node --check admin-dashboard/business-assessments-nav.js
          node --check supabase/functions/submit-business-assessment/rules.mjs
          node --check supabase/functions/inspect-business-assessment/provider.mjs
          node scripts/business-opportunity-rules.test.cjs
          node scripts/business-assessment-inspection-provider.test.cjs
          node scripts/business-assessment-inspection.test.cjs


      - name: Type-check Business Opportunity Finder inspection function
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Business Opportunity Finder inspection Edge Function
        run: deno check supabase/functions/inspect-business-assessment/index.ts

      - name: Validate standalone JavaScript
        run: |
          set -e
          node --check admin-dashboard/admin-workspace.js
          node --check admin-dashboard/admin-budget-receipts.js
          node --check admin-dashboard/admin-settings-expanded.js
          node --check admin-dashboard/lead-whatsapp.js
          node --check admin-dashboard/innerme-workspace-health.js
          node --check admin-dashboard/admin-table-controls.js
          node --check admin-dashboard/bank-reconciliation-import.js
          node --check admin-dashboard/payment-receipts.js
          node --check admin-dashboard/admin-manual-payments.js
          node --check admin-dashboard/innerme-provider-usage.js

      - name: Test admin welcome authentication handshake
        run: node scripts/admin-welcome-auth.test.cjs

      - name: Test expanded admin settings
        run: node scripts/admin-settings-expanded.test.cjs

      - name: Test Settings tab keyboard navigation
        run: node --test scripts/admin-settings-tab-keyboard.test.cjs

      - name: Test dynamic admin modal accessibility
        run: node --test scripts/admin-dynamic-modal-accessibility.test.cjs

      - name: Test quick-create accessibility contracts
        run: node scripts/admin-quick-create-accessibility.test.cjs

      - name: Test dashboard automation integrity
        run: node scripts/admin-automation-integrity.test.cjs

      - name: Test dashboard business controls and governance
        run: node scripts/admin-dashboard-business-controls.test.cjs

      - name: Test admin automation run history
        run: node scripts/admin-automation-run-history.test.cjs

      - name: Test due lead and quote notification escalation
        run: node scripts/due-lead-quote-escalation.test.cjs

      - name: Test admin table controls
        run: node scripts/admin-table-controls.test.cjs

      - name: Test admin table selection announcements
        run: node scripts/admin-table-selection-announcements.test.cjs

      - name: Test admin dashboard redesign contracts
        run: node scripts/admin-dashboard-redesign.test.cjs

      - name: Test budget category allocations and cash-flow outlook
        run: node scripts/admin-budget-category-allocations.test.cjs

      - name: Test budget receipt management safeguards
        run: node scripts/admin-budget-receipts.test.cjs

      - name: Test bank statement reconciliation schema contract
        run: node scripts/bank-statement-reconciliation.test.cjs

      - name: Test bank statement CSV preview safeguards
        run: node scripts/bank-statement-csv-preview.test.cjs

      - name: Test cookie consent analytics behaviour
        run: node scripts/cookie-consent-analytics.test.cjs

      - name: Test admin notification record navigation
        run: node scripts/admin-notification-navigation.test.cjs

      - name: Test admin communication record viewing
        run: node scripts/admin-record-cards.test.cjs
      - name: Test premium invoice PDF and email design
        run: node scripts/invoice-premium-design.test.cjs


      - name: Test Insights lead conversion analytics
        run: node scripts/admin-insights-lead-conversion.test.cjs

      - name: Test client portal onboarding promotions
        run: node scripts/client-portal-onboarding-promotions.test.cjs

      - name: Test client portal premium styling
        run: node scripts/client-portal-premium-style.test.cjs

      - name: Test client portal Phase 1 dashboard and navigation
        run: node scripts/client-portal-phase-1.test.cjs

      - name: Test client portal Phase 2 guided onboarding
        run: node scripts/client-portal-phase-2.test.cjs

      - name: Test client portal Phase 3 project milestones
        run: node scripts/client-portal-phase-3.test.cjs

      - name: Test client portal Phase 4 financial centre
        run: node scripts/client-portal-phase-4.test.cjs

      - name: Test client portal Phase 5 documents and deliverables
        run: node scripts/client-portal-phase-5.test.cjs

      - name: Test client portal animation system
        run: node scripts/client-portal-animations.test.cjs

      - name: Test Swayphics loader
        run: node scripts/swayphics-loader.test.cjs

      - name: Test homepage clean presentation
        run: node --test scripts/homepage-clean-presentation.test.cjs

      - name: Test service-page button contrast
        run: node --test scripts/service-page-button-contrast.test.cjs

      - name: Test client portal link and access reliability
        run: node --test scripts/client-portal-access-reliability.test.cjs

      - name: Test bank transfer review navigation
        run: node scripts/bank-transfer-review.test.cjs

      - name: Test invoice payment settings navigation
        run: node scripts/yoco-invoice-settings.test.cjs

      - name: Test payment receipt email delivery
        run: node scripts/payment-receipt-delivery.test.cjs

      - name: Test lead WhatsApp contact links
        run: node scripts/lead-whatsapp.test.cjs

      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          html_files = [
              pathlib.Path("index.html"),
              pathlib.Path("admin/index.html"),
              pathlib.Path("admin-dashboard/index.html"),
              pathlib.Path("client-portal/index.html"),
              pathlib.Path("card/index.html"),
              pathlib.Path("testimonial/index.html"),
              pathlib.Path("404.html"),
          ]

          pattern = re.compile(r"<script\b([^>]*)>([\s\S]*?)</script>", re.I)

          for path in html_files:
              if not path.exists():
                  continue

              source = path.read_text(encoding="utf-8")
              index = 0

              for match in pattern.finditer(source):
                  attrs = match.group(1)
                  body = match.group(2)

                  if re.search(r"\bsrc\s*=", attrs, re.I):
                      continue

                  if "application/ld+json" in attrs.lower():
                      continue

                  if not body.strip():
                      continue

                  with tempfile.NamedTemporaryFile(
                      "w",
                      suffix=".js",
                      encoding="utf-8",
                      delete=False,
                  ) as handle:
                      handle.write(body)
                      temp_name = handle.name

                  try:
                      subprocess.run(
                          ["node", "--check", temp_name],
                          check=True,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True,
                      )
                  except subprocess.CalledProcessError as exc:
                      print(f"JavaScript syntax error in {path} script #{index + 1}")
                      print(exc.stderr)
                      raise
                  finally:
                      pathlib.Path(temp_name).unlink(missing_ok=True)

                  index += 1

          print("Inline JavaScript validation passed.")
          PY

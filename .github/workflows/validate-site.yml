name: Validate Swayphics site

on:
  push:
    branches: ["main", "feature/admin-table-controls-phase-2"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate standalone JavaScript
        run: |
          set -e
          node --check admin-dashboard/admin-workspace.js
          node --check admin-dashboard/admin-table-controls.js
          node --check admin-dashboard/innerme-provider-usage.js

      - name: Test admin welcome authentication handshake
        run: node scripts/admin-welcome-auth.test.cjs

      - name: Test admin table controls
        run: node scripts/admin-table-controls.test.cjs

      - name: Test sales work queue
        run: node scripts/sales-work-queue-static.test.cjs

      - name: Test structured sales qualification
        run: node scripts/sales-qualification-static.test.cjs

      - name: Test structured sales communication outcomes
        run: node scripts/sales-outcomes-static.test.cjs

      - name: Test sales campaign attribution
        run: node scripts/sales-campaign-attribution-static.test.cjs

      - name: Validate inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          html_files = [
              pathlib.Path("index.html"),
              pathlib.Path("admin/index.html"),
              pathlib.Path("admin-dashboard/index.html"),
              pathlib.Path("client-portal/index.html"),
              pathlib.Path("card/index.html"),
              pathlib.Path("testimonial/index.html"),
              pathlib.Path("404.html"),
          ]

          pattern = re.compile(r"<script\b([^>]*)>([\s\S]*?)</script>", re.I)

          for path in html_files:
              if not path.exists():
                  continue

              source = path.read_text(encoding="utf-8")
              index = 0

              for match in pattern.finditer(source):
                  attrs = match.group(1)
                  body = match.group(2)

                  if re.search(r"\bsrc\s*=", attrs, re.I):
                      continue

                  if "application/ld+json" in attrs.lower():
                      continue

                  if not body.strip():
                      continue

                  with tempfile.NamedTemporaryFile(
                      "w",
                      suffix=".js",
                      encoding="utf-8",
                      delete=False,
                  ) as handle:
                      handle.write(body)
                      temp_name = handle.name

                  try:
                      subprocess.run(
                          ["node", "--check", temp_name],
                          check=True,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True,
                      )
                  except subprocess.CalledProcessError as exc:
                      print(f"JavaScript syntax error in {path} script #{index + 1}")
                      print(exc.stderr)
                      raise
                  finally:
                      pathlib.Path(temp_name).unlink(missing_ok=True)

                  index += 1

          print("Inline JavaScript validation passed.")
          PY

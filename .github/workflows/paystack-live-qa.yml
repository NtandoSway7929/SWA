name: Paystack Live Integration QA

on:
  push:
    branches:
      - feature/paystack-live-integration
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/*paystack*"
      - "supabase/tests/*paystack*"
      - "admin-dashboard/yoco-invoice-settings.js"
      - "client-portal/index.html"
      - ".github/workflows/paystack-live-qa.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/*paystack*"
      - "supabase/tests/*paystack*"
      - "admin-dashboard/yoco-invoice-settings.js"
      - "client-portal/index.html"
      - ".github/workflows/paystack-live-qa.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Paystack live integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Paystack Edge Functions and tests
        run: |
          deno check \
            supabase/functions/create-paystack-payment-checkout/index.ts \
            supabase/functions/get-paystack-payment-status/index.ts \
            supabase/functions/paystack-payment-webhook/index.ts \
            supabase/functions/create-paystack-refund/index.ts \
            supabase/functions/tests/paystack-live-validation.test.ts

      - name: Run Paystack live validation tests
        run: deno test supabase/functions/tests/paystack-live-validation.test.ts

  provider-isolation-regression:
    name: PostgreSQL provider-isolation regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swayphics_paystack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swayphics_paystack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: swayphics_paystack_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Create isolated database fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/paystack-provider-isolation-fixture.sql

      - name: Apply Paystack provider guard migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261119150000_paystack_invoice_provider_guard.sql

      - name: Run provider isolation regression
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/20261119150000_paystack_invoice_provider_guard.test.sql

name: InnerMe Isolated Normal Chat Performance Benchmark

on:
  push:
    branches:
      - feature/innerme-chat-layout-v1
    paths:
      - ".github/workflows/innerme-normal-chat-benchmark.yml"
  workflow_dispatch:
    inputs:
      confirm_no_billing:
        description: "Confirm the isolated test project's Gemini key comes from a separate project with billing disabled"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: innerme-isolated-normal-chat-performance-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Measure one isolated authenticated read-only chat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require isolated credentials and no-billing confirmation
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
          CONFIRM_NO_BILLING: ${{ github.event_name == 'push' && 'true' || inputs.confirm_no_billing }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRM_NO_BILLING}" != "true" ]]; then
            echo "::error::Stop: confirm that the isolated test provider key belongs to a Google project with billing disabled."
            exit 1
          fi
          for name in INNERME_TEST_ADMIN_EMAIL INNERME_TEST_ADMIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret ${name}. Use isolated test-project credentials only."
              exit 1
            fi
          done

      - name: Run one read-only chat and correlate provider telemetry
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/innerme-benchmark-login-request.json /tmp/innerme-benchmark-login-response.json /tmp/innerme-benchmark-provider-preflight-request.json /tmp/innerme-benchmark-provider-preflight-response.json /tmp/innerme-benchmark-telemetry-preflight.json /tmp/innerme-benchmark-chat-request.json /tmp/innerme-benchmark-chat-response.sse /tmp/innerme-benchmark-chat-headers.txt /tmp/innerme-benchmark-curl-metrics.txt /tmp/innerme-benchmark-stdout.txt /tmp/innerme-benchmark-provider-usage.json' EXIT

          SUPABASE_URL="https://ofqofhnlzbouclvvrmzd.supabase.co"
          SUPABASE_PUBLISHABLE_KEY="sb_publishable_p4UqpaLvEx_93XJSWvzo6Q_loju0xzW"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("/tmp/innerme-benchmark-login-request.json").write_text(json.dumps({
              "email": os.environ["INNERME_TEST_ADMIN_EMAIL"],
              "password": os.environ["INNERME_TEST_ADMIN_PASSWORD"],
          }), encoding="utf-8")
          PY

          login_status="$(curl --silent --show-error --max-time 20             -o /tmp/innerme-benchmark-login-response.json             -w '%{http_code}'             -X POST "${SUPABASE_URL}/auth/v1/token?grant_type=password"             -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"             -H 'Content-Type: application/json'             --data-binary @/tmp/innerme-benchmark-login-request.json)"
          if [[ "${login_status}" != "200" ]]; then
            echo "::error::Isolated test-admin sign-in failed with HTTP ${login_status}; no chat request was sent."
            exit 1
          fi

          ACCESS_TOKEN="$(python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/innerme-benchmark-login-response.json").read_text(encoding="utf-8"))
          value = payload.get("access_token")
          if not isinstance(value, str) or not value:
              raise SystemExit("Sign-in did not return an access token.")
          print(value, end="")
          PY
          )"
          echo "::add-mask::${ACCESS_TOKEN}"

          # Fail fast before any model request if the isolated project has no
          # Gemini key. The health action returns only a boolean, never secrets.
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("/tmp/innerme-benchmark-provider-preflight-request.json").write_text(json.dumps({
              "action": "innerme_workspace_read_health",
              "message": "Show overdue invoices and payments in a read-only runtime check.",
          }), encoding="utf-8")
          PY

          preflight_status="$(curl --silent --show-error --max-time 30 \
            -o /tmp/innerme-benchmark-provider-preflight-response.json \
            -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/innerme-benchmark-provider-preflight-request.json)"
          if [[ "${preflight_status}" != "200" ]]; then
            echo "::error::Isolated provider preflight returned HTTP ${preflight_status}; no model request was sent."
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path("/tmp/innerme-benchmark-provider-preflight-response.json").read_text(encoding="utf-8")))
          except Exception:
              print("Provider preflight response was not valid JSON.")
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path("/tmp/innerme-benchmark-provider-preflight-response.json").read_text(encoding="utf-8"))
          configured = body.get("provider_configuration", {}).get("gemini_key_configured")
          if not isinstance(configured, bool):
              raise SystemExit("Health probe did not return a boolean Gemini-key configuration status.")
          if configured is not True:
              raise SystemExit(
                  "Benchmark prerequisite missing: GEMINI_API_KEY is not configured in the isolated "
                  "Supabase project's Edge Function secrets. Add a dedicated test key under the "
                  "isolated project's Edge Function secrets, never copy the production key. "
                  "No normal chat request was sent and no model quota was consumed."
              )
          print("PASS: isolated Gemini secret is configured; only now may the single benchmark chat be sent.")
          PY

          # Verify that the read-only telemetry table and admin SELECT policy exist
          # before sending the one provider request.
          telemetry_preflight_status="$(curl --silent --show-error --max-time 15 \
            -o /tmp/innerme-benchmark-telemetry-preflight.json \
            -w '%{http_code}' \
            --get "${SUPABASE_URL}/rest/v1/innerme_provider_usage" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            --data-urlencode 'select=request_id' \
            --data-urlencode 'limit=0')"
          if [[ "${telemetry_preflight_status}" != "200" ]]; then
            echo "::error::Isolated telemetry preflight returned HTTP ${telemetry_preflight_status}; no model request was sent."
            cat /tmp/innerme-benchmark-telemetry-preflight.json
            exit 1
          fi
          echo "PASS: isolated provider telemetry schema and admin read access are ready."

          # Short, stateless, harmless request. This exercises the authenticated SSE chat
          # route, terminal read-only metadata and provider telemetry. It does not
          # ask InnerMe to change workspace records or send messages.
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("/tmp/innerme-benchmark-chat-request.json").write_text(json.dumps({
              "action": "assistant_chat",
              "message": "What does the InnerMe roadmap say Phase 29 covers? Answer in one concise sentence and distinguish documented scope from runtime-tested behaviour.",
              "stream_response": True,
          }), encoding="utf-8")
          PY

          curl --silent --show-error --max-time 45             -D /tmp/innerme-benchmark-chat-headers.txt             -o /tmp/innerme-benchmark-chat-response.sse             -w '%{http_code}\t%{time_total}'             -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai"             -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"             -H "Authorization: Bearer ${ACCESS_TOKEN}"             -H 'Content-Type: application/json'             --data-binary @/tmp/innerme-benchmark-chat-request.json             > /tmp/innerme-benchmark-curl-metrics.txt

          python3 - <<'PY' > /tmp/innerme-benchmark-stdout.txt
          from pathlib import Path
          import json
          import re
          import uuid

          metrics = Path("/tmp/innerme-benchmark-curl-metrics.txt").read_text(encoding="utf-8").strip().split("\t")
          if len(metrics) != 2:
              raise SystemExit(f"Unexpected curl metrics format: {metrics!r}")
          status, total_seconds = metrics
          print(f"HTTP_STATUS={status}")
          print(f"HTTP_TOTAL_SECONDS={total_seconds}")

          headers = {}
          for line in Path("/tmp/innerme-benchmark-chat-headers.txt").read_text(encoding="utf-8", errors="replace").splitlines():
              if ":" in line:
                  key, value = line.split(":", 1)
                  headers[key.strip().lower()] = value.strip()

          raw_stream = Path("/tmp/innerme-benchmark-chat-response.sse").read_text(encoding="utf-8", errors="replace")
          if status != "200":
              try:
                  error_payload = json.loads(raw_stream)
                  reason = error_payload.get("error") or error_payload.get("message") or error_payload
              except Exception:
                  reason = raw_stream[:300]
              raise SystemExit(f"Streaming chat failed with HTTP {status}: {reason}")

          content_type = headers.get("content-type", "").lower()
          if "text/event-stream" not in content_type:
              raise SystemExit(f"Expected an SSE response, received content type {content_type!r}.")

          request_id = headers.get("x-innerme-request-id", "")
          try:
              uuid.UUID(request_id)
          except (ValueError, AttributeError):
              raise SystemExit("Streaming response is missing its correlated X-InnerMe-Request-ID header.")

          frames = raw_stream.replace("\r\n", "\n").split("\n\n")
          events = []
          for frame in frames:
              if not frame.strip():
                  continue
              event_name = "message"
              data_lines = []
              for line in frame.splitlines():
                  if line.startswith("event:"):
                      event_name = line[len("event:"):].strip()
                  elif line.startswith("data:"):
                      data_lines.append(line[len("data:"):].lstrip(" "))
              if not data_lines:
                  continue
              data_text = "\n".join(data_lines).strip()
              if not data_text or data_text == "[DONE]":
                  continue
              try:
                  event_payload = json.loads(data_text)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid JSON in SSE event {event_name!r}: {exc}")
              events.append((event_name, event_payload))

          if not events:
              raise SystemExit("The SSE response contained no parseable events.")
          errors = [payload for name, payload in events if name == "error"]
          if errors:
              first_error = errors[0]
              raise SystemExit("Streaming returned an error event: " + str(first_error.get("error", first_error))[:300])

          deltas = [payload for name, payload in events if name == "delta"]
          if not deltas:
              raise SystemExit("The SSE response did not contain any delta events.")
          if any(not isinstance(payload, dict) or not isinstance(payload.get("text"), str) for payload in deltas):
              raise SystemExit("A stream delta event did not contain text.")

          done_events = [payload for name, payload in events if name == "done"]
          if len(done_events) != 1:
              raise SystemExit(f"Expected one terminal done event, received {len(done_events)}.")
          payload = done_events[0]
          if not isinstance(payload.get("answer"), str) or not payload["answer"].strip():
              raise SystemExit("The terminal done event did not include a final answer.")
          if payload.get("read_only") is not True:
              raise SystemExit("Streaming response did not affirm its read-only contract.")

          knowledge = payload.get("knowledge_retrieval")
          if not isinstance(knowledge, dict):
              raise SystemExit("The terminal done event did not include knowledge-retrieval status.")
          retrieval_error = knowledge.get("retrieval_error")
          if retrieval_error:
              raise SystemExit("Streaming chat knowledge retrieval failed: " + str(retrieval_error)[:300])
          match_count = knowledge.get("match_count")
          if not isinstance(match_count, int) or match_count < 0:
              raise SystemExit("Streaming chat returned an invalid knowledge match count.")
          if match_count != 0:
              raise SystemExit("Expected zero retrieved knowledge records for this isolated no-evidence test; citation-abstention result is inconclusive.")
          markers = re.findall(r"(?<!\\w)\\[(?:[1-9]\\d*)\\]", payload["answer"])
          if markers:
              raise SystemExit("FAIL: answer fabricated numbered knowledge citations with zero retrieved records: " + ", ".join(markers))
          print("CITATION_ABSTENTION=pass")
          print("KNOWLEDGE_MATCH_COUNT=0")
          print("NUMERIC_CITATIONS=0")
          print("FINAL_ANSWER=" + " ".join(payload["answer"].split()))

          delta_chars = sum(len(item["text"]) for item in deltas)
          if delta_chars <= 0:
              raise SystemExit("Streaming returned no answer text across delta events.")

          print("STREAM_STATUS=healthy")
          print("CONTENT_TYPE=" + content_type)
          print("STREAM_EVENT_COUNT=" + str(len(events)))
          print("DELTA_EVENT_COUNT=" + str(len(deltas)))
          print("STREAMED_DELTA_CHARS=" + str(delta_chars))
          print("FINAL_ANSWER_CHARS=" + str(len(payload["answer"])))
          print("KNOWLEDGE_RETRIEVAL_STATUS=healthy")
          print("KNOWLEDGE_MATCH_COUNT=" + str(match_count))
          print("REQUEST_ID=" + request_id)
          print("PASS: isolated authenticated chat returned SSE delta events and one read-only terminal done event.")
          PY
          cat /tmp/innerme-benchmark-stdout.txt
          REQUEST_ID="$(sed -n 's/^REQUEST_ID=//p' /tmp/innerme-benchmark-stdout.txt | tail -n 1)"
          if [[ -z "${REQUEST_ID}" ]]; then
            echo "::error::Could not recover the request ID from benchmark validation."
            exit 1
          fi

          # Use the authenticated isolated admin JWT. The telemetry table intentionally
          # grants SELECT to authenticated admins, not to the service_role API key.
          curl --silent --show-error --fail-with-body --max-time 20 \
            --get "${SUPABASE_URL}/rest/v1/innerme_provider_usage" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            --data-urlencode 'select=request_id,attempt_number,task_category,provider,model,outcome,http_status,latency_ms,input_tokens,output_tokens,total_tokens,error_code,fallback_reason' \
            --data-urlencode "request_id=eq.${REQUEST_ID}" \
            --data-urlencode 'order=attempt_number.asc' \
            -o /tmp/innerme-benchmark-provider-usage.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("/tmp/innerme-benchmark-provider-usage.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list) or len(rows) != 1:
              raise SystemExit("Expected exactly one provider attempt.")
          if rows[0].get("provider") != "gemini" or rows[0].get("outcome") != "success":
              raise SystemExit("Expected exactly one successful Gemini provider attempt.")
          for row in rows:
              if row.get("task_category") != "assistant_chat":
                  raise SystemExit(f"Unexpected telemetry task category for chat request: {row!r}")
              latency = row.get("latency_ms")
              if not isinstance(latency, int) or latency < 0:
                  raise SystemExit(f"Provider-attempt latency is missing or invalid: {row!r}")
          print("PROVIDER_ATTEMPTS=" + str(len(rows)))
          print("PROVIDER_TELEMETRY=" + json.dumps([{
              "attempt": row["attempt_number"],
              "provider": row["provider"],
              "model": row["model"],
              "outcome": row["outcome"],
              "http_status": row["http_status"],
              "latency_ms": row["latency_ms"],
              "input_tokens": row["input_tokens"],
              "output_tokens": row["output_tokens"],
              "error_code": row["error_code"],
              "fallback_reason": row["fallback_reason"],
          } for row in rows], separators=(",", ":")))
          print("PASS: provider latency/token telemetry is correlated to the same normal chat request.")
          PY


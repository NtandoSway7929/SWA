name: InnerMe Isolated Normal Chat Performance Benchmark

on:
  workflow_dispatch:
    inputs:
      confirm_no_billing:
        description: "Confirm the isolated test project's Gemini key comes from a separate project with billing disabled"
        required: true
        type: boolean
        default: false
      preview_ui_only:
        description: "Run browser-only UI QA; do not send a model/provider request"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: innerme-isolated-normal-chat-performance-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Measure one isolated authenticated read-only chat
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require isolated credentials and no-billing confirmation
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
          CONFIRM_NO_BILLING: ${{ inputs.confirm_no_billing }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRM_NO_BILLING}" != "true" ]]; then
            echo "::error::Stop: confirm that the isolated test provider key belongs to a Google project with billing disabled."
            exit 1
          fi
          for name in INNERME_TEST_ADMIN_EMAIL INNERME_TEST_ADMIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret ${name}. Use isolated test-project credentials only."
              exit 1
            fi
          done

      - name: Run one read-only chat and correlate provider telemetry
        if: ${{ inputs.preview_ui_only != true }}
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/innerme-benchmark-login-request.json /tmp/innerme-benchmark-login-response.json /tmp/innerme-benchmark-provider-preflight-request.json /tmp/innerme-benchmark-provider-preflight-response.json /tmp/innerme-benchmark-telemetry-preflight.json /tmp/innerme-benchmark-chat-request.json /tmp/innerme-benchmark-chat-response.sse /tmp/innerme-benchmark-chat-headers.txt /tmp/innerme-benchmark-curl-metrics.txt /tmp/innerme-benchmark-stdout.txt /tmp/innerme-benchmark-provider-usage.json' EXIT

          SUPABASE_URL="https://ofqofhnlzbouclvvrmzd.supabase.co"
          SUPABASE_PUBLISHABLE_KEY="sb_publishable_p4UqpaLvEx_93XJSWvzo6Q_loju0xzW"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("/tmp/innerme-benchmark-login-request.json").write_text(json.dumps({
              "email": os.environ["INNERME_TEST_ADMIN_EMAIL"],
              "password": os.environ["INNERME_TEST_ADMIN_PASSWORD"],
          }), encoding="utf-8")
          PY

          login_status="$(curl --silent --show-error --max-time 20             -o /tmp/innerme-benchmark-login-response.json             -w '%{http_code}'             -X POST "${SUPABASE_URL}/auth/v1/token?grant_type=password"             -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"             -H 'Content-Type: application/json'             --data-binary @/tmp/innerme-benchmark-login-request.json)"
          if [[ "${login_status}" != "200" ]]; then
            echo "::error::Isolated test-admin sign-in failed with HTTP ${login_status}; no chat request was sent."
            exit 1
          fi

          ACCESS_TOKEN="$(python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/innerme-benchmark-login-response.json").read_text(encoding="utf-8"))
          value = payload.get("access_token")
          if not isinstance(value, str) or not value:
              raise SystemExit("Sign-in did not return an access token.")
          print(value, end="")
          PY
          )"
          echo "::add-mask::${ACCESS_TOKEN}"

          # Fail fast before any model request if the isolated project has no
          # Gemini key. The health action returns only a boolean, never secrets.
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("/tmp/innerme-benchmark-provider-preflight-request.json").write_text(json.dumps({
              "action": "innerme_workspace_read_health",
              "message": "Show overdue invoices and payments in a read-only runtime check.",
          }), encoding="utf-8")
          PY

          preflight_status="$(curl --silent --show-error --max-time 30 \
            -o /tmp/innerme-benchmark-provider-preflight-response.json \
            -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/innerme-benchmark-provider-preflight-request.json)"
          if [[ "${preflight_status}" != "200" ]]; then
            echo "::error::Isolated provider preflight returned HTTP ${preflight_status}; no model request was sent."
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path("/tmp/innerme-benchmark-provider-preflight-response.json").read_text(encoding="utf-8")))
          except Exception:
              print("Provider preflight response was not valid JSON.")
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path("/tmp/innerme-benchmark-provider-preflight-response.json").read_text(encoding="utf-8"))
          configured = body.get("provider_configuration", {}).get("gemini_key_configured")
          if not isinstance(configured, bool):
              raise SystemExit("Health probe did not return a boolean Gemini-key configuration status.")
          if configured is not True:
              raise SystemExit(
                  "Benchmark prerequisite missing: GEMINI_API_KEY is not configured in the isolated "
                  "Supabase project's Edge Function secrets. Add a dedicated test key under the "
                  "isolated project's Edge Function secrets, never copy the production key. "
                  "No normal chat request was sent and no model quota was consumed."
              )
          print("PASS: isolated Gemini secret is configured; only now may the single benchmark chat be sent.")
          PY

          # Verify that the read-only telemetry table and admin SELECT policy exist
          # before sending the one provider request.
          telemetry_preflight_status="$(curl --silent --show-error --max-time 15 \
            -o /tmp/innerme-benchmark-telemetry-preflight.json \
            -w '%{http_code}' \
            --get "${SUPABASE_URL}/rest/v1/innerme_provider_usage" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            --data-urlencode 'select=request_id' \
            --data-urlencode 'limit=0')"
          if [[ "${telemetry_preflight_status}" != "200" ]]; then
            echo "::error::Isolated telemetry preflight returned HTTP ${telemetry_preflight_status}; no model request was sent."
            cat /tmp/innerme-benchmark-telemetry-preflight.json
            exit 1
          fi
          echo "PASS: isolated provider telemetry schema and admin read access are ready."

          # Short, stateless, harmless request. This exercises the authenticated SSE chat
          # route, terminal read-only metadata and provider telemetry. It does not
          # ask InnerMe to change workspace records or send messages.
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path("/tmp/innerme-benchmark-chat-request.json").write_text(json.dumps({
              "action": "assistant_chat",
              "message": "Explain caching in one sentence.",
              "stream_response": True,
          }), encoding="utf-8")
          PY

          curl --silent --show-error --max-time 45             -D /tmp/innerme-benchmark-chat-headers.txt             -o /tmp/innerme-benchmark-chat-response.sse             -w '%{http_code}\t%{time_total}'             -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai"             -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"             -H "Authorization: Bearer ${ACCESS_TOKEN}"             -H 'Content-Type: application/json'             --data-binary @/tmp/innerme-benchmark-chat-request.json             > /tmp/innerme-benchmark-curl-metrics.txt

          python3 - <<'PY' > /tmp/innerme-benchmark-stdout.txt
          from pathlib import Path
          import json
          import uuid

          metrics = Path("/tmp/innerme-benchmark-curl-metrics.txt").read_text(encoding="utf-8").strip().split("\t")
          if len(metrics) != 2:
              raise SystemExit(f"Unexpected curl metrics format: {metrics!r}")
          status, total_seconds = metrics
          print(f"HTTP_STATUS={status}")
          print(f"HTTP_TOTAL_SECONDS={total_seconds}")

          headers = {}
          for line in Path("/tmp/innerme-benchmark-chat-headers.txt").read_text(encoding="utf-8", errors="replace").splitlines():
              if ":" in line:
                  key, value = line.split(":", 1)
                  headers[key.strip().lower()] = value.strip()

          raw_stream = Path("/tmp/innerme-benchmark-chat-response.sse").read_text(encoding="utf-8", errors="replace")
          if status != "200":
              try:
                  error_payload = json.loads(raw_stream)
                  reason = error_payload.get("error") or error_payload.get("message") or error_payload
              except Exception:
                  reason = raw_stream[:300]
              raise SystemExit(f"Streaming chat failed with HTTP {status}: {reason}")

          content_type = headers.get("content-type", "").lower()
          if "text/event-stream" not in content_type:
              raise SystemExit(f"Expected an SSE response, received content type {content_type!r}.")

          request_id = headers.get("x-innerme-request-id", "")
          try:
              uuid.UUID(request_id)
          except (ValueError, AttributeError):
              raise SystemExit("Streaming response is missing its correlated X-InnerMe-Request-ID header.")

          frames = raw_stream.replace("\r\n", "\n").split("\n\n")
          events = []
          for frame in frames:
              if not frame.strip():
                  continue
              event_name = "message"
              data_lines = []
              for line in frame.splitlines():
                  if line.startswith("event:"):
                      event_name = line[len("event:"):].strip()
                  elif line.startswith("data:"):
                      data_lines.append(line[len("data:"):].lstrip(" "))
              if not data_lines:
                  continue
              data_text = "\n".join(data_lines).strip()
              if not data_text or data_text == "[DONE]":
                  continue
              try:
                  event_payload = json.loads(data_text)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"Invalid JSON in SSE event {event_name!r}: {exc}")
              events.append((event_name, event_payload))

          if not events:
              raise SystemExit("The SSE response contained no parseable events.")
          errors = [payload for name, payload in events if name == "error"]
          if errors:
              first_error = errors[0]
              raise SystemExit("Streaming returned an error event: " + str(first_error.get("error", first_error))[:300])

          deltas = [payload for name, payload in events if name == "delta"]
          if not deltas:
              raise SystemExit("The SSE response did not contain any delta events.")
          if any(not isinstance(payload, dict) or not isinstance(payload.get("text"), str) for payload in deltas):
              raise SystemExit("A stream delta event did not contain text.")

          done_events = [payload for name, payload in events if name == "done"]
          if len(done_events) != 1:
              raise SystemExit(f"Expected one terminal done event, received {len(done_events)}.")
          payload = done_events[0]
          if not isinstance(payload.get("answer"), str) or not payload["answer"].strip():
              raise SystemExit("The terminal done event did not include a final answer.")
          if payload.get("read_only") is not True:
              raise SystemExit("Streaming response did not affirm its read-only contract.")

          knowledge = payload.get("knowledge_retrieval")
          if not isinstance(knowledge, dict):
              raise SystemExit("The terminal done event did not include knowledge-retrieval status.")
          retrieval_error = knowledge.get("retrieval_error")
          if retrieval_error:
              raise SystemExit("Streaming chat knowledge retrieval failed: " + str(retrieval_error)[:300])
          match_count = knowledge.get("match_count")
          if not isinstance(match_count, int) or match_count < 0:
              raise SystemExit("Streaming chat returned an invalid knowledge match count.")

          delta_chars = sum(len(item["text"]) for item in deltas)
          if delta_chars <= 0:
              raise SystemExit("Streaming returned no answer text across delta events.")

          print("STREAM_STATUS=healthy")
          print("CONTENT_TYPE=" + content_type)
          print("STREAM_EVENT_COUNT=" + str(len(events)))
          print("DELTA_EVENT_COUNT=" + str(len(deltas)))
          print("STREAMED_DELTA_CHARS=" + str(delta_chars))
          print("FINAL_ANSWER_CHARS=" + str(len(payload["answer"])))
          print("KNOWLEDGE_RETRIEVAL_STATUS=healthy")
          print("KNOWLEDGE_MATCH_COUNT=" + str(match_count))
          print("REQUEST_ID=" + request_id)
          print("PASS: isolated authenticated chat returned SSE delta events and one read-only terminal done event.")
          PY
          cat /tmp/innerme-benchmark-stdout.txt
          REQUEST_ID="$(sed -n 's/^REQUEST_ID=//p' /tmp/innerme-benchmark-stdout.txt | tail -n 1)"
          if [[ -z "${REQUEST_ID}" ]]; then
            echo "::error::Could not recover the request ID from benchmark validation."
            exit 1
          fi

          # Use the authenticated isolated admin JWT. The telemetry table intentionally
          # grants SELECT to authenticated admins, not to the service_role API key.
          curl --silent --show-error --fail-with-body --max-time 20 \
            --get "${SUPABASE_URL}/rest/v1/innerme_provider_usage" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            --data-urlencode 'select=request_id,attempt_number,task_category,provider,model,outcome,http_status,latency_ms,input_tokens,output_tokens,total_tokens,error_code,fallback_reason' \
            --data-urlencode "request_id=eq.${REQUEST_ID}" \
            --data-urlencode 'order=attempt_number.asc' \
            -o /tmp/innerme-benchmark-provider-usage.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("/tmp/innerme-benchmark-provider-usage.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list) or not rows:
              raise SystemExit("No provider telemetry was found for this request ID. Check the isolated telemetry table and its service-role grants.")
          for row in rows:
              if row.get("task_category") != "assistant_chat":
                  raise SystemExit(f"Unexpected telemetry task category for chat request: {row!r}")
              latency = row.get("latency_ms")
              if not isinstance(latency, int) or latency < 0:
                  raise SystemExit(f"Provider-attempt latency is missing or invalid: {row!r}")
          print("PROVIDER_ATTEMPTS=" + str(len(rows)))
          print("PROVIDER_TELEMETRY=" + json.dumps([{
              "attempt": row["attempt_number"],
              "provider": row["provider"],
              "model": row["model"],
              "outcome": row["outcome"],
              "http_status": row["http_status"],
              "latency_ms": row["latency_ms"],
              "input_tokens": row["input_tokens"],
              "output_tokens": row["output_tokens"],
              "error_code": row["error_code"],
              "fallback_reason": row["fallback_reason"],
          } for row in rows], separators=(",", ":")))
          print("PASS: provider latency/token telemetry is correlated to the same normal chat request.")
          PY


      - name: Smoke-test responsive InnerMe UI preview without a provider request
        if: ${{ inputs.preview_ui_only == true }}
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${INNERME_TEST_ADMIN_EMAIL}" || { echo "::error::Missing isolated test-admin email secret."; exit 1; }
          test -n "${INNERME_TEST_ADMIN_PASSWORD}" || { echo "::error::Missing isolated test-admin password secret."; exit 1; }

          npm init -y >/dev/null
          npm install --no-save playwright
          npx playwright install --with-deps chromium

          node <<'NODE'
          const { chromium } = require("playwright");
          const fs = require("node:fs/promises");

          const baseUrl = "https://ntandosway7929.github.io/innerme-chat-ui-preview/";
          const testOrigin = "https://ofqofhnlzbouclvvrmzd.supabase.co";
          const productionHost = "sqifhribgsqfaxgtobsa.supabase.co";
          const email = process.env.INNERME_TEST_ADMIN_EMAIL;
          const password = process.env.INNERME_TEST_ADMIN_PASSWORD;
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function main() {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1
            });
            const page = await context.newPage();
            page.setDefaultTimeout(15000);

            const productionRequests = [];
            const assistantPosts = [];
            const externalSupabaseRequests = [];
            const pageErrors = [];
            const guardWarnings = [];
            const consoleErrors = [];
            page.on("request", request => {
              let url;
              try { url = new URL(request.url()); } catch (_) { return; }
              const method = request.method().toUpperCase();
              if (url.hostname === productionHost) {
                productionRequests.push({ method, path: url.pathname });
              }
              if (url.hostname.endsWith(".supabase.co") && url.origin !== testOrigin) {
                externalSupabaseRequests.push({ method, host: url.hostname, path: url.pathname });
              }
              if (url.origin === testOrigin && method === "POST" &&
                  url.pathname === "/functions/v1/swayphics-ai") {
                assistantPosts.push({ path: url.pathname });
              }
            });
            page.on("pageerror", error => pageErrors.push(String(error.message || error).slice(0, 300)));
            page.on("console", message => {
              const value = message.text();
              if (message.type() === "error") consoleErrors.push(value.slice(0, 300));
              if (value.includes("[InnerMe test preview safety gate]")) guardWarnings.push(value.slice(0, 300));
            });

            await page.goto(baseUrl + "admin/index.html", {
              waitUntil: "domcontentloaded",
              timeout: 60000
            });
            await page.locator("#innerme-test-preview-banner").waitFor({ state: "visible" });
            await page.locator("#admin-email").fill(email);
            await page.locator("#admin-password").fill(password);
            await page.locator("#login-button").click();

            await page.waitForURL(url =>
              url.hostname === "ntandosway7929.github.io" &&
              url.pathname.includes("/innerme-chat-ui-preview/admin-dashboard/"),
              { timeout: 45000 }
            );
            await page.locator("#sway-admin-workspace").waitFor({ state: "attached", timeout: 45000 });
            await page.locator('[data-nav-group-toggle="innerme"]').waitFor({ state: "visible", timeout: 30000 });

            const innermeGroup = page.locator('[data-nav-group-toggle="innerme"]');
            if (await innermeGroup.getAttribute("aria-expanded") !== "true") {
              await innermeGroup.click();
            }
            const chatNav = page.locator('[data-view="swayphics-ai"]');
            await chatNav.waitFor({ state: "visible" });
            await chatNav.click();
            const composer = page.locator("#sway-ai-input");
            try {
              await composer.waitFor({ state: "visible", timeout: 30000 });
            } catch (error) {
              const diagnostic = await page.evaluate(() => {
                const chat = document.querySelector(".sway-innerme-chat-view");
                const input = document.querySelector("#sway-ai-input");
                const main = document.querySelector("#sway-workspace-main");
                return {
                  pathname: location.pathname,
                  pageTitle: document.title,
                  composerCount: document.querySelectorAll("#sway-ai-input").length,
                  composer: input ? {
                    hidden: input.hidden,
                    display: getComputedStyle(input).display,
                    visibility: getComputedStyle(input).visibility,
                    width: Math.round(input.getBoundingClientRect().width),
                    height: Math.round(input.getBoundingClientRect().height)
                  } : null,
                  chatSection: chat ? {
                    hidden: chat.hidden,
                    ariaHidden: chat.getAttribute("aria-hidden"),
                    display: getComputedStyle(chat).display,
                    className: chat.className
                  } : null,
                  innermeSections: Array.from(document.querySelectorAll("[data-innerme-section]")).map(el => ({
                    name: el.dataset.innermeSection,
                    hidden: el.hidden,
                    ariaHidden: el.getAttribute("aria-hidden")
                  })),
                  navButtons: Array.from(document.querySelectorAll("[data-view]"))
                    .filter(el => /chat|innerme/i.test(el.textContent || ""))
                    .map(el => ({
                      text: (el.textContent || "").trim().slice(0, 80),
                      view: el.dataset.view,
                      active: el.classList.contains("active"),
                      display: getComputedStyle(el).display
                    })).slice(0, 15),
                  mainClass: main ? main.className : null,
                  testBannerVisible: Boolean(document.querySelector("#innerme-test-preview-banner") &&
                    document.querySelector("#innerme-test-preview-banner").getBoundingClientRect().height > 0)
                };
              });
              console.log("PRE_COMPOSER_DIAGNOSTIC=" + JSON.stringify(diagnostic));
              console.log("PAGE_ERRORS_BEFORE_COMPOSER=" + JSON.stringify(pageErrors.slice(0, 8)));
              console.log("CONSOLE_ERRORS_BEFORE_COMPOSER=" + JSON.stringify(consoleErrors.slice(0, 8)));
              throw error;
            }
            await page.waitForFunction(() => {
              const chat = document.querySelector(".sway-innerme-chat-view");
              return Boolean(chat && !chat.hidden);
            }, null, { timeout: 15000 });

            const promptButtons = page.locator(".sway-innerme-chat-view [data-ai-prompt]");
            const promptCount = await promptButtons.count();
            if (promptCount < 3) {
              throw new Error("Expected at least three InnerMe quick prompts; found " + promptCount + ".");
            }
            const promptLabels = (await promptButtons.allTextContents())
              .map(label => label.replace(/\\s+/g, " ").trim())
              .filter(Boolean);
            const expectedPrompts = [
              "What should I do today?",
              "Where is revenue leaking?",
              "Which lead first?",
              "3-step plan"
            ];
            const missingPrompts = expectedPrompts.filter(expected =>
              !promptLabels.some(label => label.includes(expected))
            );
            if (missingPrompts.length) {
              throw new Error("Quick prompt labels are missing: " + JSON.stringify(missingPrompts));
            }
            const composerInitiallyEmpty = !(await composer.inputValue()).trim();
            if (!composerInitiallyEmpty) {
              throw new Error("Chat composer unexpectedly contained a message before testing.");
            }

            const bannerText = await page.evaluate(() => {
              const banner = document.querySelector("#innerme-test-preview-banner");
              return banner
                ? String(banner.innerText || banner.textContent || "").replace(/\\s+/g, " ").trim()
                : "not present after dashboard navigation";
            });
            const themeToggle = page.locator("#admin-theme-toggle");
            await themeToggle.waitFor({ state: "visible" });
            const lightMetrics = await page.evaluate(() => {
              const composer = document.querySelector("#sway-ai-input");
              const rect = composer.getBoundingClientRect();
              return {
                viewportWidth: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                bodyWidth: document.body.scrollWidth,
                composerWidth: Math.round(rect.width),
                composerLeft: Math.round(rect.left),
                composerRight: Math.round(rect.right),
                composerVisible: rect.width > 0 && rect.height > 0,
                chatViewActive: Boolean(document.querySelector(".sway-innerme-chat-view") &&
                  !document.querySelector(".sway-innerme-chat-view").hidden)
              };
            });
            if (!lightMetrics.chatViewActive || !lightMetrics.composerVisible) {
              throw new Error("Chat view/composer was not visible in desktop light mode.");
            }
            if (lightMetrics.documentWidth > lightMetrics.viewportWidth + 2) {
              throw new Error("Desktop layout has horizontal overflow: " + JSON.stringify(lightMetrics));
            }
            await fs.mkdir("/tmp/innerme-ui-screenshots", { recursive: true });
            await page.screenshot({ path: "/tmp/innerme-ui-screenshots/desktop-light.png", fullPage: true });

            await themeToggle.click();
            await page.waitForFunction(() => document.body.classList.contains("sway-dark-mode"), null, { timeout: 10000 });
            const darkThemeActive = await page.locator("body").evaluate(el => el.classList.contains("sway-dark-mode"));
            if (!darkThemeActive) throw new Error("Theme toggle did not activate dark mode.");
            await page.screenshot({ path: "/tmp/innerme-ui-screenshots/desktop-dark.png", fullPage: true });

            await page.setViewportSize({ width: 390, height: 844 });
            await wait(250);
            const mobileMetrics = await page.evaluate(() => {
              const composer = document.querySelector("#sway-ai-input");
              const rect = composer.getBoundingClientRect();
              const banner = document.querySelector("#innerme-test-preview-banner");
              const bannerRect = banner.getBoundingClientRect();
              return {
                viewportWidth: window.innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                bodyWidth: document.body.scrollWidth,
                composerWidth: Math.round(rect.width),
                composerLeft: Math.round(rect.left),
                composerRight: Math.round(rect.right),
                composerBottom: Math.round(rect.bottom),
                bannerWidth: Math.round(bannerRect.width),
                bannerBottom: Math.round(bannerRect.bottom),
                composerVisible: rect.width > 0 && rect.height > 0,
                chatViewActive: Boolean(document.querySelector(".sway-innerme-chat-view") &&
                  !document.querySelector(".sway-innerme-chat-view").hidden),
                darkModeActive: document.body.classList.contains("sway-dark-mode")
              };
            });
            if (!mobileMetrics.composerVisible || !mobileMetrics.chatViewActive) {
              throw new Error("Chat composer did not remain visible at mobile width: " + JSON.stringify(mobileMetrics));
            }
            if (mobileMetrics.documentWidth > 392 || mobileMetrics.bodyWidth > 392) {
              throw new Error("Mobile layout has horizontal overflow: " + JSON.stringify(mobileMetrics));
            }
            if (mobileMetrics.composerRight > 392 || mobileMetrics.composerLeft < -2) {
              throw new Error("Mobile composer extends outside the viewport: " + JSON.stringify(mobileMetrics));
            }
            if (mobileMetrics.composerBottom < mobileMetrics.bannerBottom) {
              throw new Error("Mobile composer position unexpectedly conflicts with the preview banner.");
            }
            await page.screenshot({ path: "/tmp/innerme-ui-screenshots/mobile-dark.png", fullPage: true });

            if (productionRequests.length || externalSupabaseRequests.length) {
              throw new Error("Detected a request to a non-test Supabase origin: " +
                JSON.stringify({ productionRequests, externalSupabaseRequests }));
            }
            if (assistantPosts.length) {
              throw new Error("UI-only smoke test unexpectedly submitted a provider/chat request.");
            }

            const screenshotFiles = await fs.readdir("/tmp/innerme-ui-screenshots");
            console.log("PREVIEW_URL=" + baseUrl);
            console.log("LOGIN_STATUS=passed");
            console.log("CHAT_VIEW=visible");
            console.log("QUICK_PROMPTS=" + promptCount);
            console.log("QUICK_PROMPT_LABELS=" + JSON.stringify(expectedPrompts));
            console.log("COMPOSER_EMPTY_NO_PROMPT_SENT=" + composerInitiallyEmpty);
            console.log("DARK_MODE=passed");
            console.log("DESKTOP_LIGHT_LAYOUT=" + JSON.stringify(lightMetrics));
            console.log("MOBILE_DARK_LAYOUT=" + JSON.stringify(mobileMetrics));
            console.log("SCREENSHOT_CAPTURE_COUNT=" + screenshotFiles.length);
            console.log("PREVIEW_BANNER=" + bannerText);
            console.log("PRODUCTION_SUPABASE_REQUESTS=" + productionRequests.length);
            console.log("EXTERNAL_SUPABASE_REQUESTS=" + externalSupabaseRequests.length);
            console.log("MODEL_CHAT_POSTS=" + assistantPosts.length);
            console.log("PAGE_ERROR_COUNT=" + pageErrors.length);
            console.log("CONSOLE_ERROR_COUNT=" + consoleErrors.length);
            console.log("SAFETY_GUARD_WARNING_COUNT=" + guardWarnings.length);
            if (pageErrors.length) {
              console.log("PAGE_ERRORS=" + JSON.stringify(pageErrors.slice(0, 5)));
              throw new Error("Browser raised uncaught page errors.");
            }
            await browser.close();
          }

          main().catch(error => {
            console.error("ISOLATED_PREVIEW_UI_TEST_FAILED=" + String(error && error.message || error).slice(0, 1000));
            process.exit(1);
          });
          NODE

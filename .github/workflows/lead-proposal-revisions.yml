name: Lead proposal revision history QA

on:
  pull_request:
    branches:
      - main
    paths:
      - "admin-dashboard/admin-workspace.js"
      - "admin-dashboard/admin-workspace.css"
      - "admin-dashboard/index.html"
      - "scripts/admin-lead-cards.test.cjs"
      - "scripts/lead-proposal-revision-migration.test.cjs"
      - "supabase/migrations/20261128090000_lead_proposal_revision_history.sql"
      - "supabase/tests/lead-proposal-revisions*"
      - "supabase/tests/lead-proposal_sql_syntax_check.py"
      - ".github/workflows/lead-proposal-revisions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lead-proposal-revisions-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  source-and-sql-contracts:
    name: Proposal editor and SQL syntax contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Check proposal editor JavaScript
        run: |
          node --check admin-dashboard/admin-workspace.js
          node scripts/admin-lead-cards.test.cjs
          node scripts/lead-proposal-revision-migration.test.cjs

      - name: Install PostgreSQL parser
        run: python -m pip install --disable-pip-version-check pglast

      - name: Parse proposal migration and disposable database fixtures
        run: python supabase/tests/lead-proposal_sql_syntax_check.py

  disposable-database:
    name: Disposable Supabase proposal revision tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_WORKDIR: /tmp/lead-proposal-revision-project
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Prepare isolated Supabase workdir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SUPABASE_WORKDIR"
          supabase init --workdir "$SUPABASE_WORKDIR"
          sed -i '/^\[db\]$/,/^\[/ s/^port = 54322$/port = 56323/' "$SUPABASE_WORKDIR/supabase/config.toml"
          mkdir -p "$SUPABASE_WORKDIR/supabase/tests"
          cp supabase/tests/lead-proposal-revisions.test.sql "$SUPABASE_WORKDIR/supabase/tests/lead-proposal-revisions.test.sql"
          rm -f "$SUPABASE_WORKDIR/supabase/seed.sql"

      - name: Start isolated local Supabase
        working-directory: /tmp/lead-proposal-revision-project
        run: supabase start

      - name: Create isolated CRM schema fixture
        shell: bash
        working-directory: /tmp/lead-proposal-revision-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/lead-proposal-revisions-baseline.sql"

      - name: Apply proposal revision migration
        shell: bash
        working-directory: /tmp/lead-proposal-revision-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128090000_lead_proposal_revision_history.sql"

      - name: Run proposal revision database tests
        working-directory: /tmp/lead-proposal-revision-project
        run: supabase test db supabase/tests/lead-proposal-revisions.test.sql

      - name: Stop isolated Supabase
        if: always()
        working-directory: /tmp/lead-proposal-revision-project
        run: supabase stop --no-backup

name: Validate proposal demo sharing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Edge Function and check provider-free handler syntax
        run: |
          deno check --no-lock supabase/functions/proposal-demo-share/index.ts
          node --check supabase/functions/proposal-demo-share/handler.mjs

      - name: Verify demo share authorization and lifecycle
        run: node --test scripts/proposal-demo-share.test.mjs

name: Validate proposal demo sharing

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Edge Function and provider-free handler syntax
        run: |
          node --experimental-strip-types --check supabase/functions/proposal-demo-share/index.ts
          node --check supabase/functions/proposal-demo-share/handler.mjs

      - name: Verify demo share authorization and lifecycle
        run: node --test scripts/proposal-demo-share.test.mjs

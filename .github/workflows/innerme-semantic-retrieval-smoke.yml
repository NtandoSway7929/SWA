name: InnerMe Isolated Semantic Retrieval Regression Suite

on:
  workflow_dispatch:
    inputs:
      confirm_no_billing:
        description: "Confirm the isolated test project's Gemini key belongs to a separate Google project with billing disabled"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: innerme-isolated-semantic-retrieval-regression
  cancel-in-progress: false

jobs:
  semantic-retrieval-regression:
    name: Verify retrieval quality, eligibility filters and chat grounding
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require isolated credentials and no-billing confirmation
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
          CONFIRM_NO_BILLING: ${{ inputs.confirm_no_billing }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRM_NO_BILLING}" != "true" ]]; then
            echo "::error::Stop: confirm that the isolated test provider key belongs to a separate Google project with billing disabled."
            exit 1
          fi
          for name in INNERME_TEST_ADMIN_EMAIL INNERME_TEST_ADMIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret ${name}. Use isolated test-project credentials only."
              exit 1
            fi
          done

      - name: Check out the versioned regression baseline
        uses: actions/checkout@v4

      - name: Run isolated semantic retrieval regression suite
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/innerme-semantic-login-request.json /tmp/innerme-semantic-login-response.json /tmp/innerme-semantic-baseline-request.json /tmp/innerme-semantic-regression-response.json /tmp/innerme-semantic-regression-headers.txt' EXIT

          SUPABASE_URL="https://ofqofhnlzbouclvvrmzd.supabase.co"
          SUPABASE_PUBLISHABLE_KEY="sb_publishable_p4UqpaLvEx_93XJSWvzo6Q_loju0xzW"
          BASELINE_PATH="supabase/functions/innerme-retrieval-smoke-test/regression-baseline.json"
          RESULT_PATH="innerme-semantic-retrieval-regression-result.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("/tmp/innerme-semantic-login-request.json").write_text(json.dumps({
              "email": os.environ["INNERME_TEST_ADMIN_EMAIL"],
              "password": os.environ["INNERME_TEST_ADMIN_PASSWORD"],
          }), encoding="utf-8")
          PY

          login_status="$(curl --silent --show-error --max-time 20 \
            -o /tmp/innerme-semantic-login-response.json \
            -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/auth/v1/token?grant_type=password" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/innerme-semantic-login-request.json)"
          if [[ "${login_status}" != "200" ]]; then
            echo "::error::Isolated test-admin sign-in failed with HTTP ${login_status}; no regression request was sent."
            exit 1
          fi

          ACCESS_TOKEN="$(python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/innerme-semantic-login-response.json").read_text(encoding="utf-8"))
          token = payload.get("access_token")
          if not isinstance(token, str) or not token:
              raise SystemExit("Sign-in did not return an access token.")
          print(token, end="")
          PY
          )"
          echo "::add-mask::${ACCESS_TOKEN}"

          # Send the versioned baseline itself. The Edge Function independently
          # pins the required IDs, case types, eligibility rules and threshold.
          cp "${BASELINE_PATH}" /tmp/innerme-semantic-baseline-request.json
          test_status="$(curl --silent --show-error --max-time 420 \
            -D /tmp/innerme-semantic-regression-headers.txt \
            -o /tmp/innerme-semantic-regression-response.json \
            -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/functions/v1/innerme-retrieval-smoke-test" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/innerme-semantic-baseline-request.json)"

          BASELINE_PATH="${BASELINE_PATH}" RESULT_PATH="${RESULT_PATH}" \
          TEST_HTTP_STATUS="${test_status}" GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
          GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}" GITHUB_SHA="${GITHUB_SHA}" \
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          baseline_path = Path(os.environ["BASELINE_PATH"])
          result_path = Path(os.environ["RESULT_PATH"])
          http_status = os.environ["TEST_HTTP_STATUS"]
          baseline_bytes = baseline_path.read_bytes()
          baseline = json.loads(baseline_bytes)
          raw = Path("/tmp/innerme-semantic-regression-response.json").read_text(encoding="utf-8", errors="replace")

          valid_json_response = True
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              valid_json_response = False
              headers = Path("/tmp/innerme-semantic-regression-headers.txt").read_text(encoding="utf-8", errors="replace")
              request_id = next((line.split(":", 1)[1].strip() for line in headers.splitlines() if line.lower().startswith("x-request-id:")), "")
              payload = {
                  "ok": False,
                  "status": "inconclusive",
                  "suite_id": baseline.get("suite_id"),
                  "baseline_version": baseline.get("baseline_version"),
                  "failure": {
                      "stage": "edge_function_response",
                      "kind": "execution",
                      "message": "Regression endpoint did not return valid JSON.",
                      "http_status": http_status,
                      "request_id": request_id,
                      "response_excerpt": raw[:300],
                  },
                  "case_results": [],
                  "cleanup": {"passed": False, "fixture_removed": False, "error": "Cleanup could not be confirmed from response."},
                  "counts": {"total": len(baseline.get("tests", [])), "passed": 0, "failed": 0, "inconclusive": len(baseline.get("tests", [])), "not_run": 0},
              }

          # A JSON response without run_id is an early rejection: the helper has
          # not entered fixture setup, so no fixture cleanup was required and
          # every test is not_run. Do not call this a cleanup failure.
          if valid_json_response and isinstance(payload, dict) and not payload.get("run_id"):
              early_message = str(payload.get("error") or payload.get("failure", {}).get("message") or "Regression suite was rejected before fixture setup.")
              payload = {
                  **payload,
                  "status": "inconclusive",
                  "failure": payload.get("failure") or {
                      "stage": "preflight",
                      "kind": "execution",
                      "message": early_message[:500],
                      "http_status": int(http_status) if http_status.isdigit() else None,
                  },
                  "case_results": [],
                  "counts": {
                      "total": len(baseline.get("tests", [])),
                      "passed": 0,
                      "failed": 0,
                      "inconclusive": 0,
                      "not_run": len(baseline.get("tests", [])),
                  },
                  "cleanup": {
                      "passed": True,
                      "fixture_removed": True,
                      "fixtures_attempted": 0,
                      "error": None,
                      "not_required": True,
                  },
                  "provider_chat_requests_attempted": 0,
              }

          result = {
              **payload,
              "http_status": int(http_status) if http_status.isdigit() else None,
              "baseline_sha256": hashlib.sha256(baseline_bytes).hexdigest(),
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "github_commit": os.environ["GITHUB_SHA"],
          }
          result_path.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")

          status = result.get("status", "inconclusive")
          counts = result.get("counts") or {}
          cases = result.get("case_results") or []
          cleanup = result.get("cleanup") or {}
          print("REGRESSION_SUITE_STATUS=" + str(status))
          print("BASELINE_VERSION=" + str(result.get("baseline_version")))
          print("BASELINE_SHA256=" + result["baseline_sha256"])
          print("CASES_TOTAL=" + str(counts.get("total", len(baseline.get("tests", [])))))
          print("CASES_PASSED=" + str(counts.get("passed", 0)))
          print("CASES_FAILED=" + str(counts.get("failed", 0)))
          print("CASES_INCONCLUSIVE=" + str(counts.get("inconclusive", 0)))
          print("CASES_NOT_RUN=" + str(counts.get("not_run", 0)))
          print("CLEANUP_PASSED=" + str(cleanup.get("passed") is True and cleanup.get("fixture_removed") is True))

          summary = [
              "# InnerMe Semantic Retrieval Regression Suite",
              "",
              f"**Overall status:** {status.upper()}",
              "",
              f"- Baseline: `{result.get('baseline_version', baseline.get('baseline_version'))}`",
              f"- Baseline SHA-256: `{result['baseline_sha256']}`",
              f"- Run ID: `{os.environ['GITHUB_RUN_ID']}` (attempt {os.environ['GITHUB_RUN_ATTEMPT']})",
              f"- Cases: {counts.get('passed', 0)} passed, {counts.get('failed', 0)} failed, {counts.get('inconclusive', 0)} inconclusive, {counts.get('not_run', 0)} not run",
              f"- Fixture cleanup: {'PASS' if cleanup.get('passed') is True and cleanup.get('fixture_removed') is True else 'FAIL'}",
              "",
              "| Case | Type | Status | Similarity | Retrieved target | Grounded phrase | Expected corpus fixtures | Observed corpus fixtures | False positives | False negatives | Ranked matches (fixture@similarity) | Candidates→selected | Excluded by score gap |",
              "|---|---|---:|---:|---:|---:|---|---|---|---|---|---:|---|",
          ]
          for case in cases:
              similarity = case.get("similarity")
              summary.append("| " + " | ".join([
                  str(case.get("id", "unknown")),
                  str(case.get("type", "unknown")),
                  str(case.get("status", "unknown")),
                  "-" if similarity is None else str(round(float(similarity), 4)),
                  str(case.get("observed_match", case.get("knowledge_match", "-"))),
                  str(case.get("answer_contains_expected_phrase", "-")),
                  ", ".join(case.get("expected_fixture_keys") or []) or "-",
                  ", ".join(case.get("observed_fixture_keys") or []) or "-",
                  ", ".join(case.get("false_positive_fixture_keys") or []) or "-",
                  ", ".join(case.get("false_negative_fixture_keys") or []) or "-",
                  ", ".join(
                      f"{match.get('rank', '?')}:{match.get('fixture_key') or 'other'}@{float(match['similarity']):.4f}"
                      if match.get("similarity") is not None
                      else f"{match.get('rank', '?')}:{match.get('fixture_key') or 'other'}@n/a"
                      for match in (case.get("retrieved_matches") or [])
                  ) or "-",
                  (
                      f"{(case.get('ranking_diagnostics') or {}).get('candidate_count', 0)}→{(case.get('ranking_diagnostics') or {}).get('selected_count', 0)}"
                      if case.get("ranking_diagnostics") else "-"
                  ),
                  ", ".join(
                      f"{match.get('fixture_key') or 'other'}@{float(match['similarity']):.4f}"
                      if match.get("similarity") is not None
                      else str(match.get("fixture_key") or "other")
                      for match in ((case.get("ranking_diagnostics") or {}).get("excluded_matches") or [])
                  ) or "-",
              ]) + " |")
              if case.get("error"):
                  summary.append("")
                  summary.append(f"> **{case.get('id')}**: {str(case['error'])[:300]}")
          metrics = result.get("retrieval_metrics") or {}
          if metrics:
              def percent(value):
                  return "n/a" if value is None else f"{float(value) * 100:.1f}%"
              summary.extend([
                  "",
                  "## Corpus-wide retrieval metrics",
                  "",
                  f"- Cases evaluated: {metrics.get('evaluated_cases', 0)} / {metrics.get('total_cases', 0)}",
                  f"- Precision: {percent(metrics.get('precision'))}",
                  f"- Recall: {percent(metrics.get('recall'))}",
                  f"- Unrelated-query rejection: {metrics.get('unrelated_queries_rejected', 0)} / {metrics.get('unrelated_query_count', 0)} ({percent(metrics.get('unrelated_query_rejection_rate'))})",
                  f"- True positives: {metrics.get('true_positives', 0)}",
                  f"- False positives: {metrics.get('false_positives', 0)}",
                  f"- False negatives: {metrics.get('false_negatives', 0)}",
                  f"- Unmapped results: {metrics.get('unmapped_result_count', 0)}",
                  f"- Metric coverage complete: {metrics.get('complete') is True}",
              ])
          if result.get("failure"):
              summary.extend(["", "## Execution detail", "", "```json", json.dumps(result["failure"], indent=2)[:1500], "```"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")

          if status != "passed" or http_status != "200" or result.get("ok") is not True:
              raise SystemExit("Semantic retrieval regression suite did not pass; inspect the case table and archived result.")
          if counts.get("passed") != counts.get("total") or counts.get("failed") != 0:
              raise SystemExit("Not all pinned regression cases passed.")
          if (result.get("retrieval_metrics") or {}).get("complete") is not True:
              raise SystemExit("Corpus-wide precision/recall metrics did not cover every pinned corpus case.")
          if cleanup.get("passed") is not True or cleanup.get("fixture_removed") is not True:
              raise SystemExit("Synthetic fixture cleanup was not verified.")
          print("PASS: every versioned semantic retrieval regression case passed and all synthetic fixtures were removed.")
          PY

      - name: Archive case-level result and exact baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innerme-semantic-retrieval-regression-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            innerme-semantic-retrieval-regression-result.json
            supabase/functions/innerme-retrieval-smoke-test/regression-baseline.json
          if-no-files-found: warn
          retention-days: 90

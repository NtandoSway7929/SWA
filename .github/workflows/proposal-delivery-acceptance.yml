name: Proposal delivery and acceptance QA

on:
  pull_request:
    branches:
      - feature/proposal-delivery-acceptance
    paths:
      - "admin-dashboard/index.html"
      - "admin-dashboard/proposal-delivery.js"
      - "admin-dashboard/proposal-delivery.css"
      - "proposal-review/index.html"
      - "scripts/proposal-delivery.test.cjs"
      - "supabase/migrations/20261128090000_lead_proposal_revision_history.sql"
      - "supabase/migrations/20261128100000_swayphics_quote_pricing_engine.sql"
      - "supabase/migrations/20261128110000_swayphics_proposal_delivery_acceptance.sql"
      - "supabase/tests/proposal-review-*"
      - "supabase/tests/proposal-delivery_sql_syntax_check.py"
      - ".github/workflows/proposal-delivery-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proposal-delivery-acceptance-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  source-and-sql-contracts:
    name: Proposal delivery source and SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Check dashboard and quote pricing contracts
        run: |
          node --check admin-dashboard/proposal-delivery.js
          node scripts/proposal-delivery.test.cjs

      - name: Install PostgreSQL parser
        run: python -m pip install --disable-pip-version-check pglast

      - name: Parse proposal and quote pricing migrations and test fixtures
        run: python supabase/tests/proposal-delivery-acceptance_sql_syntax_check.py

  disposable-database:
    name: Disposable Supabase proposal review and acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_WORKDIR: /tmp/proposal-delivery-acceptance-project
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Prepare isolated Supabase workdir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SUPABASE_WORKDIR"
          supabase init --workdir "$SUPABASE_WORKDIR"
          sed -i '/^\[db\]$/,/^\[/ s/^port = 54322$/port = 56325/' "$SUPABASE_WORKDIR/supabase/config.toml"
          mkdir -p "$SUPABASE_WORKDIR/supabase/tests"
          cp supabase/tests/proposal-delivery-acceptance.test.sql "$SUPABASE_WORKDIR/supabase/tests/proposal-delivery-acceptance.test.sql"
          rm -f "$SUPABASE_WORKDIR/supabase/seed.sql"

      - name: Start isolated local Supabase
        working-directory: /tmp/proposal-delivery-acceptance-project
        run: supabase start

      - name: Create isolated CRM and billing baseline
        shell: bash
        working-directory: /tmp/proposal-delivery-acceptance-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/proposal-delivery-acceptance-baseline.sql"

      - name: Apply proposal revision dependency migration
        shell: bash
        working-directory: /tmp/proposal-delivery-acceptance-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128090000_lead_proposal_revision_history.sql"

      - name: Apply quote pricing migration
        shell: bash
        working-directory: /tmp/proposal-delivery-acceptance-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128100000_swayphics_quote_pricing_engine.sql"


      - name: Apply proposal delivery and acceptance migration
        shell: bash
        working-directory: /tmp/proposal-delivery-acceptance-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\\(.*\\)"$/\\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128110000_swayphics_proposal_delivery_acceptance.sql"

      - name: Run proposal delivery and client acceptance database tests
        working-directory: /tmp/proposal-delivery-acceptance-project
        run: supabase test db supabase/tests/proposal-delivery-acceptance.test.sql

      - name: Stop isolated Supabase
        if: always()
        working-directory: /tmp/proposal-delivery-acceptance-project
        run: supabase stop --no-backup

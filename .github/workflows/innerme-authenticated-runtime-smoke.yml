name: InnerMe Authenticated Runtime Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/innerme-authenticated-runtime-smoke.yml"
      - "supabase/functions/swayphics-ai/index.ts"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/innerme-authenticated-runtime-smoke.yml"
      - "supabase/functions/swayphics-ai/index.ts"
      - "admin-dashboard/index.html"
      - "admin-dashboard/innerme-knowledge-intelligence.js"
      - "admin-dashboard/admin-workspace.css"

permissions:
  contents: read

jobs:
  authenticated-smoke:
    name: Verify isolated test-admin request without mutations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require isolated test-admin credentials
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${INNERME_TEST_ADMIN_EMAIL}" || -z "${INNERME_TEST_ADMIN_PASSWORD}" ]]; then
            echo "::error::Add INNERME_TEST_ADMIN_EMAIL and INNERME_TEST_ADMIN_PASSWORD as GitHub Actions repository secrets. Use a dedicated admin in the isolated InnerMe Test project, never a production account."
            exit 1
          fi

      - name: Sign in to the isolated test project and call a nonexistent proposal
        shell: bash
        env:
          INNERME_TEST_ADMIN_EMAIL: ${{ secrets.INNERME_TEST_ADMIN_EMAIL }}
          INNERME_TEST_ADMIN_PASSWORD: ${{ secrets.INNERME_TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/innerme-test-login-request.json /tmp/innerme-test-login-response.json /tmp/innerme-test-preflight.json /tmp/innerme-test-action-response.json /tmp/innerme-test-action-request.json /tmp/innerme-test-focused-health-request.json /tmp/innerme-test-focused-health-response.json /tmp/innerme-test-workspace-health-request.json /tmp/innerme-test-workspace-health-response.json /tmp/innerme-test-controller-preflight.json /tmp/innerme-test-controller-request.json /tmp/innerme-test-controller-response.json /tmp/innerme-test-controller-events.json' EXIT

          SUPABASE_URL="https://ofqofhnlzbouclvvrmzd.supabase.co"
          SUPABASE_PUBLISHABLE_KEY="sb_publishable_p4UqpaLvEx_93XJSWvzo6Q_loju0xzW"
          NONEXISTENT_PROPOSAL_ID="00000000-0000-0000-0000-000000000000"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          request = {
              "email": os.environ["INNERME_TEST_ADMIN_EMAIL"],
              "password": os.environ["INNERME_TEST_ADMIN_PASSWORD"],
          }
          Path("/tmp/innerme-test-login-request.json").write_text(
              json.dumps(request), encoding="utf-8"
          )
          PY

          login_status="$(curl --silent --show-error --max-time 20             -o /tmp/innerme-test-login-response.json             -w '%{http_code}'             -X POST "${SUPABASE_URL}/auth/v1/token?grant_type=password"             -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"             -H 'Content-Type: application/json'             --data-binary @/tmp/innerme-test-login-request.json)"

          if [[ "${login_status}" != "200" ]]; then
            echo "::error::Test-project password sign-in failed with HTTP ${login_status}. Check that the test user exists, is confirmed, and the password secret is correct."
            exit 1
          fi

          ACCESS_TOKEN="$(python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/innerme-test-login-response.json").read_text(encoding="utf-8"))
          token = payload.get("access_token")
          if not isinstance(token, str) or not token:
              raise SystemExit("Test-project sign-in response did not contain an access token.")
          print(token, end="")
          PY
          )"
          echo "::add-mask::${ACCESS_TOKEN}"

          preflight_status="$(curl --silent --show-error --max-time 20             -o /tmp/innerme-test-preflight.json             -w '%{http_code}'             "${SUPABASE_URL}/rest/v1/innerme_action_proposals?select=id&id=eq.${NONEXISTENT_PROPOSAL_ID}"             -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"             -H "Authorization: Bearer ${ACCESS_TOKEN}")"

          if [[ "${preflight_status}" != "200" ]]; then
            echo "::error::Could not verify the test proposal is absent; REST preflight returned HTTP ${preflight_status}. No action request was sent."
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("/tmp/innerme-test-preflight.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list) or rows:
              raise SystemExit("The chosen proposal ID is not confirmed absent. No action request should be sent.")
          print("Read-only preflight passed: the test proposal ID does not exist.")
          PY

          export NONEXISTENT_PROPOSAL_ID
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path("/tmp/innerme-test-action-request.json").write_text(json.dumps({
              "action": "execute_innerme_action",
              "proposal_id": os.environ["NONEXISTENT_PROPOSAL_ID"],
          }), encoding="utf-8")
          PY

          status="$(curl --silent --show-error --max-time 30             -o /tmp/innerme-test-action-response.json             -w '%{http_code}'             -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai"             -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}"             -H "Authorization: Bearer ${ACCESS_TOKEN}"             -H 'Content-Type: application/json'             --data-binary @/tmp/innerme-test-action-request.json)"

          if [[ "${status}" != "404" ]]; then
            echo "::error::Expected HTTP 404 for a nonexistent proposal after authentication; received HTTP ${status}."
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              body = json.loads(Path("/tmp/innerme-test-action-response.json").read_text(encoding="utf-8"))
          except Exception:
              print("Response was not valid JSON.")
          else:
              print("Response error:", body.get("error", "No error field"))
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          body = json.loads(Path("/tmp/innerme-test-action-response.json").read_text(encoding="utf-8"))
          expected = "The InnerMe controlled action proposal could not be found."
          if body.get("error") != expected:
              raise SystemExit("The endpoint returned HTTP 404 but not the expected missing-proposal response.")
          print("PASS: real test-admin session passed Auth and admin checks, then received the expected missing-proposal 404.")
          print("The proposal was confirmed absent beforehand; the request cannot reach task creation or email delivery.")
          PY

          # A topic-focused probe validates the optimization: invoices need only
          # linked clients and payments, and unrelated domain metrics must be omitted.
          python3 - <<'PY'
          import json
          from pathlib import Path

          Path("/tmp/innerme-test-focused-health-request.json").write_text(
              json.dumps({
                  "action": "innerme_workspace_read_health",
                  "message": "Show overdue invoices and payments in a read-only runtime check.",
              }),
              encoding="utf-8",
          )
          PY

          focused_health_status="$(curl --silent --show-error --max-time 30 \
            -o /tmp/innerme-test-focused-health-response.json \
            -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/innerme-test-focused-health-request.json)"

          if [[ "${focused_health_status}" != "200" ]]; then
            echo "::error::Focused workspace health check returned HTTP ${focused_health_status}."
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path("/tmp/innerme-test-focused-health-response.json").read_text(encoding="utf-8")))
          except Exception:
              print("Focused health response was not valid JSON.")
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          body = json.loads(Path("/tmp/innerme-test-focused-health-response.json").read_text(encoding="utf-8"))
          expected_collections = ["clients", "invoices", "payments"]
          expected_groups = {"client_summary", "invoice_summary", "payment_summary"}
          actual_groups = set(body.get("summary_metric_groups", []))
          if body.get("ok") is not True or body.get("read_only") is not True:
              raise SystemExit(f"Focused health action did not pass read-only validation: {body!r}")
          provider_configuration = body.get("provider_configuration")
          if not isinstance(provider_configuration, dict) or not isinstance(provider_configuration.get("gemini_key_configured"), bool):
              raise SystemExit("Focused health action did not report a boolean Gemini-key configuration status.")
          print("METRIC: isolated Gemini key configured=" + str(provider_configuration["gemini_key_configured"]).lower() + ".")
          if body.get("summary_source") != "database_aggregate" or body.get("summary_query_failed") is not False:
              raise SystemExit(f"Focused request did not use the database aggregate RPC: {body!r}")
          if body.get("queried_collections") != expected_collections or body.get("queried_collection_count") != 3:
              raise SystemExit(f"Finance request selected unrelated or missing domains: {body!r}")
          if actual_groups != expected_groups:
              raise SystemExit(f"Expected only finance/client aggregate groups, got {body!r}")
          if body.get("retrieval_profile") != "topic_focused":
              raise SystemExit(f"Expected topic_focused retrieval profile, got {body!r}")
          if body.get("workspace_query_failure_count") != 0:
              raise SystemExit(f"Focused workspace record reads had query failures: {body!r}")
          if body.get("workspace_data_read_call_count") != 5:
              raise SystemExit(f"Expected 5 workspace data read calls (3 domains + preferences + aggregate RPC), got {body!r}")
          workspace_bytes = body.get("progressive_workspace_json_bytes")
          if not isinstance(workspace_bytes, int) or not 0 < workspace_bytes < 50000:
              raise SystemExit(f"Compacted workspace JSON byte count is absent or over the smoke-test budget: {body!r}")
          request_id = body.get("request_id")
          if not isinstance(request_id, str) or len(request_id) != 36:
              raise SystemExit(f"Workspace health probe did not expose a valid request ID: {body!r}")
          timing_fields = (
              "server_elapsed_ms",
              "workspace_retrieval_ms",
              "workspace_context_assembly_ms",
              "progressive_context_assembly_ms",
          )
          for field in timing_fields:
              value = body.get(field)
              if not isinstance(value, (int, float)) or value < 0:
                  raise SystemExit(f"Workspace timing metric {field} is missing or invalid: {body!r}")
          if body.get("progressive_detail_collection_count") != 3:
              raise SystemExit(f"Expected three progressive detail collections, got {body!r}")
          print("PASS: focused finance request queried exactly clients, invoices, and payments.")
          print("PASS: selected workspace reads and the aggregate RPC completed with zero query failures.")
          print(f"METRIC: focused workspace data read calls={body['workspace_data_read_call_count']}; progressive workspace JSON={workspace_bytes} bytes.")
          print("METRIC: request id=" + request_id + "; total=" + str(body["server_elapsed_ms"]) + " ms; workspace read=" + str(body["workspace_retrieval_ms"]) + " ms; base context=" + str(body["workspace_context_assembly_ms"]) + " ms; progressive context=" + str(body["progressive_context_assembly_ms"]) + " ms.")
          print("PASS: exactly three aggregate groups were returned; unrelated lead/task metrics were omitted.")
          print("PASS: the authenticated probe returned metadata only and did not call an LLM/provider.")
          PY

          # Exercise the broad operational path too, so efficiency does not
          # come at the cost of missing evidence for daily priorities.
          # This diagnostic returns metric-group names, not business data,
          # and exits before any LLM/provider call.
          python3 - <<'PY'
          import json
          from pathlib import Path

          Path("/tmp/innerme-test-workspace-health-request.json").write_text(
              json.dumps({
                  "action": "innerme_workspace_read_health",
                  "message": "What are my highest-value moves for today?",
              }),
              encoding="utf-8",
          )
          PY

          workspace_health_status="$(curl --silent --show-error --max-time 30 \
            -o /tmp/innerme-test-workspace-health-response.json \
            -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/innerme-test-workspace-health-request.json)"

          if [[ "${workspace_health_status}" != "200" ]]; then
            echo "::error::Authenticated read-only workspace health check returned HTTP ${workspace_health_status}."
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              print(json.loads(Path("/tmp/innerme-test-workspace-health-response.json").read_text(encoding="utf-8")))
          except Exception:
              print("Workspace health response was not valid JSON.")
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          body = json.loads(Path("/tmp/innerme-test-workspace-health-response.json").read_text(encoding="utf-8"))
          expected_groups = {
              "lead_counts", "lead_value_zar", "followup_counts", "quote_summary",
              "invoice_summary", "payment_summary", "enquiry_summary", "task_summary",
              "project_summary", "client_summary", "portal_request_summary",
              "communication_summary", "activity_summary", "email_summary",
          }
          actual_groups = set(body.get("summary_metric_groups", []))
          missing = sorted(expected_groups - actual_groups)
          if body.get("ok") is not True:
              raise SystemExit(f"Runtime health action did not pass: {body!r}")
          if body.get("read_only") is not True or body.get("summary_source") != "database_aggregate":
              raise SystemExit(f"Runtime health check did not use the read-only database aggregate: {body!r}")
          if body.get("check") != "workspace_retrieval_and_aggregate":
              raise SystemExit(f"Unexpected runtime health check identifier: {body!r}")
          if body.get("queried_collection_count") != 13:
              raise SystemExit(f"Expected all 13 operational domains in this dedicated test, got: {body!r}")
          if missing:
              raise SystemExit(f"Aggregate metric groups were missing: {missing}; result: {body!r}")
          if body.get("retrieval_profile") != "broad_operations":
              raise SystemExit(f"Expected broad_operations for daily priorities, got: {body!r}")
          if body.get("workspace_data_read_call_count") != 21:
              raise SystemExit(f"Expected 21 broad workspace data read calls (13 domains + 7 registries + aggregate RPC), got: {body!r}")
          broad_bytes = body.get("progressive_workspace_json_bytes")
          if not isinstance(broad_bytes, int) or broad_bytes <= 0:
              raise SystemExit(f"Broad workspace JSON byte count is absent: {body!r}")
          print("PASS: broad daily-priorities request reached the read-only database aggregate path.")
          print("PASS: all 13 operational domains and all 14 aggregate metric groups were reported.")
          print(f"METRIC: broad workspace data read calls={body['workspace_data_read_call_count']}; progressive workspace JSON={broad_bytes} bytes.")
          print("PASS: broad health probe returns no business record data and does not call an LLM/provider.")
          PY

          # Exercise the deployed run-controller RPC through PostgREST with the
          # same real test-admin token, using a UUID confirmed absent beforehand.
          # This validates the public SECURITY INVOKER wrapper/private implementation
          # path and must fail before any step update or audit event can be written.
          CONTROLLER_STEP_ID="00000000-0000-0000-0000-000000000000"

          controller_preflight_status="$(curl --silent --show-error --max-time 20 \
            -o /tmp/innerme-test-controller-preflight.json \
            -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/innerme_execution_steps?select=id&id=eq.${CONTROLLER_STEP_ID}" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")"

          if [[ "${controller_preflight_status}" != "200" ]]; then
            echo "::error::Controller test preflight failed with HTTP ${controller_preflight_status}; no controller RPC was sent."
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("/tmp/innerme-test-controller-preflight.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list) or rows:
              raise SystemExit("Controller test step ID is not confirmed absent; no controller RPC should be sent.")
          print("Read-only controller preflight passed: synthetic step ID is absent.")
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path

          request = {
              "p_step_id": "00000000-0000-0000-0000-000000000000",
              "p_transition": "start",
              "p_note": "Non-mutating authenticated controller runtime smoke test.",
              "p_checkpoint": {},
              "p_completion_evidence": {},
          }
          Path("/tmp/innerme-test-controller-request.json").write_text(
              json.dumps(request), encoding="utf-8"
          )
          PY

          controller_status="$(curl --silent --show-error --max-time 20 \
            -o /tmp/innerme-test-controller-response.json \
            -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/transition_innerme_execution_step" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/innerme-test-controller-request.json)"

          if [[ "${controller_status}" != "400" ]]; then
            echo "::error::Expected authenticated controller RPC to reject the confirmed-missing step with HTTP 400; received HTTP ${controller_status}."
            python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              body = json.loads(Path("/tmp/innerme-test-controller-response.json").read_text(encoding="utf-8"))
          except Exception:
              print("Controller response was not valid JSON.")
          else:
              print("Controller response:", body)
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          body = json.loads(Path("/tmp/innerme-test-controller-response.json").read_text(encoding="utf-8"))
          expected = "The InnerMe execution step could not be found."
          if body.get("message") != expected:
              raise SystemExit(
                  "Authenticated controller RPC returned HTTP 400, but not the expected "
                  "missing-step response. Verify admin authorization, schema cache, and private RPC access."
              )
          print("PASS: authenticated test admin reached the controller RPC and was rejected only because the preflight-confirmed step is absent.")
          PY

          controller_events_status="$(curl --silent --show-error --max-time 20 \
            -o /tmp/innerme-test-controller-events.json \
            -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/innerme_execution_step_events?select=id&step_id=eq.${CONTROLLER_STEP_ID}" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}")"

          if [[ "${controller_events_status}" != "200" ]]; then
            echo "::error::Controller event-ledger postflight failed with HTTP ${controller_events_status}."
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          rows = json.loads(Path("/tmp/innerme-test-controller-events.json").read_text(encoding="utf-8"))
          if not isinstance(rows, list) or rows:
              raise SystemExit("Unexpected controller events exist for the nonexistent synthetic step.")
          print("PASS: no controller event was written by the non-mutating authenticated RPC test.")
          PY

          # Temporary one-shot E2E: run only on the fallback feature branch.
          # Test Gemini daily-quota exhaustion against the isolated test project.
          if [[ "${GITHUB_HEAD_REF:-}" == "agent/innerme-cloudflare-quota-fallback" ]]; then
            printf '%s' '{"message":"Explain conversion rate in one short, general sentence without referencing workspace records.","history":[]}' > /tmp/innerme-fallback-request.json
            fallback_status="$(curl --silent --show-error --max-time 35 -o /tmp/innerme-fallback-response.json -w '%{http_code}' -X POST "${SUPABASE_URL}/functions/v1/swayphics-ai" -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" -H "Authorization: Bearer ${ACCESS_TOKEN}" -H 'Content-Type: application/json' --data-binary @/tmp/innerme-fallback-request.json)"
            if [[ "${fallback_status}" != "200" ]]; then
              echo "::error::Cloudflare quota-fallback E2E returned HTTP ${fallback_status}."
              python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              body=json.loads(Path("/tmp/innerme-fallback-response.json").read_text(encoding="utf-8"))
              print("Provider response error:", body.get("error", "No error field"))
              print("Guard reason:", body.get("guard_reason", "not supplied"))
          except Exception:
              print("Provider response was not valid JSON.")
          PY
              exit 1
            fi
            python3 - <<'PY'
          import json
          from pathlib import Path
          raw=Path("/tmp/innerme-fallback-response.json").read_text(encoding="utf-8")
          try:
              body=json.loads(raw)
          except Exception:
              body=None
          if not isinstance(body, dict):
              events=[]
              for block in raw.split("\n\n"):
                  data="\n".join(line[5:].strip() for line in block.splitlines() if line.startswith("data:"))
                  if data:
                      try: events.append(json.loads(data))
                      except Exception: pass
              body=next((item for item in reversed(events) if isinstance(item,dict) and item.get("answer")), None)
          if not isinstance(body,dict):
              raise SystemExit("HTTP 200 returned no parseable answer payload.")
          answer=body.get("answer")
          model=str(body.get("model",""))
          if not isinstance(answer,str) or len(answer.strip())<5:
              raise SystemExit("Provider fallback returned no usable answer.")
          if "llama-3.1-8b-instruct-fp8" not in model.lower():
              raise SystemExit("Expected Cloudflare Workers AI model, received: "+model)
          if body.get("read_only") is not True:
              raise SystemExit("Expected read_only=true.")
          print("PASS: Gemini quota was exhausted and Cloudflare Workers AI returned the answer.")
          print("METRIC: model="+model+"; answer_characters="+str(len(answer.strip())))
          PY
            rm -f /tmp/innerme-fallback-request.json /tmp/innerme-fallback-response.json
          fi

      - name: Verify published InnerMe dashboard assets on swayphics.co.za
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="https://swayphics.co.za/admin-dashboard/index.html"
          EXPECTED_CSS_REF="admin-workspace.css?v=20261015-run-controller-1"
          EXPECTED_JS_REF="innerme-knowledge-intelligence.js?v=20261015-run-controller-1"
          HTML_FILE="/tmp/innerme-published-dashboard.html"
          CSS_FILE="/tmp/innerme-published-dashboard.css"
          JS_FILE="/tmp/innerme-published-dashboard.js"
          trap 'rm -f "$HTML_FILE" "$CSS_FILE" "$JS_FILE"' EXIT

          # Pages deployment runs alongside push-triggered checks. Wait for the
          # published HTML to expose the expected asset versions, rather than
          # mistaking the previous deployment for the current one.
          published_status="000"
          for attempt in $(seq 1 18); do
            published_status="$(curl --location --silent --show-error --max-time 15 \
              -o "$HTML_FILE" -w '%{http_code}' \
              -H 'Cache-Control: no-cache' "$SITE_URL" || true)"
            if [[ "$published_status" == "200" ]] \
              && grep -Fq "$EXPECTED_CSS_REF" "$HTML_FILE" \
              && grep -Fq "$EXPECTED_JS_REF" "$HTML_FILE"; then
              break
            fi
            echo "Published dashboard is not on the expected controller asset version yet (attempt ${attempt}/18, HTTP ${published_status}); retrying."
            sleep 5
          done

          if [[ "$published_status" != "200" ]] \
            || ! grep -Fq "$EXPECTED_CSS_REF" "$HTML_FILE" \
            || ! grep -Fq "$EXPECTED_JS_REF" "$HTML_FILE"; then
            echo "::error::Live dashboard HTML did not expose the controller asset versions after bounded retries."
            exit 1
          fi

          curl --location --fail --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "https://swayphics.co.za/admin-dashboard/${EXPECTED_CSS_REF}" \
            -o "$CSS_FILE"
          curl --location --fail --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "https://swayphics.co.za/admin-dashboard/${EXPECTED_JS_REF}" \
            -o "$JS_FILE"

          python3 - <<'PY'
          from pathlib import Path

          html = Path("/tmp/innerme-published-dashboard.html").read_text(encoding="utf-8")
          css = Path("/tmp/innerme-published-dashboard.css").read_text(encoding="utf-8")
          js = Path("/tmp/innerme-published-dashboard.js").read_text(encoding="utf-8")

          required_html = [
              "admin-workspace.css?v=20261015-run-controller-1",
              "innerme-knowledge-intelligence.js?v=20261015-run-controller-1",
          ]
          required_js = [
              "transition_innerme_execution_step",
              "data-sway-ai-ki-step-transition",
              "Start step",
              "Save checkpoint",
              "Mark verified complete",
              "Resume step",
              "sway-ai-ki-execution-step-history",
          ]
          missing_html = [value for value in required_html if value not in html]
          missing_js = [value for value in required_js if value not in js]
          if missing_html or missing_js:
              raise SystemExit(
                  f"Published dashboard is missing required controller references or UI hooks. "
                  f"HTML: {missing_html}; JavaScript: {missing_js}"
              )
          if len(css) < 50000 or ".sway-workspace-main" not in css:
              raise SystemExit("Published dashboard stylesheet is missing/empty or not the expected workspace stylesheet.")
          print("PASS: live dashboard HTML references the new controller assets.")
          print("PASS: live controller JavaScript exposes the run transitions and action handler.")
          print("PASS: live workspace stylesheet loaded from the custom domain.")

name: Quote pricing engine QA

on:
  pull_request:
    branches:
      - main
      - feature/lead-proposal-draft-saving
    paths:
      - "admin-dashboard/admin-workspace.js"
      - "admin-dashboard/admin-workspace.css"
      - "admin-dashboard/index.html"
      - "scripts/quote-pricing-engine.test.cjs"
      - "supabase/migrations/20261128090000_lead_proposal_revision_history.sql"
      - "supabase/migrations/20261128100000_swayphics_quote_pricing_engine.sql"
      - "supabase/tests/quote-pricing-engine*"
      - "supabase/tests/quote-pricing-engine_sql_syntax_check.py"
      - ".github/workflows/quote-pricing-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quote-pricing-engine-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  source-and-sql-contracts:
    name: Quote editor, arithmetic and SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Check dashboard and quote pricing contracts
        run: |
          node --check admin-dashboard/admin-workspace.js
          node scripts/quote-pricing-engine.test.cjs

      - name: Install PostgreSQL parser
        run: python -m pip install --disable-pip-version-check pglast

      - name: Parse proposal and quote pricing migrations and test fixtures
        run: python supabase/tests/quote-pricing-engine_sql_syntax_check.py

  disposable-database:
    name: Disposable Supabase quote pricing and invoice conversion tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_WORKDIR: /tmp/quote-pricing-engine-project
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Prepare isolated Supabase workdir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SUPABASE_WORKDIR"
          supabase init --workdir "$SUPABASE_WORKDIR"
          sed -i '/^\[db\]$/,/^\[/ s/^port = 54322$/port = 56324/' "$SUPABASE_WORKDIR/supabase/config.toml"
          mkdir -p "$SUPABASE_WORKDIR/supabase/tests"
          cp supabase/tests/quote-pricing-engine.test.sql "$SUPABASE_WORKDIR/supabase/tests/quote-pricing-engine.test.sql"
          rm -f "$SUPABASE_WORKDIR/supabase/seed.sql"

      - name: Start isolated local Supabase
        working-directory: /tmp/quote-pricing-engine-project
        run: supabase start

      - name: Create isolated CRM and billing baseline
        shell: bash
        working-directory: /tmp/quote-pricing-engine-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/tests/quote-pricing-engine-baseline.sql"

      - name: Apply proposal revision dependency migration
        shell: bash
        working-directory: /tmp/quote-pricing-engine-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128090000_lead_proposal_revision_history.sql"

      - name: Apply quote pricing migration
        shell: bash
        working-directory: /tmp/quote-pricing-engine-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128100000_swayphics_quote_pricing_engine.sql"

      - name: Run quote pricing and invoice conversion database tests
        working-directory: /tmp/quote-pricing-engine-project
        run: supabase test db supabase/tests/quote-pricing-engine.test.sql

      - name: Stop isolated Supabase
        if: always()
        working-directory: /tmp/quote-pricing-engine-project
        run: supabase stop --no-backup

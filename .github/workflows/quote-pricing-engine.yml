name: Quote pricing engine QA

on:
  pull_request:
    branches:
      - main
      - feature/lead-proposal-draft-saving
      - feature/quote-pricing-engine
      - feature/proposal-delivery-acceptance
      - feature/accepted-quote-sales-handoff
    paths:
      - "admin-dashboard/admin-workspace.js"
      - "scripts/project-onboarding-readiness.test.cjs"
      - "admin-dashboard/admin-workspace.css"
      - "admin-dashboard/index.html"
      - "admin-dashboard/proposal-delivery.js"
      - "admin-dashboard/proposal-delivery.css"
      - "admin-dashboard/proposal-sales-handoff.css"
      - "proposal-review/index.html"
      - "scripts/proposal-delivery.test.cjs"
      - "supabase/migrations/20261128110000_swayphics_proposal_delivery_acceptance.sql"
      - "supabase/tests/proposal-review-baseline.sql"
      - "supabase/tests/proposal-review-workflow.test.sql"
      - "supabase/tests/proposal-delivery_sql_syntax_check.py"
      - "admin-dashboard/proposal-sales-handoff.js"
      - "scripts/proposal-sales-handoff.test.cjs"
      - "supabase/migrations/20261128120000_swayphics_accepted_quote_sales_handoff.sql"
      - "supabase/migrations/20261128130000_swayphics_accepted_quote_project_kickoff.sql"
      - "supabase/migrations/20261025031000_swayphics_project_delivery_settings.sql"
      - "supabase/tests/accepted-quote-sales-baseline.sql"
      - "supabase/tests/accepted-quote-sales-handoff.test.sql"
      - "supabase/tests/accepted-quote-sales_sql_syntax_check.py"
      - "scripts/quote-pricing-engine.test.cjs"
      - "supabase/migrations/20261128090000_lead_proposal_revision_history.sql"
      - "supabase/migrations/20261128100000_swayphics_quote_pricing_engine.sql"
      - "supabase/tests/quote-pricing-engine*"
      - "supabase/tests/quote-pricing-engine_sql_syntax_check.py"
      - ".github/workflows/quote-pricing-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quote-pricing-engine-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  source-and-sql-contracts:
    name: Quote editor, arithmetic and SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Check dashboard and quote pricing contracts
        run: |
          node --check admin-dashboard/admin-workspace.js
          node scripts/project-onboarding-readiness.test.cjs
          node scripts/quote-pricing-engine.test.cjs
          if [ -f admin-dashboard/proposal-delivery.js ]; then
            node --check admin-dashboard/proposal-delivery.js
            node scripts/proposal-delivery.test.cjs
          fi
          if [ -f admin-dashboard/proposal-sales-handoff.js ]; then
            node --check admin-dashboard/proposal-sales-handoff.js
            node scripts/proposal-sales-handoff.test.cjs
          fi

      - name: Install PostgreSQL parser
        run: python -m pip install --disable-pip-version-check pglast

      - name: Parse proposal and quote pricing migrations and test fixtures
        run: |
          python supabase/tests/quote-pricing-engine_sql_syntax_check.py
          if [ -f supabase/tests/proposal-delivery_sql_syntax_check.py ]; then
            python supabase/tests/proposal-delivery_sql_syntax_check.py
          fi
          if [ -f supabase/tests/accepted-quote-sales_sql_syntax_check.py ]; then
            python supabase/tests/accepted-quote-sales_sql_syntax_check.py
          fi

  disposable-database:
    name: Disposable Supabase quote pricing and invoice conversion tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_WORKDIR: /tmp/quote-pricing-engine-project
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Prepare isolated Supabase workdir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SUPABASE_WORKDIR"
          supabase init --workdir "$SUPABASE_WORKDIR"
          DB_PORT=$((61000 + GITHUB_RUN_ID % 4000))
          sed -i "/^\[db\]$/,/^\[/ s/^port = 54322$/port = ${DB_PORT}/" "$SUPABASE_WORKDIR/supabase/config.toml"
          echo "Using isolated Supabase database port: $DB_PORT"
          mkdir -p "$SUPABASE_WORKDIR/supabase/tests"
          cp supabase/tests/quote-pricing-engine.test.sql "$SUPABASE_WORKDIR/supabase/tests/quote-pricing-engine.test.sql"
          if [ -f supabase/tests/proposal-review-workflow.test.sql ]; then
            cp supabase/tests/proposal-review-workflow.test.sql "$SUPABASE_WORKDIR/supabase/tests/proposal-review-workflow.test.sql"
          fi
          if [ -f supabase/tests/accepted-quote-sales-handoff.test.sql ]; then
            cp supabase/tests/accepted-quote-sales-handoff.test.sql "$SUPABASE_WORKDIR/supabase/tests/accepted-quote-sales-handoff.test.sql"
          fi
          rm -f "$SUPABASE_WORKDIR/supabase/seed.sql"

      - name: Start isolated local Supabase
        working-directory: /tmp/quote-pricing-engine-project
        run: supabase start

      - name: Create isolated CRM and billing baseline
        shell: bash
        working-directory: /tmp/quote-pricing-engine-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          BASELINE="$GITHUB_WORKSPACE/supabase/tests/quote-pricing-engine-baseline.sql"
          if [ -f "$GITHUB_WORKSPACE/supabase/tests/proposal-review-baseline.sql" ]; then
            BASELINE="$GITHUB_WORKSPACE/supabase/tests/proposal-review-baseline.sql"
          fi
          if [ -f "$GITHUB_WORKSPACE/supabase/tests/accepted-quote-sales-baseline.sql" ]; then
            BASELINE="$GITHUB_WORKSPACE/supabase/tests/accepted-quote-sales-baseline.sql"
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$BASELINE"

      - name: Apply existing project delivery defaults
        shell: bash
        working-directory: /tmp/quote-pricing-engine-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261025031000_swayphics_project_delivery_settings.sql"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "update public.workflow_settings set default_project_task_template = jsonb_build_array(jsonb_build_object('title','Kickoff briefing','due_offset_days',0,'priority','high'),jsonb_build_object('title','Review client onboarding','due_offset_days',1,'priority','medium')) where id=1"

      - name: Apply proposal revision dependency migration
        shell: bash
        working-directory: /tmp/quote-pricing-engine-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128090000_lead_proposal_revision_history.sql"

      - name: Apply quote pricing migration
        shell: bash
        working-directory: /tmp/quote-pricing-engine-project
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128100000_swayphics_quote_pricing_engine.sql"
          if [ -f "$GITHUB_WORKSPACE/supabase/migrations/20261128110000_swayphics_proposal_delivery_acceptance.sql" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128110000_swayphics_proposal_delivery_acceptance.sql"
          fi
          if [ -f "$GITHUB_WORKSPACE/supabase/migrations/20261128120000_swayphics_accepted_quote_sales_handoff.sql" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128120000_swayphics_accepted_quote_sales_handoff.sql"
          fi
          if [ -f "$GITHUB_WORKSPACE/supabase/migrations/20261128130000_swayphics_accepted_quote_project_kickoff.sql" ]; then
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/supabase/migrations/20261128130000_swayphics_accepted_quote_project_kickoff.sql"
          fi

      - name: Run quote pricing and invoice conversion database tests
        working-directory: /tmp/quote-pricing-engine-project
        run: |
          supabase test db supabase/tests/quote-pricing-engine.test.sql
          if [ -f supabase/tests/proposal-review-workflow.test.sql ]; then
            supabase test db supabase/tests/proposal-review-workflow.test.sql
          fi
          if [ -f supabase/tests/accepted-quote-sales-handoff.test.sql ]; then
            supabase test db supabase/tests/accepted-quote-sales-handoff.test.sql
          fi

      - name: Stop isolated Supabase
        if: always()
        working-directory: /tmp/quote-pricing-engine-project
        run: supabase stop --no-backup

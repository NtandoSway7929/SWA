name: BOF open-source provider POC

on:
  push:
    branches:
      - poc/bof-open-source-inspection-providers
    paths:
      - "supabase/functions/_shared/business-assessment-open-source-provider.mjs"
      - "supabase/functions/_shared/business-assessment-evidence.mjs"
      - "scripts/business-assessment-open-source-provider.test.cjs"
      - "scripts/business-assessment-open-source-provider.integration.cjs"
      - "scripts/business-assessment-open-source-provider.search-benchmark.cjs"
      - "scripts/business-assessment-open-source-provider.fetch-benchmark.cjs"
      - "scripts/bof-open-source-provider-poc/**"
      - "docs/business-opportunity-finder-open-source-provider-poc.md"
      - ".github/workflows/business-opportunity-finder-open-source-provider-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bof-open-source-provider-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-contract:
    name: Mocked provider adapter contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run isolated mocked tests
        run: node scripts/business-assessment-open-source-provider.test.cjs

      - name: Validate private gateway Compose configuration without starting services
        shell: bash
        run: |
          set -euo pipefail
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          : > "$token_file"
          env \
            SEARXNG_SECRET=ci-placeholder-only \
            CRAWL4AI_API_TOKEN=ci-placeholder-only \
            BOF_GATEWAY_PUBLIC_URL=https://bof-inspect.swayphics.co.za \
            CLOUDFLARED_TUNNEL_TOKEN_FILE="$token_file" \
            docker compose --file scripts/bof-open-source-provider-poc/private-gateway/compose.yml config --quiet
          docker run --rm --network none --entrypoint caddy \
            --volume "$PWD/scripts/bof-open-source-provider-poc/private-gateway/gateway:/etc/caddy:ro" \
            caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0 \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

  live-docker-smoke:
    name: Live SearXNG and Crawl4AI Docker smoke test
    needs: adapter-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and mask ephemeral service credentials
        shell: bash
        run: |
          searx_secret="$(openssl rand -hex 32)"
          crawl_token="$(openssl rand -hex 32)"
          echo "::add-mask::$searx_secret"
          echo "::add-mask::$crawl_token"
          echo "SEARXNG_SECRET=$searx_secret" >> "$GITHUB_ENV"
          echo "CRAWL4AI_API_TOKEN=$crawl_token" >> "$GITHUB_ENV"

      - name: Start pinned local provider containers
        run: docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml up --detach

      - name: Wait for provider health endpoints
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            searx_ok=false
            crawl_ok=false
            if curl --fail --silent --show-error --location http://127.0.0.1:8080/ >/dev/null 2>&1; then
              searx_ok=true
            fi
            if curl --fail --silent --show-error http://127.0.0.1:11235/health >/dev/null 2>&1; then
              crawl_ok=true
            fi
            if [ "$searx_ok" = true ] && [ "$crawl_ok" = true ]; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml ps
            docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml logs --no-color
            exit 1
          fi

      - name: Verify Crawl4AI container security posture
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml ps -q crawl4ai)"
          test -n "$container_id"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "appuser"
          cap_drop="$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id")"
          echo "$cap_drop" | grep -q '"ALL"'
          security_opt="$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container_id")"
          echo "$security_opt" | grep -q 'no-new-privileges'
          memory_limit="$(docker inspect --format '{{.HostConfig.Memory}}' "$container_id")"
          test "$memory_limit" -gt 0
          pids_limit="$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$container_id")"
          test "$pids_limit" -gt 0
          echo "Crawl4AI container posture verified: read-only rootfs, non-root user, dropped capabilities, no-new-privileges and resource limits."
          searxng_id="$(docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml ps -q searxng)"
          test -n "$searxng_id"
          for service_id in "$container_id" "$searxng_id"; do
            published_ports="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$service_id")"
            echo "$published_ports" | grep -q '"HostIp":"127.0.0.1"'
          done
          echo "Both provider services are published only on host loopback."

      - name: Run live provider integration smoke test
        env:
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          CRAWL4AI_BASE_URL: http://127.0.0.1:11235
        run: node scripts/business-assessment-open-source-provider.integration.cjs

      - name: Benchmark South African official-domain discovery
        env:
          SEARXNG_BASE_URL: http://127.0.0.1:8080
        run: node scripts/business-assessment-open-source-provider.search-benchmark.cjs

      - name: Benchmark public website retrieval and business identity
        env:
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          CRAWL4AI_BASE_URL: http://127.0.0.1:11235
        run: node scripts/business-assessment-open-source-provider.fetch-benchmark.cjs

      - name: Collect provider logs on failure
        if: failure()
        run: docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml logs --no-color

      - name: Stop and remove provider containers
        if: always()
        run: docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml down --volumes --remove-orphans

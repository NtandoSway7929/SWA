name: BOF open-source provider POC

on:
  push:
    branches:
      - poc/bof-open-source-inspection-providers
    paths:
      - "supabase/functions/_shared/business-assessment-open-source-provider.mjs"
      - "supabase/functions/_shared/business-assessment-evidence.mjs"
      - "scripts/business-assessment-open-source-provider.test.cjs"
      - "scripts/business-assessment-open-source-provider.integration.cjs"
      - "scripts/business-assessment-open-source-provider.search-benchmark.cjs"
      - "scripts/business-assessment-open-source-provider.fetch-benchmark.cjs"
      - "scripts/business-assessment-private-gateway.integration.cjs"
      - "scripts/bof-open-source-provider-poc/**"
      - "docs/business-opportunity-finder-open-source-provider-poc.md"
      - "docs/bof-open-source-provider-host-egress-hardening.md"
      - ".github/workflows/business-opportunity-finder-open-source-provider-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bof-open-source-provider-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter-contract:
    name: Mocked provider adapter contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run isolated mocked tests
        run: node scripts/business-assessment-open-source-provider.test.cjs

      - name: Validate declarative host egress policy
        run: |
          node scripts/bof-open-source-provider-poc/private-gateway/host-egress-policy.test.cjs
          node scripts/bof-open-source-provider-poc/private-gateway/validate-host-egress-policy.cjs
          node scripts/bof-open-source-provider-poc/private-gateway/host-readiness.test.cjs
          python3 scripts/bof-open-source-provider-poc/private-gateway/ssrf-policy-simulator.py --self-test
          python3 scripts/bof-open-source-provider-poc/private-gateway/analyse-firewall-snapshot.py --self-test
          bash -n scripts/bof-open-source-provider-poc/private-gateway/network-namespace-ssrf-test.sh
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iproute2 nftables
          sudo bash scripts/bof-open-source-provider-poc/private-gateway/network-namespace-ssrf-test.sh

      - name: Validate private gateway Compose configuration without starting services
        shell: bash
        run: |
          set -euo pipefail
          token_file="$(mktemp)"
          trap 'rm -f "$token_file"' EXIT
          : > "$token_file"
          env \
            SEARXNG_SECRET=ci-placeholder-only \
            CRAWL4AI_API_TOKEN=ci-placeholder-only \
            BOF_GATEWAY_PUBLIC_URL=https://bof-inspect.swayphics.co.za \
            CLOUDFLARED_TUNNEL_TOKEN_FILE="$token_file" \
            docker compose --file scripts/bof-open-source-provider-poc/private-gateway/compose.yml config --quiet
          env \
            SEARXNG_SECRET=ci-placeholder-only \
            CRAWL4AI_API_TOKEN=ci-placeholder-only \
            BOF_GATEWAY_PUBLIC_URL=https://bof-inspect.swayphics.co.za \
            CLOUDFLARED_TUNNEL_TOKEN_FILE="$token_file" \
            docker compose --profile tunnel --file scripts/bof-open-source-provider-poc/private-gateway/compose.yml config --format json \
              > "$RUNNER_TEMP/bof-private-gateway-compose.json"
          node scripts/bof-open-source-provider-poc/private-gateway/validate-host-egress-policy.cjs \
            --compose "$RUNNER_TEMP/bof-private-gateway-compose.json"
          docker run --rm --network none --entrypoint caddy \
            --volume "$PWD/scripts/bof-open-source-provider-poc/private-gateway/gateway:/etc/caddy:ro" \
            caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0 \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

  live-docker-smoke:
    name: Live SearXNG and Crawl4AI Docker smoke test
    needs: adapter-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and mask ephemeral service credentials
        shell: bash
        run: |
          searx_secret="$(openssl rand -hex 32)"
          crawl_token="$(openssl rand -hex 32)"
          echo "::add-mask::$searx_secret"
          echo "::add-mask::$crawl_token"
          echo "SEARXNG_SECRET=$searx_secret" >> "$GITHUB_ENV"
          echo "CRAWL4AI_API_TOKEN=$crawl_token" >> "$GITHUB_ENV"
          echo "CRAWL4AI_CHROMIUM_SANDBOX=true" >> "$GITHUB_ENV"
          # Required by Compose interpolation even if the later gateway steps are skipped.
          echo "BOF_GATEWAY_PUBLIC_URL=https://bof-inspect.swayphics.co.za" >> "$GITHUB_ENV"

      - name: Start pinned local provider containers
        run: docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml up --detach

      - name: Wait for provider health endpoints
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          searx_status="not_checked"
          crawl_status="not_checked"
          for attempt in $(seq 1 60); do
            searx_status="$(curl --connect-timeout 2 --max-time 5 --fail --silent --show-error --location --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ 2>/dev/null || true)"
            crawl_status="$(curl --connect-timeout 2 --max-time 5 --fail --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:11235/health 2>/dev/null || true)"
            if [[ "$searx_status" =~ ^2[0-9][0-9]$ ]] && [[ "$crawl_status" =~ ^2[0-9][0-9]$ ]]; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo "Provider readiness failed. Last SearXNG HTTP status: ${searx_status:-no response}"
            echo "Provider readiness failed. Last Crawl4AI HTTP status: ${crawl_status:-no response}"
            for service in searxng crawl4ai; do
              container_id="$(docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml ps -q "$service")"
              echo "::group::$service container state"
              if [ -n "$container_id" ]; then
                docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}not_configured{{end}}' "$container_id"
              else
                echo "Container was not created."
              fi
              echo "::endgroup::"
              echo "::group::$service startup logs"
              docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml logs --no-color --tail 200 "$service" || true
              echo "::endgroup::"
            done
            exit 1
          fi

      - name: Verify Crawl4AI container security posture
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml ps -q crawl4ai)"
          test -n "$container_id"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "appuser"
          cap_drop="$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$container_id")"
          echo "$cap_drop" | grep -q '"ALL"'
          security_opt="$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$container_id")"
          echo "$security_opt" | grep -q 'no-new-privileges'
          memory_limit="$(docker inspect --format '{{.HostConfig.Memory}}' "$container_id")"
          test "$memory_limit" -gt 0
          pids_limit="$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$container_id")"
          test "$pids_limit" -gt 0
          echo "Crawl4AI container posture verified: read-only rootfs, non-root user, dropped capabilities, no-new-privileges and resource limits."
          searxng_id="$(docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml ps -q searxng)"
          test -n "$searxng_id"
          for service_id in "$container_id" "$searxng_id"; do
            published_ports="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$service_id")"
            echo "$published_ports" | grep -q '"HostIp":"127.0.0.1"'
          done
          echo "Both provider services are published only on host loopback."

      - name: Run live provider integration smoke test
        env:
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          CRAWL4AI_BASE_URL: http://127.0.0.1:11235
        run: node scripts/business-assessment-open-source-provider.integration.cjs

      - name: Verify Chromium launches with its sandbox enabled
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml ps -q crawl4ai)"
          test -n "$container_id"
          found=false
          for attempt in $(seq 1 20); do
            process_list="$(docker exec "$container_id" sh -c '
              for file in /proc/[0-9]*/cmdline; do
                [ -r "$file" ] || continue
                command_line="$(tr "\\000" " " < "$file" 2>/dev/null || true)"
                case "$command_line" in
                  *chrome*|*chromium*)
                    case "$command_line" in
                      *chrome_crashpad_handler*) continue ;;
                    esac
                    echo "$command_line"
                    ;;
                esac
              done
            ')"
            if [ -n "$process_list" ]; then
              found=true
              if echo "$process_list" | grep -q -- '--no-sandbox'; then
                echo "Chromium process still contains --no-sandbox despite sandbox opt-in."
                echo "$process_list"
                exit 1
              fi
              echo "Chromium process is running without --no-sandbox."
              break
            fi
            sleep 1
          done
          if [ "$found" != true ]; then
            echo "No Chromium process found after the live crawl; sandbox launch could not be verified."
            exit 1
          fi

      - name: Benchmark South African official-domain discovery
        env:
          SEARXNG_BASE_URL: http://127.0.0.1:8080
        run: node scripts/business-assessment-open-source-provider.search-benchmark.cjs

      - name: Benchmark public website retrieval and business identity
        env:
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          CRAWL4AI_BASE_URL: http://127.0.0.1:11235
        run: node scripts/business-assessment-open-source-provider.fetch-benchmark.cjs
 
      - name: Stop loopback provider containers before private gateway runtime test
        run: docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml down --volumes --remove-orphans

      - name: Generate private gateway CI-only credentials and tunnel placeholder
        shell: bash
        run: |
          set -euo pipefail
          searx_secret="$(openssl rand -hex 32)"
          crawl_token="$(openssl rand -hex 32)"
          echo "::add-mask::$searx_secret"
          echo "::add-mask::$crawl_token"
          token_file="$RUNNER_TEMP/cloudflared-tunnel-placeholder"
          : > "$token_file"
          chmod 600 "$token_file"
          echo "SEARXNG_SECRET=$searx_secret" >> "$GITHUB_ENV"
          echo "CRAWL4AI_API_TOKEN=$crawl_token" >> "$GITHUB_ENV"
          echo "BOF_GATEWAY_PUBLIC_URL=https://bof-inspect.swayphics.co.za" >> "$GITHUB_ENV"
          echo "CLOUDFLARED_TUNNEL_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"

      - name: Start pinned private gateway services without a live tunnel
        run: |
          docker compose --project-name bof-private-gateway-ci --file scripts/bof-open-source-provider-poc/private-gateway/compose.yml config --quiet
          docker compose --project-name bof-private-gateway-ci --file scripts/bof-open-source-provider-poc/private-gateway/compose.yml up --detach valkey searxng crawl4ai gateway

      - name: Verify private gateway health, network boundaries and unpublished ports
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-name bof-private-gateway-ci --file scripts/bof-open-source-provider-poc/private-gateway/compose.yml)

          ready=false
          for attempt in $(seq 1 60); do
            crawl_id="$("${compose[@]}" ps -q crawl4ai)"
            if [ -n "$crawl_id" ]; then
              health="$(docker inspect --format '{{.State.Health.Status}}' "$crawl_id" 2>/dev/null || true)"
              if [ "$health" = "healthy" ]; then
                ready=true
                break
              fi
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            "${compose[@]}" ps
            exit 1
          fi

          valkey_reply="$("${compose[@]}" exec -T valkey valkey-cli ping)"
          test "$valkey_reply" = "PONG"

          valkey_id="$("${compose[@]}" ps -q valkey)"
          test -n "$valkey_id"
          valkey_user="$(docker inspect --format '{{.Config.User}}' "$valkey_id")"
          test "$valkey_user" = "999:1000"
          valkey_cap_drop="$(docker inspect --format '{{json .HostConfig.CapDrop}}' "$valkey_id")"
          echo "$valkey_cap_drop" | grep -q '"ALL"'
          valkey_security_opt="$(docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$valkey_id")"
          echo "$valkey_security_opt" | grep -q 'no-new-privileges'

          test "$("${compose[@]}" exec -T valkey valkey-cli SET bof:ci:runtime-check ready EX 30)" = "OK"
          test "$("${compose[@]}" exec -T valkey valkey-cli GET bof:ci:runtime-check)" = "ready"
          test "$("${compose[@]}" exec -T valkey valkey-cli DEL bof:ci:runtime-check)" = "1"
          echo "Valkey runtime verified: non-root UID/GID 999:1000, all capabilities dropped, no-new-privileges, and read/write/delete works."

          check_networks() {
            local service="$1"
            shift
            local container_id
            container_id="$("${compose[@]}" ps -q "$service")"
            test -n "$container_id"
            local bindings
            bindings="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "$container_id")"
            if [ "$bindings" != "null" ] && [ "$bindings" != "{}" ]; then
              echo "$service unexpectedly publishes host ports: $bindings"
              exit 1
            fi
            local actual expected
            actual="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$container_id" | sed '/^[[:space:]]*$/d' | sort)"
            expected="$(printf '%s\n' "$@" | sort)"
            if [ "$actual" != "$expected" ]; then
              echo "Unexpected network membership for $service"
              printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
              exit 1
            fi
          }

          check_networks gateway "bof-private-gateway-ci_tunnel_internal" "bof-private-gateway-ci_search_internal" "bof-private-gateway-ci_crawl_internal"
          check_networks searxng "bof-private-gateway-ci_search_internal" "bof-private-gateway-ci_search_egress"
          check_networks crawl4ai "bof-private-gateway-ci_crawl_internal" "bof-private-gateway-ci_crawl_egress"
          check_networks valkey "bof-private-gateway-ci_search_internal"

          tunnel_id="$(docker ps --filter "label=com.docker.compose.project=bof-private-gateway-ci" --filter "label=com.docker.compose.service=cloudflared" -q)"
          test -z "$tunnel_id"
          echo "Private gateway boundaries verified: Valkey healthy; no published ports; Caddy has no egress; providers and cache have only their assigned networks; cloudflared was not started."

      - name: Exercise private gateway search and crawler routes from tunnel-only network
        shell: bash
        run: |
          docker run --rm \
            --network bof-private-gateway-ci_tunnel_internal \
            --volume "$PWD/scripts/business-assessment-private-gateway.integration.cjs:/test/integration.cjs:ro" \
            --env BOF_GATEWAY_INTERNAL_URL=http://10.77.30.254:8080 \
            --env BOF_GATEWAY_PUBLIC_HOST=bof-inspect.swayphics.co.za \
            --env CRAWL4AI_API_TOKEN="$CRAWL4AI_API_TOKEN" \
            node:22-alpine node /test/integration.cjs


      - name: Collect provider logs on failure
        if: failure()
        run: docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml logs --no-color || true

      - name: Collect private-gateway Valkey diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          compose=(docker compose --project-name bof-private-gateway-ci --file scripts/bof-open-source-provider-poc/private-gateway/compose.yml)
          "${compose[@]}" ps --all
          valkey_id="$("${compose[@]}" ps --all -q valkey)"
          if [ -n "$valkey_id" ]; then
            echo "::group::Valkey container logs"
            docker logs --tail 100 "$valkey_id"
            echo "::endgroup::"
            echo "::group::Valkey healthcheck history"
            docker inspect --format '{{json .State.Health}}' "$valkey_id"
            echo "::endgroup::"
          else
            echo "Valkey container was not created."
          fi

      - name: Stop and remove provider containers
        if: always()
        run: |
          docker compose --file scripts/bof-open-source-provider-poc/docker-compose.yml down --volumes --remove-orphans || true
          docker compose --project-name bof-private-gateway-ci --file scripts/bof-open-source-provider-poc/private-gateway/compose.yml down --volumes --remove-orphans || true
          rm -f "$RUNNER_TEMP/cloudflared-tunnel-placeholder"

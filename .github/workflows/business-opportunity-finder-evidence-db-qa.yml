name: Business Opportunity Finder evidence database QA

on:
  push:
    branches:
      - feat/business-opportunity-finder-phase1-spec
    paths:
      - "supabase/migrations/20261126193000_business_assessment_evidence_inspection.sql"
      - "supabase/tests/20261126193001_business_assessment_evidence_inspection.test.sql"
      - "supabase/tests/business-assessment-evidence-baseline.sql"
      - ".github/workflows/business-opportunity-finder-evidence-db-qa.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20261126193000_business_assessment_evidence_inspection.sql"
      - "supabase/tests/20261126193001_business_assessment_evidence_inspection.test.sql"
      - "supabase/tests/business-assessment-evidence-baseline.sql"
      - ".github/workflows/business-opportunity-finder-evidence-db-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: business-opportunity-finder-evidence-db-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  evidence-storage:
    name: Isolated evidence migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_WORKDIR: /tmp/bof-evidence-supabase-project

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Prepare isolated Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SUPABASE_WORKDIR"
          supabase init --workdir "$SUPABASE_WORKDIR"
          mkdir -p "$SUPABASE_WORKDIR/supabase/tests"
          cp supabase/tests/20261126193001_business_assessment_evidence_inspection.test.sql \
            "$SUPABASE_WORKDIR/supabase/tests/"

      - name: Start disposable Supabase
        working-directory: /tmp/bof-evidence-supabase-project
        run: supabase start

      - name: Apply isolated assessment baseline and evidence migration
        working-directory: /tmp/bof-evidence-supabase-project
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\\(.*\\)"$/\\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/tests/business-assessment-evidence-baseline.sql" \
            -f "$GITHUB_WORKSPACE/supabase/migrations/20261126193000_business_assessment_evidence_inspection.sql"

      - name: Run inspection evidence and RLS tests
        working-directory: /tmp/bof-evidence-supabase-project
        run: |
          supabase test db supabase/tests/20261126193001_business_assessment_evidence_inspection.test.sql

      - name: Stop disposable Supabase
        if: always()
        working-directory: /tmp/bof-evidence-supabase-project
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi

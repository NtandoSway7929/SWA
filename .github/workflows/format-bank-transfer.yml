name: Format bank transfer TypeScript (temporary)

on:
  push:
    branches:
      - feature/manual-bank-transfer
    paths:
      - "supabase/functions/bank-transfer/**"
      - "supabase/functions/tests/bank-transfer.test.ts"

permissions:
  contents: write

concurrency:
  group: format-bank-transfer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format the bank transfer Edge Function and tests
        shell: bash
        run: |
          set -euo pipefail
          deno fmt supabase/functions/bank-transfer/index.ts supabase/functions/tests/bank-transfer.test.ts
          if ! git diff --quiet -- supabase/functions/bank-transfer/index.ts supabase/functions/tests/bank-transfer.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/functions/bank-transfer/index.ts supabase/functions/tests/bank-transfer.test.ts
            git commit -m "Apply Deno formatting to bank transfer code"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Bank transfer TypeScript is already formatted."
          fi

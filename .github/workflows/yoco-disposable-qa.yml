name: Yoco client payments - disposable QA

on:
  push:
    branches:
      - feature/yoco-client-payments
    paths:
      - "supabase/**"
      - "admin-dashboard/yoco-invoice-settings.js"
      - "admin-dashboard/yoco-reconciliation.js"
      - "admin-dashboard/index.html"
      - "scripts/yoco-invoice-settings.test.cjs"
      - "scripts/yoco-reconciliation-ui.test.cjs"
      - ".github/workflows/yoco-disposable-qa.yml"
  pull_request:
    branches:
      - main
      - feature/yoco-client-payments
    paths:
      - "supabase/**"
      - "admin-dashboard/yoco-reconciliation.js"
      - "admin-dashboard/yoco-invoice-settings.js"
      - "admin-dashboard/index.html"
      - "scripts/yoco-invoice-settings.test.cjs"
      - "scripts/yoco-reconciliation-ui.test.cjs"
      - ".github/workflows/yoco-disposable-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yoco-disposable-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-function-tests:
    name: Deno formatting, type checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate administrator payment settings and reconciliation UI
        run: |
          node --check admin-dashboard/yoco-invoice-settings.js
          node --check admin-dashboard/yoco-reconciliation.js
          node --test scripts/yoco-invoice-settings.test.cjs scripts/yoco-reconciliation-ui.test.cjs

      - name: Check Yoco TypeScript formatting
        shell: bash
        run: |
          mapfile -t files < <(find supabase/functions -type f -name '*.ts' \
            | grep -E '/(yoco|create-payment-checkout|get-payment-status|reconcile-payment)' \
            | sort)
          test "${#files[@]}" -gt 0
          deno fmt --check "${files[@]}"

      - name: Type-check Yoco Edge Functions
        run: |
          deno check \
            supabase/functions/create-payment-checkout/index.ts \
            supabase/functions/yoco-payment-webhook/index.ts \
            supabase/functions/get-payment-status/index.ts \
            supabase/functions/reconcile-payment/index.ts

      - name: Run Yoco Deno tests
        env:
          YOCO_WEBHOOK_SECRET: whsec_disposable_ci_test_secret
        run: deno test --allow-env=YOCO_WEBHOOK_SECRET supabase/functions/tests/yoco-*.test.ts

      - name: Prepare reviewed formatting patch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/functions -type f -name '*.ts' \
            | grep -E '/(yoco|create-payment-checkout|get-payment-status|reconcile-payment)' \
            | sort)
          deno fmt "${files[@]}"
          git diff --binary -- "${files[@]}" > yoco-deno-format.patch
          if ! test -s yoco-deno-format.patch; then
            echo "No formatting changes required." > yoco-deno-format.patch
          fi

      - name: Upload formatting review patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoco-deno-format-review
          path: yoco-deno-format.patch
          if-no-files-found: error
          retention-days: 7

  sql-syntax-check:
    name: PostgreSQL grammar check for Yoco SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL parser
        run: python -m pip install --disable-pip-version-check pglast

      - name: Parse Yoco migrations and SQL tests
        run: python supabase/tests/yoco_sql_syntax_check.py

  disposable-database:
    name: Disposable Supabase migrations and SQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_WORKDIR: /tmp/yoco-supabase-project
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Prepare isolated Supabase CLI workdir
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SUPABASE_WORKDIR"
          supabase init --workdir "$SUPABASE_WORKDIR"
          mkdir -p "$SUPABASE_WORKDIR/supabase/migrations" "$SUPABASE_WORKDIR/supabase/tests"
          ln -s "$GITHUB_WORKSPACE/supabase/tests" "$SUPABASE_WORKDIR/supabase/tests/yoco-source"
          rm -f "$SUPABASE_WORKDIR/supabase/seed.sql"

      - name: Start isolated local Supabase
        run: supabase start

      - name: Create isolated Yoco test baseline
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/tests/yoco-production-schema-baseline.sql

      - name: Apply Yoco migrations in timestamp order
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          mapfile -t migrations < <(find supabase/migrations -maxdepth 1 -type f \
            \( -name '202611110*_yoco*.sql' -o -name '202611120001_yoco_refund_event_idempotency.sql' \) \
            | sort)
          test "${#migrations[@]}" -eq 13
          for migration in "${migrations[@]}"; do
            echo "Applying $migration"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Run read-only Yoco migration preflight
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          preflight="$(psql "$DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off \
            -f supabase/tests/202611110008_yoco_migration_preflight.sql)"
          printf '%s\n' "$preflight"
          if grep -q 'BLOCK' <<<"$preflight"; then
            echo "Yoco migration preflight reported blocked dependencies." >&2
            exit 1
          fi

      - name: Run Yoco database invariant tests
        run: |
          supabase test db --local \
            supabase/tests/yoco-source/202611110005_yoco_ledger_invariants.test.sql \
            supabase/tests/yoco-source/202611110009_yoco_webhook_lease.test.sql \
            supabase/tests/yoco-source/202611110010_yoco_admin_invoice_settings.test.sql \
            supabase/tests/yoco-source/202611110011_yoco_reconciliation_admin_workflow.test.sql

      - name: Run Yoco payment and refund transaction scenarios
        shell: bash
        run: |
          set -euo pipefail
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$DB_URL"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/202611110006_yoco_payment_flow.test.sql

      - name: Run repeated two-worker webhook lease races
        shell: bash
        run: |
          set -euo pipefail
          export LOCAL_DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$LOCAL_DB_URL"
          YOCO_CONCURRENCY_REPETITIONS=20 bash supabase/tests/yoco-lease-concurrency-ci.sh

      - name: Stop disposable Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          else
            echo "Supabase CLI was not installed; no local stack requires cleanup."
          fi

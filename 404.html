<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Swayphics - empowering businesses through design."
    >

    <meta name="robots" content="noindex">

    <title>404 - Swayphics</title>

    <link
        rel="icon"
        type="image/webp"
        href="favicon.webp"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 32px 6%;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 18%,
                    rgba(119, 193, 252, 0.16) 0%,
                    rgba(119, 193, 252, 0.07) 24%,
                    rgba(255, 255, 255, 0) 52%
                ),
                linear-gradient(
                    180deg,
                    #FAFCFF 0%,
                    #F6F9FF 52%,
                    #FFFFFF 100%
                );

            color: #081533;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            width: 560px;
            height: 560px;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(1, 82, 244, 0.14) 0%,
                    rgba(1, 82, 244, 0.05) 42%,
                    rgba(1, 82, 244, 0) 72%
                );

            filter: blur(35px);
            pointer-events: none;
        }

        .page {
            position: relative;
            width: 100%;
            max-width: 900px;
        }

        .shell {
            position: relative;

            width: 100%;

            padding:
                34px
                34px
                30px;

            border-radius: 34px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.91) 0%,
                    rgba(248, 251, 255, 0.78) 52%,
                    rgba(255, 255, 255, 0.88) 100%
                );

            border:
                1px solid rgba(255, 255, 255, 0.88);

            box-shadow:
                0 30px 90px rgba(0, 32, 150, 0.10),
                0 8px 30px rgba(0, 20, 95, 0.055),
                inset 0 1px 0 rgba(255, 255, 255, 0.96),
                inset 0 -1px 0 rgba(255, 255, 255, 0.42);

            backdrop-filter:
                blur(34px)
                saturate(160%);

            -webkit-backdrop-filter:
                blur(34px)
                saturate(160%);

            isolation: isolate;
        }

        .shell::before {
            content: "";

            position: absolute;
            inset: 0;

            border-radius: inherit;

            background:
                radial-gradient(
                    110% 70% at 8% 0%,
                    rgba(255, 255, 255, 0.95) 0%,
                    rgba(255, 255, 255, 0.44) 25%,
                    rgba(255, 255, 255, 0) 58%
                );

            pointer-events: none;
            z-index: -1;
        }

        .shell::after {
            content: "";

            position: absolute;
            inset: 1px;

            border-radius: inherit;

            border:
                1px solid rgba(255, 255, 255, 0.34);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.76);

            pointer-events: none;
            z-index: -1;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;

            margin-bottom: 65px;
        }

        .logo {
            display: inline-flex;
            align-items: center;

            text-decoration: none;
        }

        .logo img {
            display: block;

            width: auto;
            height: 42px;

            object-fit: contain;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding:
                9px
                13px;

            border:
                1px solid rgba(0, 32, 150, 0.09);

            border-radius: 999px;

            background:
                rgba(255, 255, 255, 0.58);

            color: #56627A;

            font-size: 0.67rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.72);
        }

        .status-dot {
            width: 7px;
            height: 7px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #0152F4;

            box-shadow:
                0 0 0 4px rgba(1, 82, 244, 0.08);
        }

        .content {
            text-align: center;
        }

        .error-code {
            margin-bottom: 4px;

            color: #002096;

            font-size:
                clamp(
                    7rem,
                    20vw,
                    13rem
                );

            font-weight: 900;

            line-height: 0.78;

            letter-spacing: -0.09em;

            user-select: none;
        }

        .error-code span {
            color: #0152F4;
        }

        .eyebrow {
            margin-bottom: 16px;

            color: #0152F4;

            font-size: 0.72rem;
            font-weight: 800;

            letter-spacing: 0.16em;

            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 20px;

            color: #081533;

            font-size:
                clamp(
                    2.2rem,
                    5vw,
                    4.7rem
                );

            font-weight: 850;

            line-height: 0.98;

            letter-spacing: -0.055em;
        }

        h1 span {
            color: #0152F4;
        }

        .description {
            max-width: 560px;

            margin:
                0
                auto
                32px;

            color: #56627A;

            font-size: 1rem;

            line-height: 1.75;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        .btn {
            min-height: 48px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding:
                0
                20px;

            border-radius: 999px;

            font-size: 0.77rem;
            font-weight: 800;

            letter-spacing: 0.04em;

            text-decoration: none;

            transition:
                transform 0.24s ease,
                box-shadow 0.24s ease,
                background 0.24s ease,
                border-color 0.24s ease;
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    #0152F4 0%,
                    #0031C5 100%
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            color: #FFFFFF;

            box-shadow:
                0 10px 28px
                rgba(1, 82, 244, 0.20),
                inset 0 1px 0
                rgba(255, 255, 255, 0.22);
        }

        .btn-primary:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 34px
                rgba(1, 82, 244, 0.25),
                inset 0 1px 0
                rgba(255, 255, 255, 0.25);
        }

        .btn-secondary {
            background:
                rgba(255, 255, 255, 0.62);

            border:
                1px solid
                rgba(0, 32, 150, 0.12);

            color: #002096;

            box-shadow:
                inset 0 1px 0
                rgba(255, 255, 255, 0.82);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);

            background:
                rgba(255, 255, 255, 0.88);

            border-color:
                rgba(0, 32, 150, 0.18);

            box-shadow:
                0 8px 24px
                rgba(0, 32, 150, 0.07),
                inset 0 1px 0
                rgba(255, 255, 255, 0.9);
        }

        .footer {
            margin-top: 62px;
            padding-top: 22px;

            border-top:
                1px solid
                rgba(0, 32, 150, 0.08);

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .footer-brand {
            color: #081533;

            font-size: 0.67rem;
            font-weight: 800;

            letter-spacing: 0.14em;

            text-transform: uppercase;
        }

        .footer-tagline {
            color: #7B879A;

            font-size: 0.65rem;

            letter-spacing: 0.1em;

            text-transform: uppercase;
        }

        .btn:focus-visible,
        .logo:focus-visible {
            outline:
                3px solid
                #77C1FC;

            outline-offset: 4px;

            border-radius: 8px;
        }

        @media (max-width: 700px) {

            body {
                padding:
                    18px
                    5%;
            }

            .shell {
                padding:
                    24px
                    20px
                    22px;

                border-radius: 27px;
            }

            .header {
                margin-bottom: 54px;
            }

            .logo img {
                height: 36px;
            }

            .status {
                display: none;
            }

            .error-code {
                margin-bottom: 8px;

                font-size:
                    clamp(
                        6rem,
                        30vw,
                        8rem
                    );

                letter-spacing: -0.085em;
            }

            .eyebrow {
                font-size: 0.65rem;
                letter-spacing: 0.13em;
            }

            h1 {
                font-size:
                    clamp(
                        2.2rem,
                        9vw,
                        3.2rem
                    );

                letter-spacing: -0.045em;
            }

            .description {
                font-size: 0.92rem;
                line-height: 1.68;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr;

                width: 100%;
                max-width: 360px;

                margin:
                    0
                    auto;
            }

            .btn {
                width: 100%;
                min-height: 50px;
            }

            .footer {
                flex-direction: column;
                align-items: center;

                text-align: center;

                margin-top: 48px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            .btn {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="shell">

            <header class="header">

                <a
                    href="./"
                    class="logo"
                    aria-label="Swayphics home"
                >
                    <img
                        src="swayphics-logo.png"
                        alt="Swayphics - Empowering through design"
                    >
                </a>

                <div
                    class="status"
                    aria-hidden="true"
                >
                    <span class="status-dot"></span>
                    Page not found
                </div>

            </header>

            <div class="content">

                <div
                    class="error-code"
                    aria-hidden="true"
                >
                    4<span>0</span>4
                </div>

                <div class="eyebrow">
                    Creative & Design Lab
                </div>

                <h1>
                    Looks like this page
                    <span>got lost.</span>
                </h1>

                <p class="description">
                    The page you're looking for doesn't exist
                    or may have moved. Don't worry,
                    Swayphics is still here.
                </p>

                <div class="actions">

                    <a
                        href="./"
                        class="btn btn-primary"
                    >
                        Back to Swayphics →
                    </a>

                    <a
                        href="./#services"
                        class="btn btn-secondary"
                    >
                        Explore Services
                    </a>

                </div>

            </div>

            <footer class="footer">

                <div class="footer-brand">
                    Swayphics
                </div>

                <div class="footer-tagline">
                    Empowering through design
                </div>

            </footer>

        </section>

    </main>

</body>
</html>

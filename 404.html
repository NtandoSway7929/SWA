<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Swayphics - empowering businesses through design."
    >

    <meta name="robots" content="noindex">

    <title>404 - Swayphics</title>

    <link
        rel="icon"
        type="image/webp"
        href="favicon.webp"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            padding: 28px 6% 40px;

            background:
                radial-gradient(
                    circle at 50% 12%,
                    rgba(119, 193, 252, 0.14) 0%,
                    rgba(119, 193, 252, 0.05) 28%,
                    rgba(255, 255, 255, 0) 58%
                ),
                linear-gradient(
                    180deg,
                    #FAFCFF 0%,
                    #F6F9FF 52%,
                    #FFFFFF 100%
                );

            color: #081533;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .page {
            width: 100%;
            max-width: 960px;
            min-height: calc(100vh - 68px);
            min-height: calc(100svh - 68px);

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shell {
            position: relative;

            width: 100%;

            padding:
                30px
                34px
                28px;

            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.92) 0%,
                    rgba(248, 251, 255, 0.80) 52%,
                    rgba(255, 255, 255, 0.90) 100%
                );

            border:
                1px solid rgba(255, 255, 255, 0.88);

            box-shadow:
                0 28px 80px rgba(0, 32, 150, 0.10),
                0 8px 28px rgba(0, 20, 95, 0.055),
                inset 0 1px 0 rgba(255, 255, 255, 0.96),
                inset 0 -1px 0 rgba(255, 255, 255, 0.40);

            backdrop-filter:
                blur(34px)
                saturate(160%);

            -webkit-backdrop-filter:
                blur(34px)
                saturate(160%);
        }

        .shell::before {
            content: "";

            position: absolute;
            inset: 0;

            border-radius: inherit;

            background:
                radial-gradient(
                    110% 70% at 8% 0%,
                    rgba(255, 255, 255, 0.95) 0%,
                    rgba(255, 255, 255, 0.42) 25%,
                    rgba(255, 255, 255, 0) 58%
                );

            pointer-events: none;
        }

        .header {
            position: relative;
            z-index: 1;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 34px;
        }

        .logo {
            display: inline-flex;
            align-items: center;

            text-decoration: none;
        }

        .logo img {
            display: block;

            width: auto;
            height: 30px;

            object-fit: contain;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding:
                8px
                12px;

            border:
                1px solid
                rgba(0, 32, 150, 0.09);

            border-radius: 999px;

            background:
                rgba(255, 255, 255, 0.62);

            color: #56627A;

            font-size: 0.62rem;
            font-weight: 800;

            letter-spacing: 0.12em;

            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #0152F4;
        }

        .content {
            position: relative;
            z-index: 1;

            text-align: center;
        }

        .broken-link {
            display: block;

            width: min(210px, 44vw);
            height: auto;

            margin:
                8px
                auto
                26px;

            object-fit: contain;
        }

    
        .eyebrow {
    margin-bottom: 12px;

    color: #0152F4;

    font-size: 0.65rem;
    font-weight: 800;

    letter-spacing: 0.16em;

    text-transform: uppercase;
}

        h1 {
            max-width: 720px;

            margin:
                0
                auto
                16px;

            color: #081533;

            font-size:
                clamp(
                    2rem,
                    4vw,
                    3.7rem
                );

            font-weight: 850;

            line-height: 1;

            letter-spacing: -0.05em;
        }

        h1 span {
            color: #0152F4;
        }

        .description {
            max-width: 540px;

            margin:
                0
                auto
                28px;

            color: #56627A;

            font-size: 0.95rem;

            line-height: 1.7;
        }

        .actions {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        .btn {
            min-height: 46px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding:
                0
                19px;

            border-radius: 999px;

            font-size: 0.74rem;
            font-weight: 800;

            letter-spacing: 0.035em;

            text-decoration: none;

            transition:
                transform 0.24s ease,
                background 0.24s ease,
                box-shadow 0.24s ease,
                border-color 0.24s ease;
        }

        .btn-primary {
            background:
                linear-gradient(
                    135deg,
                    #0152F4 0%,
                    #0031C5 100%
                );

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            color: #FFFFFF;

            box-shadow:
                0 9px 25px
                rgba(1, 82, 244, 0.20),
                inset 0 1px 0
                rgba(255, 255, 255, 0.22);
        }

        .btn-primary:hover {
            transform: translateY(-2px);

            box-shadow:
                0 13px 31px
                rgba(1, 82, 244, 0.25),
                inset 0 1px 0
                rgba(255, 255, 255, 0.25);
        }

        .btn-secondary {
            background:
                rgba(255, 255, 255, 0.64);

            border:
                1px solid
                rgba(0, 32, 150, 0.12);

            color: #002096;

            box-shadow:
                inset 0 1px 0
                rgba(255, 255, 255, 0.84);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);

            background:
                rgba(255, 255, 255, 0.90);

            border-color:
                rgba(0, 32, 150, 0.18);

            box-shadow:
                0 8px 22px
                rgba(0, 32, 150, 0.07),
                inset 0 1px 0
                rgba(255, 255, 255, 0.90);
        }

        .footer {
    position: relative;
    z-index: 1;

    margin-top: 38px;
    padding-top: 18px;

    border-top:
        1px solid
        rgba(0, 32, 150, 0.07);

    text-align: center;

    color: #8A94A6;

    font-size: 0.62rem;
    letter-spacing: 0.04em;
}

       
        a:focus-visible {
            outline:
                3px solid
                #77C1FC;

            outline-offset: 4px;
        }

        @media (max-width: 700px) {

            body {
                padding:
                    16px
                    5%
                    28px;
            }

            .page {
                min-height: auto;
            }

            .shell {
                padding:
                    22px
                    18px
                    20px;

                border-radius: 26px;
            }

            .header {
                margin-bottom: 28px;
            }

            .logo img {
                height: 26px;
            }

            .status {
                display: none;
            }

            .broken-link {
                width: min(175px, 48vw);

                margin:
                    4px
                    auto
                    22px;
            }

            .error-code {
                font-size:
                    clamp(
                        4rem,
                        22vw,
                        5.8rem
                    );
            }

            .eyebrow {
                font-size: 0.62rem;
                letter-spacing: 0.12em;
            }

            h1 {
                font-size:
                    clamp(
                        1.9rem,
                        8.5vw,
                        2.8rem
                    );
            }

            .description {
                font-size: 0.88rem;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr;

                width: 100%;
                max-width: 340px;

                margin:
                    0
                    auto;
            }

            .btn {
                width: 100%;
                min-height: 48px;
            }

            .footer {
                flex-direction: column;
                justify-content: center;

                text-align: center;

                margin-top: 34px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            html {
                scroll-behavior: auto;
            }

            .btn {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="shell">

           <header class="header">

    <a
        href="./"
        class="logo"
        aria-label="Swayphics home"
    >
        <img
            src="swayphics-logo.png"
            alt="Swayphics — Empowering through design"
        >
    </a>

</header>

            <div class="content">

    <img
        class="broken-link"
        src="broken-link.png"
        alt="Broken link"
    >

    <div class="eyebrow">
        404
    </div>

    <h1>
        We couldn't find
        <span>that page.</span>
    </h1>

    <p class="description">
        The address may be incorrect, or the page may have moved.
    </p>



                <p class="description">
                    The page you're looking for doesn't exist
                    or may have moved. Don't worry,
                    Swayphics is still here.
                </p>

                <div class="actions">

                    <a
                        href="./"
                        class="btn btn-primary"
                    >
                        Back to Swayphics →
                    </a>

                    <a
                        href="./#services"
                        class="btn btn-secondary"
                    >
                        Explore Services
                    </a>

                </div>

            </div>

            <footer class="footer">
    © 2026 Swayphics
</footer>
        </section>

    </main>

</body>
</html>

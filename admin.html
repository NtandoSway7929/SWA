<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Swayphics private administration."
    >

    <title>
        Swayphics Admin
    </title>


    <style>

        :root {
            --sway-blue: #0152F4;
            --sway-deep: #002096;
            --sway-dark: #081533;
            --text-muted: #56627A;
            --border: rgba(0,32,150,0.10);
        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            background:
                linear-gradient(
                    135deg,
                    #FFFFFF 0%,
                    #F8FBFF 50%,
                    #EDF6FF 100%
                );

            color: var(--sway-dark);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            -webkit-font-smoothing: antialiased;
        }


        .admin-container {

            width: min(460px, 100%);
        }


        .brand {

    text-align: center;

    margin-bottom: 34px;
}


.brand a {

    display: inline-block;

    text-decoration: none;
}


.brand-logo {

    width: 170px;

    height: auto;

    display: block;

    margin: 0 auto 16px;
}


.brand p {

    color: var(--text-muted);

    font-size: 0.8rem;

    letter-spacing: 0.02em;
}

        .login-card {

            padding: 34px;

            border:
                1px solid var(--border);

            border-radius: 24px;

            background:
                rgba(255,255,255,0.90);

            box-shadow:
                0 25px 70px
                rgba(0,32,150,0.10);

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);
        }


        .login-heading {

            margin-bottom: 26px;
        }


        .login-heading span {

            display: block;

            margin-bottom: 8px;

            color: var(--sway-blue);

            font-size: 0.65rem;

            font-weight: 800;

            letter-spacing: 0.18em;

            text-transform: uppercase;
        }


        .login-heading h2 {

            font-size: 1.6rem;

            letter-spacing: -0.04em;
        }


        .form {

            display: grid;

            gap: 18px;
        }


        .field {

            display: grid;

            gap: 8px;
        }


        .field label {

            font-size: 0.76rem;

            font-weight: 800;
        }


        .field input {

            width: 100%;

            padding: 14px 15px;

            border:
                1px solid
                rgba(0,32,150,0.13);

            border-radius: 12px;

            background: #FFFFFF;

            color: var(--sway-dark);

            font-family: inherit;

            font-size: 0.9rem;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .field input:focus {

            border-color: var(--sway-blue);

            box-shadow:
                0 0 0 4px
                rgba(1,82,244,0.08);
        }


        .login-button {

            width: 100%;

            margin-top: 6px;

            padding: 15px 20px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    var(--sway-deep),
                    var(--sway-blue)
                );

            color: #FFFFFF;

            font-family: inherit;

            font-size: 0.82rem;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .login-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 28px
                rgba(1,82,244,0.22);
        }


        .login-button:disabled {

            opacity: 0.65;

            cursor: wait;

            transform: none;
        }


        .status {

            margin-top: 16px;

            padding: 12px 14px;

            border-radius: 10px;

            font-size: 0.78rem;

            line-height: 1.5;

            text-align: center;
        }


        .status.error {

            background:
                rgba(180,30,30,0.07);

            color: #9B1C1C;
        }


        .status.success {

            background:
                rgba(1,82,244,0.07);

            color: var(--sway-deep);
        }


        .footer {

            margin-top: 22px;

            text-align: center;

            color: var(--text-muted);

            font-size: 0.68rem;
        }


        @media (max-width: 520px) {

            .login-card {
                padding: 26px 20px;
            }

        }

    </style>

</head>


<body>

<main class="admin-container">


    <header class="brand">

    <a href="index.html" aria-label="Swayphics home">

        <img
            src="swayphics-logo.png"
            alt="Swayphics"
            class="brand-logo"
        >

    </a>

    <p>
        Private administration
    </p>

</header>


    <section class="login-card">

        <div class="login-heading">

            <span>
                Admin access
            </span>

            <h2>
                Welcome back.
            </h2>

        </div>


        <form
            class="form"
            id="admin-login-form"
        >

            <div class="field">

                <label for="admin-email">
                    Email address
                </label>

                <input
                    type="email"
                    id="admin-email"
                    name="email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="field">

                <label for="admin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    name="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
                id="login-button"
            >
                Sign in
            </button>

        </form>


        <div
            class="status"
            id="login-status"
            hidden
            aria-live="polite"
        ></div>

    </section>


    <footer class="footer">

        Swayphics · Empowering through design.

    </footer>


</main>


<script>

    /* =========================================================
       SUPABASE AUTH
       ========================================================= */

    const SUPABASE_URL =
        "https://sqifhribgsqfaxgtobsa.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_kV_YWij7nHIHjyr3Uv2iIA_PIhr-QhB";


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const loginForm =
        document.getElementById(
            "admin-login-form"
        );

    const loginButton =
        document.getElementById(
            "login-button"
        );

    const loginStatus =
        document.getElementById(
            "login-status"
        );


    /* =========================================================
       LOGIN
       ========================================================= */

    loginForm.addEventListener(
        "submit",
        async (event) => {

            event.preventDefault();


            const email =
                document
                    .getElementById(
                        "admin-email"
                    )
                    .value
                    .trim();


            const password =
                document
                    .getElementById(
                        "admin-password"
                    )
                    .value;


            loginButton.disabled =
                true;

            loginButton.textContent =
                "Signing in...";


            loginStatus.hidden =
                true;


            try {

                const response =
                    await fetch(
                        `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                        {

                            method:
                                "POST",

                            headers: {

                                "apikey":
                                    SUPABASE_PUBLISHABLE_KEY,

                                "Content-Type":
                                    "application/json"

                            },

                            body:
                                JSON.stringify({
                                    email,
                                    password
                                })

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        data.error_description ||
                        "Invalid login details."
                    );

                }


                /*
                 * Store the authenticated session
                 * locally so the next admin page
                 * can use it.
                 */

                localStorage.setItem(
                    "swayphics_admin_access_token",
                    data.access_token
                );

                localStorage.setItem(
                    "swayphics_admin_refresh_token",
                    data.refresh_token
                );


                loginStatus.textContent =
                    "Login successful. Opening the admin dashboard...";

                loginStatus.className =
                    "status success";

                loginStatus.hidden =
                    false;


                /*
                 * Dashboard will be created
                 * in the next phase.
                 */

                setTimeout(
                    () => {

                        window.location.href =
                            "admin-dashboard.html";

                    },
                    700
                );


            } catch (error) {

                console.error(
                    "Admin login failed:",
                    error
                );


                loginStatus.textContent =
                    error.message ||
                    "Unable to sign in.";

                loginStatus.className =
                    "status error";

                loginStatus.hidden =
                    false;


            } finally {

                loginButton.disabled =
                    false;

                loginButton.textContent =
                    "Sign in";

            }

        }
    );

</script>

</body>

</html>
```

<title>Swayphics | Client Portal</title>
<style>
:root{--deep:#002096;--blue:#0152F4;--light:#77C1FC;--dark:#081533;--muted:#56627A;--soft:#8190A5;--line:rgba(0,32,150,.085);--glass:rgba(255,255,255,.84)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;color:var(--dark);background:linear-gradient(135deg,rgba(247,250,255,.88),rgba(255,255,255,.72) 48%,rgba(238,246,255,.86)),url("../background%20branded%20wallpaper.webp") center/cover fixed no-repeat;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{border:0}
.portal-shell{width:min(1160px,92%);margin:0 auto;padding:22px 0 70px}
.portal-nav{position:sticky;top:14px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px 14px 11px 17px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(255,255,255,.70);box-shadow:0 14px 38px rgba(0,32,150,.10),inset 0 1px 0 rgba(255,255,255,.82);backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%)}
.portal-logo{display:block;width:128px;height:auto}.portal-nav-right{display:flex;align-items:center;gap:9px}
.portal-badge,.portal-secure{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 11px;border-radius:999px;font-size:.55rem;font-weight:800;white-space:nowrap}
.portal-badge{background:rgba(1,82,244,.065);color:var(--blue)}
.portal-secure{border:1px solid rgba(1,82,244,.08);background:rgba(255,255,255,.64);color:#56627A}
.portal-secure::before{content:"";width:6px;height:6px;border-radius:50%;background:#22A06B;box-shadow:0 0 0 4px rgba(34,160,107,.08)}
.portal-hero{padding:72px 2px 30px}.portal-kicker{display:inline-block;color:var(--blue);font-size:.57rem;font-weight:900;letter-spacing:.18em}
.portal-hero h1{max-width:900px;margin-top:12px;font-size:clamp(2.5rem,6vw,5.6rem);line-height:.95;letter-spacing:-.065em;font-weight:800}
.portal-hero p{max-width:720px;margin-top:17px;color:var(--muted);font-size:.83rem;line-height:1.75}
.portal-hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}

.portal-button:disabled{opacity:.6;cursor:wait;transform:none}
.portal-section{margin-top:28px}.portal-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:13px}.portal-section-head h2{font-size:1.06rem;letter-spacing:-.035em}.portal-section-head p{color:var(--soft);font-size:.57rem;font-weight:650}

.sway-favicon-loader{--sway-loader-size:54px;position:relative;width:var(--sway-loader-size);height:var(--sway-loader-size);display:block;isolation:isolate}.sway-favicon-loader::before{content:"";position:absolute;inset:3px;border:1.5px solid rgba(1,82,244,.10);border-top-color:rgba(1,82,244,.78);border-right-color:rgba(119,193,252,.34);border-radius:50%;animation:sway-favicon-trace 1.35s cubic-bezier(.65,0,.35,1) infinite}.sway-favicon-loader img,.sway-favicon-loader-mark{position:absolute;inset:10px;width:34px;height:34px;display:block;object-fit:contain}.sway-favicon-loader img{opacity:.10}.sway-favicon-loader-mark{background:conic-gradient(from -40deg,transparent 0 34deg,#0152F4 52deg 116deg,rgba(119,193,252,.82) 132deg 156deg,transparent 174deg 360deg);-webkit-mask:url("../FIST.webp") center/contain no-repeat;mask:url("../FIST.webp") center/contain no-repeat;animation:sway-favicon-draw 1.25s linear infinite}.sway-favicon-loader-dot{position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#0152F4;box-shadow:0 0 0 4px rgba(1,82,244,.07),0 3px 10px rgba(1,82,244,.18);transform-origin:3px calc(var(--sway-loader-size) / 2);animation:sway-favicon-dot 1.25s linear infinite}

t:focus,.onboarding-form .field textarea:focus,.onboarding-form .field select:focus{border-color:rgba(1,82,244,.34);box-shadow:0 0 0 4px rgba(1,82,244,.06);background:#fff}.asset-upload{display:grid;gap:9px;padding:13px;border:1px dashed rgba(1,82,244,.18);border-radius:14px;background:rgba(1,82,244,.025)}.asset-upload input[type=file]{padding:9px;background:rgba(255,255,255,.75);cursor:pointer}.asset-upload-actions{display:flex;align-items:center;justify-content:space-between;gap:9px}.asset-upload-status{color:var(--muted);font-size:.51rem;line-height:1.45}.asset-list{display:grid;gap:6px;margin-top:8px}.asset-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid rgba(0,32,150,.06);border-radius:10px;background:rgba(255,255,255,.64)}.asset-item-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dark);font-size:.54rem;font-weight:750}.asset-item-meta{flex:0 0 auto;color:var(--soft);font-size:.47rem}.service-list{display:grid;gap:9px}.service-row{display:grid;grid-template-columns:1.1fr .55fr 1.25fr auto;gap:8px;align-items:end}.service-row .field{min-width:0}.remove-service{height:38px;padding:0 10px;border-radius:10px;background:rgba(190,44,44,.06);color:#9A2525;font-size:.5rem;font-weight:850;cursor:pointer}.add-service{margin-top:9px;background:rgba(1,82,244,.055);color:var(--blue);border:1px dashed rgba(1,82,244,.18);box-shadow:none}.onboarding-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:2px}.onboarding-actions-right{display:flex;gap:8px}.save-status{color:var(--muted);font-size:.52rem;line-height:1.45}.required-note{color:var(--soft);font-size:.49rem}.onboarding-submitted{padding:15px;border-radius:14px;background:rgba(34,160,107,.065);color:#18784F;font-size:.55rem;line-height:1.55}.onboarding-submitted strong{display:block;margin-bottom:3px}.onboarding-locked{opacity:.72}.onboarding-locked input,.onboarding-locked textarea /* Premium client-portal visual system: opaque surfaces, graphite neutrals and restrained Swayphics blue. */
:root{
  --charcoal:#343A40;
  --charcoal-deep:#252B31;
  --charcoal-muted:#56616B;
  --dark:var(--charcoal);
  --muted:#59636D;
  --soft:#737E88;
  --line:rgba(52,58,64,.13);
  --glass:rgba(255,255,255,.97);
}
body{
  color:var(--charcoal);
  background:linear-gradient(135deg,rgba(248,249,250,.965),rgba(246,247,248,.95) 48%,rgba(239,242,245,.97)),url("../background%20branded%20wallpaper.webp") center/cover fixed no-repeat;
}
.portal-nav{
  border-color:rgba(52,58,64,.10);
  background:rgba(250,251,252,.97);
  box-shadow:0 14px 38px rgba(37,43,49,.10),inset 0 1px 0 rgba(255,255,255,.96);
  backdrop-filter:blur(12px) saturate(110%);
  -webkit-backdrop-filter:blur(12px) saturate(110%);
}
.portal-secure{
  border-color:rgba(52,58,64,.10);
  background:#F1F3F5;
  color:#46515B;
}
.portal-hero h1,
.portal-section-head h2,
.card-head h3,
.request-copy h3,
.modal-head h3,
.onboarding-section-head h4{
  color:var(--charcoal-deep);
}
.portal-hero p,.request-copy p,.card-head p,.onboarding-section-head p{
  color:var(--charcoal-muted);
}
.stat-card,.portal-card{
  border-color:rgba(52,58,64,.10);
  background:linear-gradient(145deg,rgba(255,255,255,.99),rgba(249,250,251,.98));
  box-shadow:0 16px 42px rgba(37,43,49,.075),inset 0 1px 0 rgba(255,255,255,.98);
  backdrop-filter:blur(8px) saturate(108%);
  -webkit-backdrop-filter:blur(8px) saturate(108%);
}
.stat-card::after{
  background:radial-gradient(circle,rgba(1,82,244,.075),rgba(1,82,244,0) 72%);
}
.stat-card span,.card-count,.project-item-footer small,.field-help,.asset-upload-status,.asset-item-meta{
  color:var(--soft);
}
.project-item,.financial-item{
  border-color:rgba(52,58,64,.085);
  background:#F6F7F8;
}
.project-name,.financial-name,.financial-item b,.project-detail .detail-box strong{
  color:var(--charcoal-deep);
}
.project-meta,.financial-meta,.empty{
  color:var(--charcoal-muted);
}
.portal-button.secondary{
  border-color:rgba(52,58,64,.14);
  background:#F0F2F4;
  color:var(--charcoal-deep);
}
.portal-button.secondary:hover{
  background:#E8EBEE;
  box-shadow:0 8px 20px rgba(37,43,49,.08);
}
.onboarding-section{
  border-color:rgba(52,58,64,.10);
  background:rgba(249,250,251,.98);
}
.onboarding-guide{
  border-color:rgba(52,58,64,.10);
  background:linear-gradient(135deg,#F0F2F4,#FAFBFC);
}
.onboarding-guide strong{
  color:var(--charcoal-deep);
}
.onboarding-tip{

if(!quiet){message.hidden=false;message.textContent=submit?"Thank you. Your information has been submitted to Swayphics for review.":"Your progress has been saved. You can return to this private link later and continue.";}
if(submit){
form.classList.add("onboarding-locked");
form.querySelectorAll("input,textarea,select").forEach(function(el){el.disabled=true});
form.querySelectorAll("#add-service,[data-remove-service],#upload-assets").forEach(function(el){el.disabled=true});
if(saveButton)saveButton.hidden=true;
if(nextButton)nextButton.hidden=true;
if(submitButton)submitButton.hidden=true;
message.className="onboarding-submitted";
message.innerHTML="<strong>Information submitted</strong>Your onboarding information is now with Swayphics. We will review it and contact you if anything needs clarification.";
}
return true;
}catch(error){
if(saveState)saveState.textContent="Not saved";
if(statusBox)statusBox.textContent="Unable to save changes";
message.hidden=false;
message.textContent=error.message||"Unable to save your information.";
return false;
}finally{
if(saveButton&&!locked)saveButton.disabled=false;
if(nextButton&&!locked)nextButton.disabled=false;
if(submitButton&&!locked)submitButton.disabled=false;
}
};
saveQueue=saveQueue.then(run,run);
return saveQueue;
}

function isClientInvoicePayable(item){return ["sent","partially paid","overdue"].includes(String(item&&item.status||"").toLowerCase())&&Number(item&&item.amount_outstanding||0)>0}
function getClientNextStep(onboarding,invoices,quotes,active,projects){
const saved=onboarding||{},invoiceRows=Array.isArray(invoices)?invoices:[],quoteRows=Array.isArray(quotes)?quotes:[],activeRows=Array.isArray(active)?active:[],projectRows=Array.isArray(projects)?projects:[];
if(saved.status!=="submitted")return {badge:"Action needed",title:"Complete your onboarding",description:"Share your business details, services and brand information so we can prepare the right website experience for your business.",action:"Continue onboarding",target:"onboarding-section"};
const overdue=invoiceRows.find(function(item){return String(item.status||"").toLowerCase()==="overdue"&&Number(item.amount_outstanding||0)>0});
if(overdue)return {badge:"Payment overdue",title:"Review your outstanding invoice",description:"An invoice is marked overdue. Open your finances to review the balance and payment details.",action:"View finances",target:"finances-section"};
const dueInvoice=invoiceRows.find(isClientInvoicePayable);
if(dueInvoice)return {badge:"Payment due",title:"Review your invoice",description:"There is an outstanding invoice on your account. You can review its amount, due date and payment status in your finances.",action:"View finances",target:"finances-section"};
const sentQuote=quoteRows.find(function(item){return String(item.status||"").toLowerCase()==="sent"});
if(sentQuote)return {badge:"Awaiting your review",title:"Your quotation is ready",description:"A quotation has been sent for your review. Open your finances to see the quotation details and validity date.",action:"Review quotation",target:"finances-section"};
if(activeRows.length)return {badge:"Project in progress",title:"See how your project is progressing",description:"Your Swayphics project is active. Visit your project area to review its current stage and available details.",action:"View my projects",target:"projects-section"};
const pausedProject=projectRows.find(function(item){return String(item.status||"").toLowerCase()==="paused"});
if(pausedProject)return {badge:"Project update",title:"Your project is currently paused",description:"One of your projects is marked as paused. Visit My Projects to review its current details or contact Swayphics if you need an update.",action:"View my projects",target:"projects-section"};
const completedProject=projectRows.find(function(item){return String(item.status||"").toLowerCase()==="completed"});
if(completedProject)return {badge:"Workspace update",title:"Your completed projects are here",description:"You can revisit the details and progress of work completed with Swayphics at any time.",action:"View my projects",target:"projects-section"};
return {badge:"All clear",title:"Your workspace is up to date",description:"There are no outstanding onboarding actions or invoice balances currently recorded. Need something else? Send a request directly to Swayphics.",action:"Make a request",target:"request-section"};
}
function bindPortalNavigation(){
const links=Array.from(document.querySelectorAll("[data-portal-nav-link]"));
if(!links.length)return;
function setActive(id){
links.forEach(function(link){const active=link.getAttribute("href")==="#"+id;link.classList.toggle("active",active);if(active)link.setAttribute("aria-current","location");else link.removeAttribute("aria-current")});
}
links.forEach(function(link){link.addEventListener("click",function(){setActive(link.getAttribute("href").slice(1))})});
if("IntersectionObserver" in window){
const observer=new IntersectionObserver(function(entries){
const visible=entries.filter(function(entry){return entry.isIntersecting}).sort(function(a,b){return b.intersectionRatio-a.intersectionRatio})[0];
if(visible)setActive(visible.target.id);
},{rootMargin:"-18% 0px -68% 0px",threshold:[0,.1,.25,.5]});
links.forEach(function(link){const target=document.getElementById(link.getAttribute("href").slice(1));if(target)observer.observe(target)});
}
}

async function load(){
if(!token){renderPortalError("Portal link required","This page needs a valid private Swayphics portal link.");return}
try{
    const results=await Promise.all([portalRpc("get_client_portal",{p_token:token},15000),portalRpc("get_client_onboarding",{p_token:token},15000)]);
    const data=results[0], onboardingResult=results[1];
    if(!data||!data.ok)throw new Error(data&&data.error||"This portal link is invalid or expired.");
    if(!onboardingResult||!onboardingResult.ok)throw new Error(onboardingResult&&onboardingResult.error||"The onboarding form could not be loaded.");
    render(data,onboardingResult.onboarding||{});
}catch(error){
    renderPortalError("Unable to open portal",error&&error.message||"This portal link is invalid or has expired.");
}
}

})();

(function(){if(!("MutationObserver" in window))return;const busyPattern=/^(loading|syncing|uploading|saving|sending|processing|refreshing|deleting|generating|enabling|submitting|creating)(?:\s|\.\.\.|…|$)/i;function updateButton(button){if(!(button instanceof HTMLButtonElement))return;const text=String(button.textContent||"").trim();const isBusy=busyPattern.test(text)&&/(?:\.\.\.|…)$/.test(text);button.classList.toggle("sway-loading-button",isBusy)}document.querySelectorAll("button").forEach(updateButton);new MutationObserver(function(mutations){mutations.forEach(function(mutation){const button=mutation.target instanceof Element?mutation.target.closest("button"):mutation.target.parentElement?.closest("button");if(button)updateButton(button)})}).observe(document.body,{subtree:true,childList:true,characterData:true})})();

<title>Swayphics | Client Portal</title>
<style>
:root{--deep:#002096;--blue:#0152F4;--light:#77C1FC;--dark:#081533;--muted:#56627A;--soft:#8190A5;--line:rgba(0,32,150,.085);--glass:rgba(255,255,255,.84)}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{min-height:100vh;font-family:'Plus Jakarta Sans',sans-serif;color:var(--dark);background:linear-gradient(135deg,rgba(247,250,255,.88),rgba(255,255,255,.72) 48%,rgba(238,246,255,.86)),url("../background%20branded%20wallpaper.webp") center/cover fixed no-repeat;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit}button{border:0}
.portal-shell{width:min(1160px,92%);margin:0 auto;padding:22px 0 70px}
.portal-nav{position:sticky;top:14px;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px 14px 11px 17px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(255,255,255,.70);box-shadow:0 14px 38px rgba(0,32,150,.10),inset 0 1px 0 rgba(255,255,255,.82);backdrop-filter:blur(22px) saturate(145%);-webkit-backdrop-filter:blur(22px) saturate(145%)}
.portal-logo{display:block;width:128px;height:auto}.portal-nav-right{display:flex;align-items:center;gap:9px}
.portal-badge,.portal-secure{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 11px;border-radius:999px;font-size:.55rem;font-weight:800;white-space:nowrap}
.portal-badge{background:rgba(1,82,244,.065);color:var(--blue)}

.portal-hero-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
.portal-button{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,var(--deep),var(--blue));color:#fff;font-size:.61rem;font-weight:800;box-shadow:0 10px 24px rgba(1,82,244,.16);transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease}

.portal-section{margin-top:28px}.portal-section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:13px}.portal-section-head h2{font-size:1.06rem;letter-spacing:-.035em}.portal-section-head p{color:var(--soft);font-size:.57rem;font-weight:650}

.stat-card span{display:block;color:var(--soft);font-size:.52rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.stat-card strong{display:block;margin-top:8px;color:var(--dark);font-size:1.22rem;font-weight:850;letter-spacing:-.04em}.stat-card small{display:block;margin-top:4px;color:var(--muted);font-size:.52rem;line-height:1.45}
.portal-card{border:1px solid rgba(255,255,255,.72);border-radius:22px;padding:20px;background:linear-gradient(145deg,rgba(255,255,255,.91),rgba(247,250,255,.79));box-shadow:0 18px 50px rgba(0,32,150,.06),inset 0 1px 0 rgba(255,255,255,.76);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}
.portal-grid{display:grid;grid-template-columns:1.22fr .78fr;gap:16px}.portal-card.wide{grid-column:1/-1}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}.card-head h3{font-size:.91rem;letter-spacing:-.025em}.card-head p{margin-top:4px;color:var(--soft);font-size:.54rem;line-height:1.5}.card-count{color:var(--soft);font-size:.54rem;font-weight:800}

.project-top,.financial-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.project-name,.financial-name{color:var(--dark);font-size:.66rem;font-weight:850}.project-meta,.financial-meta{margin-top:5px;color:var(--muted);font-size:.54rem;line-height:1.55}

.financial-item b{color:var(--dark);font-size:.67rem}.empty{padding:18px 8px;color:var(--muted);font-size:.58rem;line-height:1.55}

.request-form{display:grid;gap:10px}.field{display:grid;gap:6px}.field label{font-size:.57rem;font-weight:800}.field input,.field textarea{width:100%;border:1px solid rgba(0,32,150,.11);border-radius:12px;padding:11px 12px;color:var(--dark);background:rgba(255,255,255,.80);outline:none;font-size:.64rem}.field textarea{min-height:120px;resize:vertical;line-height:1.6}.field input:focus,.field textarea:focus{border-color:rgba(1,82,244,.34);box-shadow:0 0 0 4px rgba(1,82,244,.06);background:#fff}
.message{padding:9px 11px;border-radius:11px;background:rgba(1,82,244,.055);color:var(--muted);font-size:.55rem;line-height:1.5}
.portal-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:28px;padding:15px 3px;color:var(--soft);font-size:.52rem;line-height:1.5}.portal-footer strong{color:#56627A}
.loading,.error{min-height:100vh;display:grid;place-items:center;align-content:center;gap:13px;padding:24px;text-align:center}.loading-copy{display:grid;gap:4px}.loading-copy strong{color:var(--dark);font-size:.78rem;font-weight:800}.loading-copy span{color:var(--muted);font-size:.62rem;font-weight:600}.error strong{display:block;color:var(--dark);font-size:1rem;margin-bottom:7px}
.sway-favicon-loader{--sway-loader-size:54px;position:relative;width:var(--sway-loader-size);height:var(--sway-loader-size);display:block;isolation:isolate}.sway-favicon-loader::before{content:"";position:absolute;inset:3px;border:1.5px solid rgba(1,82,244,.10);border-top-color:rgba(1,82,244,.78);border-right-color:rgba(119,193,252,.34);border-radius:50%;animation:sway-favicon-trace 1.35s cubic-bezier(.65,0,.35,1) infinite}.sway-favicon-loader img,.sway-favicon-loader-mark{position:absolute;inset:10px;width:34px;height:34px;display:block;object-fit:contain}.sway-favicon-loader img{opacity:.10}.sway-favicon-loader-mark{background:conic-gradient(from -40deg,transparent 0 34deg,#0152F4 52deg 116deg,rgba(119,193,252,.82) 132deg 156deg,transparent 174deg 360deg);-webkit-mask:url("../FIST.webp") center/contain no-repeat;mask:url("../FIST.webp") center/contain no-repeat;animation:sway-favicon-draw 1.25s linear infinite}.sway-favicon-loader-dot{position:absolute;top:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#0152F4;box-shadow:0 0 0 4px rgba(1,82,244,.07),0 3px 10px rgba(1,82,244,.18);transform-origin:3px calc(var(--sway-loader-size) / 2);animation:sway-favicon-dot 1.25s linear infinite}
@keyframes sway-favicon-draw{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes sway-favicon-trace{0%,100%{transform:rotate(-18deg);opacity:.68}50%{transform:rotate(162deg);opacity:1}}@keyframes sway-favicon-dot{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.sway-loading-button{display:inline-flex;align-items:center;justify-content:center;gap:7px}.sway-loading-button::before{content:"";width:14px;height:14px;flex:0 0 14px;background:conic-gradient(from -40deg,transparent 0 38deg,#0152F4 54deg 122deg,rgba(119,193,252,.82) 138deg 158deg,transparent 176deg 360deg);-webkit-mask:url("../FIST.webp") center/contain no-repeat;mask:url("../FIST.webp") center/contain no-repeat;animation:sway-button-favicon-draw 1.05s linear infinite}@keyframes sway-button-favicon-draw{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.portal-modal{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:18px}.modal-backdrop{position:absolute;inset:0;background:rgba(8,21,51,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.modal-card{position:relative;z-index:1;width:min(720px,100%);max-height:calc(100vh - 36px);overflow:auto;border:1px solid rgba(255,255,255,.74);border-radius:24px;padding:21px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(247,250,255,.95));box-shadow:0 30px 90px rgba(0,32,150,.20)}.modal-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.modal-head h3{font-size:1.15rem;letter-spacing:-.04em}.modal-head p{margin-top:5px;color:var(--muted);font-size:.57rem}.modal-close{width:34px;height:34px;border-radius:50%;background:rgba(0,32,150,.05);color:var(--dark);font-size:1rem;cursor:pointer}.modal-close:hover{background:rgba(1,82,244,.08);color:var(--blue)}
.timeline{display:grid;gap:9px;margin-top:18px}.timeline-step{display:grid;grid-template-columns:29px 1fr;gap:10px;align-items:center}.timeline-node{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(0,32,150,.08);background:#fff;color:var(--soft);font-size:.5rem;font-weight:900}.timeline-step.complete .timeline-node{background:rgba(1,82,244,.08);color:var(--blue);border-color:rgba(1,82,244,.10)}.timeline-step.current strong{color:var(--blue)}.timeline-step strong{font-size:.61rem;font-weight:850}.timeline-step small{display:block;margin-top:2px;color:var(--soft);font-size:.49rem}.project-detail{display:grid;gap:14px;margin-top:18px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.detail-box{padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.65)}.detail-box span{display:block;color:var(--soft);font-size:.48rem;font-weight:800;text-transform:uppercase}.detail-box strong{display:block;margin-top:3px;font-size:.59rem}.detail-description{padding:12px;border-radius:13px;background:rgba(1,82,244,.035);color:var(--muted);font-size:.57rem;line-height:1.65}

.progress span.current{box-shadow:0 0 0 2px rgba(1,82,244,.12)}

.project-schedule-card{display:grid;align-content:start;gap:7px;padding:14px;border:1px solid rgba(52,58,64,.09);border-radius:15px;background:#F6F7F8}

/* Premium client-portal visual system: opaque surfaces, graphite neutrals and restrained Swayphics blue. */
:root{
  --charcoal:#343A40;
  --charcoal-deep:#252B31;
  --charcoal-muted:#56616B;
  --dark:var(--charcoal);
  --muted:#59636D;
  --soft:#737E88;
  --line:rgba(52,58,64,.13);
  --glass:rgba(255,255,255,.97);
}
body{
  color:var(--charcoal);
  background:linear-gradient(135deg,rgba(248,249,250,.965),rgba(246,247,248,.95) 48%,rgba(239,242,245,.97)),url("../background%20branded%20wallpaper.webp") center/cover fixed no-repeat;
}
.portal-nav{
  border-color:rgba(52,58,64,.10);
  background:rgba(250,251,252,.97);
  box-shadow:0 14px 38px rgba(37,43,49,.10),inset 0 1px 0 rgba(255,255,255,.96);
  backdrop-filter:blur(12px) saturate(110%);
  -webkit-backdrop-filter:blur(12px) saturate(110%);
}
.portal-secure{
  border-color:rgba(52,58,64,.10);
  background:#F1F3F5;
  color:#46515B;
}
.portal-hero h1,
.portal-section-head h2,
.card-head h3,
.request-copy h3,
.modal-head h3,
.onboarding-section-head h4{
  color:var(--charcoal-deep);
}
.portal-hero p,.request-copy p,.card-head p,.onboarding-section-head p{
  color:var(--charcoal-muted);
}
.stat-card,.portal-card{
  border-color:rgba(52,58,64,.10);
  background:linear-gradient(145deg,rgba(255,255,255,.99),rgba(249,250,251,.98));
  box-shadow:0 16px 42px rgba(37,43,49,.075),inset 0 1px 0 rgba(255,255,255,.98);
  backdrop-filter:blur(8px) saturate(108%);
  -webkit-backdrop-filter:blur(8px) saturate(108%);
}
.stat-card::after{
  background:radial-gradient(circle,rgba(1,82,244,.075),rgba(1,82,244,0) 72%);
}
.stat-card span,.card-count,.project-item-footer small,.field-help,.asset-upload-status,.asset-item-meta{
  color:var(--soft);
}
.project-item,.financial-item{
  border-color:rgba(52,58,64,.085);
  background:#F6F7F8;
}
.project-name,.financial-name,.financial-item b,.project-detail .detail-box strong{
  color:var(--charcoal-deep);
}
.project-meta,.financial-meta,.empty{
  color:var(--charcoal-muted);
}
.portal-button.secondary{
  border-color:rgba(52,58,64,.14);
  background:#F0F2F4;
  color:var(--charcoal-deep);
}
.portal-button.secondary:hover{
  background:#E8EBEE;
  box-shadow:0 8px 20px rgba(37,43,49,.08);
}
.onboarding-section{
  border-color:rgba(52,58,64,.10);
  background:rgba(249,250,251,.98);
}
.onboarding-guide{
  border-color:rgba(52,58,64,.10);
  background:linear-gradient(135deg,#F0F2F4,#FAFBFC);
}
.onboarding-guide strong{
  color:var(--charcoal-deep);
}
.onboarding-tip{
  border-color:rgba(86,97,107,.24);
  background:#F4F6F7;
}
.onboarding-tip span{
  color:var(--charcoal-muted);
}
.onboarding-number{
  background:linear-gradient(145deg,#414A53,#293139);
  color:#fff;
  box-shadow:0 5px 12px rgba(37,43,49,.14);
}
.onboarding-form .field input,
.onboarding-form .field textarea,
.onboarding-form .field select,
.field input,.field textarea{
  border-color:rgba(52,58,64,.16);
  background:#fff;
  color:var(--charcoal-deep);
}
.onboarding-form .field input:focus,
.onboarding-form .field textarea:focus,
.onboarding-form .field select:focus,
.field input:focus,.field textarea:focus{
  border-color:rgba(1,82,244,.42);
  box-shadow:0 0 0 4px rgba(1,82,244,.075);
  background:#fff;
}
.asset-upload{
  border-color:rgba(86,97,107,.28);
  background:#F5F6F7;
}
.asset-upload input[type=file]{
  background:#fff;
}
.asset-item{
  border-color:rgba(52,58,64,.09);
  background:#fff;
}
.detail-box{
  border-color:rgba(52,58,64,.10);
  background:#F5F6F7;
}
.detail-description{
  background:#F0F3F5;
  color:var(--charcoal-muted);
}
.modal-backdrop{
  background:rgba(37,43,49,.48);
}
.modal-card{
  border-color:rgba(255,255,255,.88);
  background:linear-gradient(145deg,#FFFFFF,#F5F7F8);
  box-shadow:0 30px 90px rgba(37,43,49,.24);
}
.modal-close{
  background:#EEF1F3;
  color:var(--charcoal-deep);
}
.modal-close:hover{
  background:#E2E7EA;
  color:var(--blue);
}
.message{
  background:#F0F3F5;
  color:var(--charcoal-muted);
}
.portal-footer{
  color:var(--charcoal-muted);
}
.portal-footer strong{
  color:var(--charcoal-deep);
}
.onboarding-locked input,.onboarding-locked textarea,.onboarding-locked select{
  background:#F1F3F5;
}

/* Phase 1: guided overview and persistent client navigation. */
.portal-section-nav{
  position:sticky;
  top:78px;
  z-index:45;
  display:flex;
  align-items:center;
  gap:5px;
  width:max-content;
  max-width:100%;
  margin:12px auto 0;
  padding:6px;
  overflow:visible;
  border:1px solid rgba(52,58,64,.10);
  border-radius:999px;
  background:rgba(250,251,252,.98);
  box-shadow:0 10px 28px rgba(37,43,49,.08);
}
.portal-section-nav::-webkit-scrollbar{display:none}
.portal-section-links{display:flex;align-items:center;gap:5px;min-width:0}
.portal-section-links::-webkit-scrollbar{display:none}
.portal-request-shortcut{display:none}
.portal-section-nav a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  padding:0 14px;
  border-radius:999px;
  color:#56616B;
  font-size:.57rem;
  font-weight:800;
  text-decoration:none;
  white-space:nowrap;
  transition:background .18s ease,color .18s ease,box-shadow .18s ease;
}
.portal-section-nav a:hover{background:#EEF1F3;color:#252B31}
.portal-section-nav a.active{background:#343A40;color:#fff;box-shadow:0 5px 14px rgba(37,43,49,.16)}
.portal-section-nav a:focus-visible{outline:3px solid rgba(1,82,244,.32);outline-offset:2px}

  padding:22px 24px;
  border:1px solid rgba(52,58,64,.11);
  border-radius:22px;
  background:linear-gradient(120deg,#FFFFFF 0%,#F4F6F7 100%);

}
.next-step-content{min-width:0;display:grid;gap:8px}

.next-step-heading{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.next-step-heading h2{color:#252B31;font-size:clamp(1.05rem,2vw,1.38rem);line-height:1.2;letter-spacing:-.035em}

.portal-project-grid{grid-template-columns:1fr}
.portal-finance-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}

.portal-documents-panel{padding:20px}
.portal-documents-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.portal-document-card{display:grid;align-content:start;gap:9px;min-width:0;padding:15px;border:1px solid rgba(52,58,64,.11);border-radius:16px;background:linear-gradient(145deg,#FFFFFF,#F6F7F8);box-shadow:0 10px 26px rgba(37,43,49,.045)}

.portal-document-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:5px;padding-top:8px;border-top:1px solid rgba(52,58,64,.08);color:#76818A;font-size:.46rem;font-weight:650}

.finance-overview-panel{display:grid;grid-template-columns:minmax(220px,.82fr) minmax(0,1.18fr);gap:22px;align-items:center;margin:4px 0 17px;padding:23px 25px;border:1px solid rgba(52,58,64,.13);border-radius:22px;background:linear-gradient(125deg,#252B31 0%,#343A40 68%,#26394E 100%);box-shadow:0 18px 42px rgba(37,43,49,.16);color:#fff}

const changed=id!==activeId;
activeId=id;
let activeLink=null;
links.forEach(function(link){
const active=link.getAttribute("href")==="#"+id;
link.classList.toggle("active",active);
if(active){link.setAttribute("aria-current","location");activeLink=link}
else link.removeAttribute("aria-current");
});
if(changed&&activeLink&&nav){
const strip=nav.querySelector(".portal-section-links");
if(strip&&strip.scrollWidth>strip.clientWidth){
const left=activeLink.offsetLeft-strip.offsetLeft-(strip.clientWidth-activeLink.offsetWidth)/2;
strip.scrollTo({left:Math.max(0,left),behavior:"smooth"});
}
}
}
function updateActive(){
scheduled=false;
const navRect=nav?nav.getBoundingClientRect():null;
const activationLine=(navRect?navRect.bottom:0)+Math.max(18,Math.min(48,window.innerHeight*.045));
let current=items[0];
for(let i=0;i<items.length;i++){
const rect=items[i].target.getBoundingClientRect();
if(rect.top<=activationLine)current=items[i];
else break;
}
const atBottom=window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-2;
if(atBottom)current=items[items.length-1];
setActive(current.id);
}
function scheduleUpdate(){
if(scheduled)return;
scheduled=true;
window.requestAnimationFrame(updateActive);
}
links.forEach(function(link){
link.addEventListener("click",function(){
const id=String(link.getAttribute("href")||"").slice(1);
setActive(id);
});
});
window.addEventListener("scroll",scheduleUpdate,{passive:true});
window.addEventListener("resize",scheduleUpdate,{passive:true});
window.addEventListener("load",scheduleUpdate,{once:true});
scheduleUpdate();
}

async function yocoPortalApi(functionName,payload){
const response=await fetch(SUPABASE_URL+"/functions/v1/"+encodeURIComponent(functionName),{
method:"POST",
headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Authorization":"Bearer "+SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json","Accept":"application/json"},
body:JSON.stringify(Object.assign({token:token},payload||{})),
cache:"no-store"
});
const raw=await response.text();let result=null;try{result=raw?JSON.parse(raw):null}catch(_){result=null}
if(!response.ok||!result||result.ok!==true)throw new Error(result&&result.error||"The online payment service could not complete the request.");
return result;
}
async function startYocoCheckout(modal,amountInput,button,statusBox){
const invoiceId=String(modal.dataset.invoiceId||"");
const amount=Number(amountInput.value);
const amountCents=Math.round(amount*100);
const min=Number(amountInput.min)*100,max=Number(amountInput.max)*100;
if(!invoiceId||!Number.isFinite(amount)||!Number.isSafeInteger(amountCents)||amountCents<min||amountCents>max){
statusBox.hidden=false;statusBox.className="finance-online-status error";statusBox.textContent="Enter a valid amount within the permitted invoice balance and minimum deposit.";return;
}
if(!modal.dataset.paymentIdempotencyKey){
if(!window.crypto||typeof window.crypto.randomUUID!=="function"){
statusBox.hidden=false;statusBox.className="finance-online-status error";statusBox.textContent="This browser cannot securely prepare a payment request. Please use an updated browser.";return;
}
modal.dataset.paymentIdempotencyKey=window.crypto.randomUUID();
}
button.disabled=true;button.textContent="Preparing secure checkout...";
statusBox.hidden=false;statusBox.className="finance-online-status";statusBox.textContent="Creating your secure Yoco checkout. Do not close this window.";
try{
const result=await yocoPortalApi("create-payment-checkout",{
invoice_id:invoiceId,amount_cents:amountCents,idempotency_key:modal.dataset.paymentIdempotencyKey
});
if(!result.checkout_url||!/^https:\/\//i.test(result.checkout_url))throw new Error("The provider did not return a valid secure checkout link.");
statusBox.textContent="Checkout ready. Redirecting you to Yoco...";
window.location.assign(result.checkout_url);
}catch(error){
button.disabled=false;button.textContent="Try checkout again";
statusBox.className="finance-online-status error";
statusBox.textContent=error&&error.message||"Checkout could not be created. You can safely try again.";
}
}
async function checkYocoPaymentReturn(){
const params=new URLSearchParams(window.location.search),attemptId=params.get("payment_attempt");
if(!attemptId)return;
const hero=document.querySelector(".portal-hero");
if(!hero)return;
const status=document.createElement("div");
status.className="finance-online-status";
status.setAttribute("role","status");status.setAttribute("aria-live","polite");
status.textContent="Checking your payment confirmation with Swayphics...";
hero.appendChild(status);
let latest=null;
for(let i=0;i<5;i++){
try{
latest=await yocoPortalApi("get-payment-status",{attempt_id:attemptId});
if(latest.confirmed)break;
if(["failed","expired","cancelled","requires_review"].includes(String(latest.attempt?.status||"").toLowerCase()))break;
}catch(error){latest={error:error&&error.message||"Payment status is temporarily unavailable."};}
if(i<4)await new Promise(function(resolve){window.setTimeout(resolve,2500)});
}
if(latest&&latest.confirmed){
status.className="finance-online-status success";
status.textContent="Payment confirmed. Your invoice balance and payment receipt are being refreshed.";
const cleanUrl=new URL(window.location.href);cleanUrl.searchParams.delete("payment_attempt");window.history.replaceState({},document.title,cleanUrl.toString());
window.setTimeout(function(){window.location.reload()},1000);
return;
}
const attemptStatus=String(latest&&latest.attempt&&latest.attempt.status||"").toLowerCase();
if(attemptStatus==="failed"||attemptStatus==="expired"||attemptStatus==="cancelled"){
status.className="finance-online-status error";
status.textContent="Yoco did not confirm this payment. Your invoice remains outstanding. You can try again or use EFT.";
}else if(attemptStatus==="requires_review"){
status.className="finance-online-status warning";
status.textContent="Your payment needs a manual confirmation check. Please contact Swayphics before attempting another payment.";
}else{
status.className="finance-online-status warning";
status.textContent="Payment confirmation is still pending. Your invoice will update only after verified confirmation. Refresh this page in a moment to check again.";
}
}

}
modal.className="portal-modal";modal.id="portal-financial-modal";if(type==="invoice")modal.dataset.invoiceId=String(item.id||"");
modal.innerHTML='<div class="modal-backdrop" data-finance-close></div><section class="modal-card finance-modal-card" role="dialog" aria-modal="true" aria-labelledby="portal-financial-title"><div class="modal-head"><div><span class="portal-kicker">'+subtitle+'</span><h3 id="portal-financial-title">'+esc(title)+'</h3><p>Financial information recorded on your Swayphics account.</p></div><button type="button" class="modal-close" data-finance-close aria-label="Close financial details">×</button></div><div class="project-detail">'+details+'<div class="detail-description finance-notes"><strong>Notes from Swayphics</strong><p>'+esc(notes)+'</p></div>'+(type==="invoice"&&invoiceFinancialBreakdown(item).outstanding>0?(item.online_payment_enabled?'<section class="finance-online-panel"><div><strong>Pay this invoice online</strong><p>Secure card checkout hosted by Yoco. Your invoice is updated only after Swayphics receives verified payment confirmation.</p></div><div class="finance-online-controls"><div class="field"><label for="finance-yoco-amount">Payment amount (ZAR)</label><input id="finance-yoco-amount" type="number" inputmode="decimal" min="'+(Number(item.deposit_amount)>0?Number(item.deposit_amount).toFixed(2):"2.00")+'" max="'+invoiceFinancialBreakdown(item).outstanding.toFixed(2)+'" step="0.01" value="'+invoiceFinancialBreakdown(item).outstanding.toFixed(2)+'" '+(item.partial_payment_enabled?"":"readonly")+'></div><button type="button" class="portal-button" id="finance-yoco-pay">Continue to secure checkout</button></div><small class="finance-online-note">'+(item.partial_payment_enabled?"You may pay any amount from the required minimum deposit to the remaining balance.":"Online payment is set to full balance only for this invoice.")+(Number(item.deposit_amount)>0?" Minimum required deposit: "+esc(financialMoney(item.deposit_amount,invoiceFinancialBreakdown(item).currency))+".":"")+'</small><div id="finance-yoco-status" class="finance-online-status" hidden role="status" aria-live="polite"></div></section>':'<p class="finance-payment-guidance">Online payment has not been enabled for this invoice. Use the request below to ask Swayphics for payment instructions.</p>'):"")+'<div class="finance-modal-actions">'+(type==="invoice"?'<button type="button" class="portal-button secondary" id="finance-invoice-pdf">Download invoice PDF</button>':"")+'<button type="button" class="portal-button" id="finance-request-action">'+esc(actionLabel)+'</button><button type="button" class="portal-button secondary" data-finance-close>Close</button></div><div id="finance-pdf-status" class="message" hidden role="status"></div></div></section>';

function openProjectModal(project){
document.getElementById("portal-project-modal")?.remove();
const summary=projectMilestoneSummary(project),schedule=projectDeadline(project),modal=document.createElement("div");
const milestones=summary.stages.map(function(stage,index){
const state=summary.currentIndex<0?"upcoming":(index<summary.currentIndex?"complete":(index===summary.currentIndex?"current":"upcoming"));
const stateLabel=state==="complete"?"Completed":(state==="current"?"Current milestone":"Upcoming");
return '<div class="project-milestone-step '+state+'" role="listitem"'+(state==="current"?' aria-current="step"':"")+'><span class="project-milestone-node" aria-hidden="true">'+(state==="complete"?"✓":String(index+1))+'</span><div class="project-milestone-copy"><div><strong>'+esc(stage.title)+'</strong><small>'+stateLabel+'</small></div><p>'+esc(stage.description)+'</p></div></div>';
}).join("");
let scheduleNote="";
if(["paused","cancelled"].includes(summary.status)){
scheduleNote='<div class="project-state-note" data-state="'+esc(summary.status)+'"><strong>'+esc(summary.statusLabel)+'</strong><p>'+esc(summary.message)+'</p></div>';
}
const nextMarkup=summary.next
?'<div class="project-next-milestone"><span>NEXT MILESTONE</span><strong>'+esc(summary.next.title)+'</strong><p>'+esc(summary.next.description)+'</p></div>'
:(summary.status==="completed"?'<div class="project-next-milestone complete"><span>DELIVERY STATUS</span><strong>All delivery milestones complete</strong><p>This project has been marked as complete by Swayphics.</p></div>':"");
modal.className="portal-modal";modal.id="portal-project-modal";
modal.innerHTML='<div class="modal-backdrop" data-close></div><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="portal-project-title"><div class="modal-head"><div><span class="portal-kicker">PROJECT DETAILS</span><h3 id="portal-project-title">'+esc(project.name||"Project")+'</h3><p>'+esc(project.service||"Swayphics project")+'</p></div><button type="button" class="modal-close" data-close aria-label="Close project details">×</button></div><div class="project-detail">'+
'<div class="project-detail-overview"><div class="detail-grid"><div class="detail-box"><span>Current status</span><strong>'+esc(nice(project.status||"Not set"))+'</strong></div><div class="detail-box"><span>Target date</span><strong>'+esc(project.due_date?date(project.due_date):"Not set")+'</strong></div><div class="detail-box"><span>Project value</span><strong>'+esc(money(project.value))+'</strong></div><div class="detail-box"><span>Payment status</span><strong>'+esc(nice(project.payment_status||"Not set"))+'</strong></div></div>'+
'<div class="project-schedule-card" data-state="'+esc(schedule.state)+'"><span>PROJECT SCHEDULE</span><strong>'+esc(schedule.label)+'</strong><p>'+esc(schedule.description)+'</p></div></div>'+
scheduleNote+
(project.description?'<section class="project-overview-copy"><h4>Project overview</h4><p>'+esc(project.description)+'</p></section>':"")+
'<section class="project-milestones" aria-labelledby="portal-project-milestones"><div class="project-milestones-head"><div><span class="portal-kicker">DELIVERY TRACKER</span><h4 id="portal-project-milestones">Project milestones</h4><p>'+esc(summary.current?"You are at stage "+(summary.currentIndex+1)+" of "+summary.stages.length+".":summary.message)+'</p></div>'+chip(project.status)+'</div>'+
'<div class="project-milestone-list" role="list">'+milestones+'</div></section>'+nextMarkup+
'<div class="project-modal-footer"><button type="button" class="portal-button secondary" data-close>Close</button></div></div></section>';
document.body.appendChild(modal);
modal.querySelectorAll("[data-close]").forEach(function(el){el.addEventListener("click",function(){modal.remove()})});
}
async function load(){
if(!token){renderPortalError("Portal link required","This page needs a valid private Swayphics portal link.");return}
try{
    const results=await Promise.all([portalRpc("get_client_portal",{p_token:token},15000),portalRpc("get_client_onboarding",{p_token:token},15000)]);
    const data=results[0], onboardingResult=results[1];
    if(!data||!data.ok)throw new Error(data&&data.error||"This portal link is invalid or expired.");
    if(!onboardingResult||!onboardingResult.ok)throw new Error(onboardingResult&&onboardingResult.error||"The onboarding form could not be loaded.");
    render(data,onboardingResult.onboarding||{});
checkYocoPaymentReturn();
}catch(error){
    renderPortalError("Unable to open portal",error&&error.message||"This portal link is invalid or has expired.");
}
}
function renderPortalError(title,message){
    app.className="error portal-shell";
    app.innerHTML='<div><strong>'+esc(title)+'</strong><p style="max-width:520px;color:var(--muted);font-size:.62rem;line-height:1.65;">'+esc(message)+'</p><button type="button" class="portal-button" id="portal-retry" style="margin-top:14px;">Try again</button><div style="margin-top:9px;color:var(--soft);font-size:.50rem;">Portal access is protected by a private token.</div></div>';
    document.getElementById("portal-retry")?.addEventListener("click",function(){window.location.reload()});
}
load();
})();
</script>
<script>
(function(){if(!("MutationObserver" in window))return;const busyPattern=/^(loading|syncing|uploading|saving|sending|processing|refreshing|deleting|generating|enabling|submitting|creating)(?:\s|\.\.\.|…|$)/i;function updateButton(button){if(!(button instanceof HTMLButtonElement))return;const text=String(button.textContent||"").trim();const isBusy=busyPattern.test(text)&&/(?:\.\.\.|…)$/.test(text);button.classList.toggle("sway-loading-button",isBusy)}document.querySelectorAll("button").forEach(updateButton);new MutationObserver(function(mutations){mutations.forEach(function(mutation){const button=mutation.target instanceof Element?mutation.target.closest("button"):mutation.target.parentElement?.closest("button");if(button)updateButton(button)})}).observe(document.body,{subtree:true,childList:true,characterData:true})})();
</script>

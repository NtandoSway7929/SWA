(function(){
const app=document.getElementById("app");
function showBootError(message){
    if(!app||!app.classList.contains("loading"))return;
    app.className="error portal-shell";
    app.innerHTML='<div><strong>The portal could not start</strong><p style="max-width:540px;color:var(--muted);font-size:.62rem;line-height:1.65;">'+String(message||"The portal script did not initialise correctly.").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</p><button type="button" class="portal-button" onclick="window.location.reload()" style="margin-top:14px;">Try again</button></div>';
}
window.addEventListener("error",function(event){
    showBootError(event&&event.message?"Portal script error: "+event.message:"A portal script error occurred.");
});
window.addEventListener("unhandledrejection",function(event){
    const reason=event&&event.reason;
    showBootError("Portal startup failed: "+(reason&&reason.message?reason.message:String(reason||"Unknown error.")));
});
window.setTimeout(function(){
    showBootError("The portal page finished loading, but its application did not start. Refresh the page. If this repeats, the browser is using an older cached portal build or the portal JavaScript is being blocked.");
},20000);
})();
</script>

function esc(value){return String(value==null?"":value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function money(value){return new Intl.NumberFormat("en-ZA",{style:"currency",currency:"ZAR",maximumFractionDigits:0}).format(Number(value||0))}
function date(value){if(!value)return "—";const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value);return d.toLocaleDateString("en-ZA",{day:"2-digit",month:"short",year:"numeric",timeZone:"Africa/Johannesburg"})}
function nice(value){return String(value||"").replace(/\b\w/g,function(m){return m.toUpperCase()})}
function chip(value){const v=String(value||"").toLowerCase();const cls=v==="paid"||v==="completed"?"success":(v==="overdue"||v==="rejected"||v==="cancelled"?"danger":(v==="pending"||v==="review"||v==="in progress"?"warning":""));return '<span class="chip '+cls+'">'+esc(nice(value||"Not set"))+"</span>"}
function projectStage(value){const stages=["planning","in progress","review","completed"];const index=stages.indexOf(String(value||"").toLowerCase());return index<0?0:index}
function projectProgress(value){const current=projectStage(value);return '<div class="progress">'+[0,1,2,3].map(function(i){return '<span class="'+(i<=current?"active":"")+'"></span>'}).join("")+"</div>"}
function activeProjects(data){return (data.projects||[]).filter(function(p){return !["completed","cancelled"].includes(String(p.status||"").toLowerCase())})}
function renderProject(item){return '<article class="project-item"><div class="project-top"><div><div class="project-name">'+esc(item.name||"Untitled project")+'</div><div class="project-meta">'+esc(item.service||"Swayphics project")+(item.due_date?" · Due "+esc(date(item.due_date)):"")+"</div></div>"+chip(item.status)+"</div>"+projectProgress(item.status)+'<div class="project-item-footer"><small>'+esc(item.description||"Your Swayphics project is being managed here.")+'</small><button type="button" class="text-button" data-project-id="'+esc(item.id)+'">View details</button></div></article>'}
function renderInvoice(item){const outstanding=Number(item.amount_outstanding||0);return '<article class="financial-item"><div class="financial-top"><div class="financial-name">'+esc(item.invoice_number||"Invoice")+'<div class="financial-meta">Issued '+esc(date(item.issue_date))+(item.due_date?" · Due "+esc(date(item.due_date)):"")+(outstanding>0?" · Outstanding "+money(outstanding):"")+"</div></div><div><b>"+esc(money(item.total))+"</b><div style='margin-top:5px;text-align:right;'>"+chip(item.status)+"</div></div></div></article>"}
function renderQuote(item){return '<article class="financial-item"><div class="financial-top"><div class="financial-name">'+esc(item.quote_number||item.title||"Quote")+'<div class="financial-meta">'+esc(item.title||"Swayphics quotation")+(item.valid_until?" · Valid until "+esc(date(item.valid_until)):"")+"</div></div><div><b>"+esc(money(item.amount))+"</b><div style='margin-top:5px;text-align:right;'>"+chip(item.status)+"</div></div></div></article>"}

function collectOnboarding(){

document.querySelectorAll("[data-project-id]").forEach(function(button){button.addEventListener("click",function(){const project=projects.find(function(item){return item.id===button.dataset.projectId});if(project)openProjectModal(project)})});document.querySelectorAll("[data-scroll-onboarding]").forEach(function(button){button.addEventListener("click",function(){document.getElementById("onboarding-section").scrollIntoView({behavior:"smooth",block:"start"})})});document.querySelectorAll("[data-scroll-request]").forEach(function(button){button.addEventListener("click",function(){document.getElementById("request-section").scrollIntoView({behavior:"smooth",block:"start"});setTimeout(function(){document.getElementById("request-subject")?.focus()},450)})});bindOnboarding();document.getElementById("request-form").addEventListener("submit",async function(event){event.preventDefault();const form=event.target,button=form.querySelector("button"),statusBox=document.getElementById("request-message-status");button.disabled=true;button.textContent="Sending...";statusBox.hidden=false;statusBox.textContent="Sending request...";try{const payload=await portalRpc("submit_client_portal_request",{p_token:token,p_subject:document.getElementById("request-subject").value,p_message:document.getElementById("request-message").value},15000);if(!payload||!payload.ok)throw new Error(payload&&payload.error||"Unable to send request.");statusBox.textContent="Your request has been sent to Swayphics.";form.reset()}catch(error){statusBox.textContent=error.message||"Unable to send request."}finally{button.disabled=false;button.textContent="Send request"}});
}
function openProjectModal(project){
document.getElementById("portal-project-modal")?.remove();
const stages=["planning","in progress","review","completed"],current=projectStage(project.status),modal=document.createElement("div");
modal.className="portal-modal";modal.id="portal-project-modal";
modal.innerHTML='<div class="modal-backdrop" data-close></div><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="portal-project-title"><div class="modal-head"><div><span class="portal-kicker">PROJECT</span><h3 id="portal-project-title">'+esc(project.name||"Project")+'</h3><p>'+esc(project.service||"Swayphics project")+'</p></div><button type="button" class="modal-close" data-close aria-label="Close">×</button></div><div class="project-detail"><div class="detail-grid"><div class="detail-box"><span>Status</span><strong>'+esc(nice(project.status||"Not set"))+'</strong></div><div class="detail-box"><span>Due</span><strong>'+esc(date(project.due_date))+'</strong></div><div class="detail-box"><span>Project value</span><strong>'+esc(money(project.value))+'</strong></div></div>'+(project.description?'<div class="detail-description">'+esc(project.description)+'</div>':"")+'<div class="timeline">'+stages.map(function(stage,i){const done=i<=current, currentLabel=i===current&&stage!=="completed"?"Current stage":(done?"Completed":"Upcoming");return '<div class="timeline-step '+(done?"complete":"")+' '+(i===current?"current":"")+'"><span class="timeline-node">'+(done?"✓":String(i+1))+'</span><div><strong>'+esc(nice(stage))+'</strong><small>'+esc(currentLabel)+'</small></div></div>'}).join("")+'</div><div style="display:flex;justify-content:flex-end;margin-top:3px"><button type="button" class="portal-button secondary" data-close>Close</button></div></div></section>';
document.body.appendChild(modal);modal.querySelectorAll("[data-close]").forEach(function(el){el.addEventListener("click",function(){modal.remove()})});
}
async function load(){
if(!token){renderPortalError("Portal link required","This page needs a valid private Swayphics portal link.");return}
try{
    const results=await Promise.all([portalRpc("get_client_portal",{p_token:token},15000),portalRpc("get_client_onboarding",{p_token:token},15000)]);
    const data=results[0], onboardingResult=results[1];
    if(!data||!data.ok)throw new Error(data&&data.error||"This portal link is invalid or expired.");
    if(!onboardingResult||!onboardingResult.ok)throw new Error(onboardingResult&&onboardingResult.error||"The onboarding form could not be loaded.");
    render(data,onboardingResult.onboarding||{});
}catch(error){
    renderPortalError("Unable to open portal",error&&error.message||"This portal link is invalid or has expired.");
}
}
function renderPortalError(title,message){
    app.className="error portal-shell";
    app.innerHTML='<div><strong>'+esc(title)+'</strong><p style="max-width:520px;color:var(--muted);font-size:.62rem;line-height:1.65;">'+esc(message)+'</p><button type="button" class="portal-button" id="portal-retry" style="margin-top:14px;">Try again</button><div style="margin-top:9px;color:var(--soft);font-size:.50rem;">Portal access is protected by a private token.</div></div>';
    document.getElementById("portal-retry")?.addEventListener("click",function(){window.location.reload()});
}
load();
})();
</script>
<script>
(function(){if(!("MutationObserver" in window))return;const busyPattern=/^(loading|syncing|uploading|saving|sending|processing|refreshing|deleting|generating|enabling|submitting|creating)(?:\s|\.\.\.|…|$)/i;function updateButton(button){if(!(button instanceof HTMLButtonElement))return;const text=String(button.textContent||"").trim();const isBusy=busyPattern.test(text)&&/(?:\.\.\.|…)$/.test(text);button.classList.toggle("sway-loading-button",isBusy)}document.querySelectorAll("button").forEach(updateButton);new MutationObserver(function(mutations){mutations.forEach(function(mutation){const button=mutation.target instanceof Element?mutation.target.closest("button"):mutation.target.parentElement?.closest("button");if(button)updateButton(button)})}).observe(document.body,{subtree:true,childList:true,characterData:true})})();
</script>

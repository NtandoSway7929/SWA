<script>
(function(){
const app=document.getElementById("app");
function showBootError(message){
    if(!app||!app.classList.contains("loading"))return;
    app.className="error portal-shell";
    app.innerHTML='<div><strong>The portal could not start</strong><p style="max-width:540px;color:var(--muted);font-size:.62rem;line-height:1.65;">'+String(message||"The portal script did not initialise correctly.").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</p><button type="button" class="portal-button" onclick="window.location.reload()" style="margin-top:14px;">Try again</button></div>';
}
window.addEventListener("error",function(event){
    showBootError(event&&event.message?"Portal script error: "+event.message:"A portal script error occurred.");
});
window.addEventListener("unhandledrejection",function(event){
    const reason=event&&event.reason;
    showBootError("Portal startup failed: "+(reason&&reason.message?reason.message:String(reason||"Unknown error.")));
});
window.setTimeout(function(){
    showBootError("The portal page finished loading, but its application did not start. Refresh the page. If this repeats, the browser is using an older cached portal build or the portal JavaScript is being blocked.");
},20000);
})();
</script>

    const controller=new AbortController();

        const response=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+encodeURIComponent(functionName),{

        }

'<nav class="portal-nav"><img src="../swayphics-logo.png" class="portal-logo" alt="Swayphics"><div class="portal-nav-right"><span class="portal-secure">Secure access</span><span class="portal-badge">Private client portal</span></div></nav>'+
'<section class="portal-hero"><span class="portal-kicker">SWAYPHICS CLIENT PORTAL</span><h1>Welcome, '+esc(c.contact_name||c.business_name||"Client")+'.</h1><p>One place for project progress, quotations, invoices and payments. Need something from the Swayphics team? Send it directly from this workspace.</p><div class="portal-hero-actions"><button type="button" class="portal-button" data-scroll-request>Make a request</button><a class="portal-button secondary" href="mailto:info@swayphics.co.za?subject='+encodeURIComponent("Client request — "+(c.business_name||"Swayphics client"))+'">Email Swayphics</a></div></section>'+
'<section class="portal-section"><div class="portal-section-head"><div><h2>At a glance</h2><p>Your current Swayphics workspace</p></div></div><div class="portal-stats"><article class="stat-card"><span>Active projects</span><strong>'+active.length+'</strong><small>'+(projects.length?projects.length+" total project"+(projects.length===1?"":"s"):"No projects yet")+'</small></article><article class="stat-card"><span>Outstanding</span><strong>'+esc(money(outstanding))+'</strong><small>Across open invoices</small></article><article class="stat-card"><span>Quoted value</span><strong>'+esc(money(quoteValue))+'</strong><small>Current quotations</small></article><article class="stat-card"><span>Recorded payments</span><strong>'+esc(money(paid))+'</strong><small>Payments recorded by Swayphics</small></article></div></section>'+
'<section class="portal-section portal-grid"><section class="portal-card"><div class="card-head"><div><h3>Project progress</h3><p>See where each piece of work currently sits.</p></div><span class="card-count">'+projects.length+'</span></div>'+(projects.length?'<div class="project-list">'+projects.map(renderProject).join("")+'</div>':'<div class="empty">No projects are currently listed for this workspace.</div>')+'</section>'+
'<section class="portal-card"><div class="card-head"><div><h3>Invoices</h3><p>Amounts and payment status.</p></div><span class="card-count">'+invoices.length+'</span></div>'+(invoices.length?'<div class="financial-list">'+invoices.slice(0,5).map(renderInvoice).join("")+'</div>':'<div class="empty">No invoices are currently listed.</div>')+'</section>'+
'<section class="portal-card"><div class="card-head"><div><h3>Quotes</h3><p>Current quotations from Swayphics.</p></div><span class="card-count">'+quotes.length+'</span></div>'+(quotes.length?'<div class="financial-list">'+quotes.slice(0,5).map(renderQuote).join("")+'</div>':'<div class="empty">No quotations are currently listed.</div>')+'</section>'+
'<section class="portal-card"><div class="card-head"><div><h3>Payments</h3><p>Recorded payments on this client account.</p></div><span class="card-count">'+payments.length+'</span></div>'+(payments.length?'<div class="financial-list">'+payments.slice(0,5).map(renderPayment).join("")+'</div>':'<div class="empty">No recorded payments yet.</div>')+'</section></section>'+
'<section class="portal-section" id="request-section"><section class="portal-card request-card"><div class="request-copy"><span class="kicker">DIRECT TO SWAYPHICS</span><h3>Need an update, change or something new?</h3><p>Send a request from the portal and it will be attached to this client account in the Swayphics workspace.</p><div class="contact-points">'+(c.email?'<div class="contact-point"><span>Account</span><strong>'+esc(c.email)+'</strong></div>':"")+(c.phone?'<div class="contact-point"><span>Phone</span><strong>'+esc(c.phone)+'</strong></div>':"")+'</div></div><form class="request-form" id="request-form"><div class="field"><label for="request-subject">Subject</label><input id="request-subject" required maxlength="180" placeholder="What do you need help with?"></div><div class="field"><label for="request-message">Message</label><textarea id="request-message" required maxlength="5000" placeholder="Tell the Swayphics team what you need."></textarea></div><button class="portal-button" type="submit">Send request</button><div id="request-message-status" class="message" hidden></div></form></section></section>'+
'<footer class="portal-footer"><span><strong>Swayphics</strong> · Creative & Design Lab</span><span>Private portal access · Keep this link confidential</span></footer>';
document.querySelectorAll("[data-project-id]").forEach(function(button){button.addEventListener("click",function(){const project=projects.find(function(item){return item.id===button.dataset.projectId});if(project)openProjectModal(project)})});
document.querySelectorAll("[data-scroll-request]").forEach(function(button){button.addEventListener("click",function(){document.getElementById("request-section").scrollIntoView({behavior:"smooth",block:"start"});setTimeout(function(){document.getElementById("request-subject")?.focus()},450)})});
document.getElementById("request-form").addEventListener("submit",async function(event){
event.preventDefault();const form=event.target,button=form.querySelector("button"),statusBox=document.getElementById("request-message-status");
button.disabled=true;button.textContent="Sending...";statusBox.hidden=false;statusBox.textContent="Sending request...";
try{const payload=await portalRpc("submit_client_portal_request",{p_token:token,p_subject:document.getElementById("request-subject").value,p_message:document.getElementById("request-message").value},15000);if(!payload||!payload.ok)throw new Error(payload&&payload.error||"Unable to send request.");statusBox.textContent="Your request has been sent to Swayphics.";form.reset()}catch(error){statusBox.textContent=error.message||"Unable to send request."}finally{button.disabled=false;button.textContent="Send request"}});
}
function openProjectModal(project){
document.getElementById("portal-project-modal")?.remove();
const stages=["planning","in progress","review","completed"],current=projectStage(project.status),modal=document.createElement("div");
modal.className="portal-modal";modal.id="portal-project-modal";
modal.innerHTML='<div class="modal-backdrop" data-close></div><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="portal-project-title"><div class="modal-head"><div><span class="portal-kicker">PROJECT</span><h3 id="portal-project-title">'+esc(project.name||"Project")+'</h3><p>'+esc(project.service||"Swayphics project")+'</p></div><button type="button" class="modal-close" data-close aria-label="Close">×</button></div><div class="project-detail"><div class="detail-grid"><div class="detail-box"><span>Status</span><strong>'+esc(nice(project.status||"Not set"))+'</strong></div><div class="detail-box"><span>Due</span><strong>'+esc(date(project.due_date))+'</strong></div><div class="detail-box"><span>Project value</span><strong>'+esc(money(project.value))+'</strong></div></div>'+(project.description?'<div class="detail-description">'+esc(project.description)+'</div>':"")+'<div class="timeline">'+stages.map(function(stage,i){const done=i<=current, currentLabel=i===current&&stage!=="completed"?"Current stage":(done?"Completed":"Upcoming");return '<div class="timeline-step '+(done?"complete":"")+' '+(i===current?"current":"")+'"><span class="timeline-node">'+(done?"✓":String(i+1))+'</span><div><strong>'+esc(nice(stage))+'</strong><small>'+esc(currentLabel)+'</small></div></div>'}).join("")+'</div><div style="display:flex;justify-content:flex-end;margin-top:3px"><button type="button" class="portal-button secondary" data-close>Close</button></div></div></section>';
document.body.appendChild(modal);modal.querySelectorAll("[data-close]").forEach(function(el){el.addEventListener("click",function(){modal.remove()})});
}
async function load(){
if(!token){renderPortalError("Portal link required","This page needs a valid private Swayphics portal link.");return}
try{
    const data=await portalRpc("get_client_portal",{p_token:token},15000);
    if(!data||!data.ok)throw new Error(data&&data.error||"This portal link is invalid or expired.");
    render(data);
}catch(error){
    renderPortalError("Unable to open portal",error&&error.message||"This portal link is invalid or has expired.");
}
}
function renderPortalError(title,message){
    app.className="error portal-shell";
    app.innerHTML='<div><strong>'+esc(title)+'</strong><p style="max-width:520px;color:var(--muted);font-size:.62rem;line-height:1.65;">'+esc(message)+'</p><button type="button" class="portal-button" id="portal-retry" style="margin-top:14px;">Try again</button><div style="margin-top:9px;color:var(--soft);font-size:.50rem;">Portal access is protected by a private token.</div></div>';
    document.getElementById("portal-retry")?.addEventListener("click",function(){window.location.reload()});
}
load();
})();
</script>
<script>
(function(){if(!("MutationObserver" in window))return;const busyPattern=/^(loading|syncing|uploading|saving|sending|processing|refreshing|deleting|generating|enabling|submitting|creating)(?:\s|\.\.\.|…|$)/i;function updateButton(button){if(!(button instanceof HTMLButtonElement))return;const text=String(button.textContent||"").trim();const isBusy=busyPattern.test(text)&&/(?:\.\.\.|…)$/.test(text);button.classList.toggle("sway-loading-button",isBusy)}document.querySelectorAll("button").forEach(updateButton);new MutationObserver(function(mutations){mutations.forEach(function(mutation){const button=mutation.target instanceof Element?mutation.target.closest("button"):mutation.target.parentElement?.closest("button");if(button)updateButton(button)})}).observe(document.body,{subtree:true,childList:true,characterData:true})})();
</script>
</body>
</html>

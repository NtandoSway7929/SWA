use_default_settings: true

general:
  debug: false
  instance_name: "Swayphics BOF Search"

search:
  safe_search: 2
  formats:
    - html
    - json

server:
  # The deployment supplies SEARXNG_SECRET and SEARXNG_BASE_URL.
  secret_key: "overridden-by-SEARXNG_SECRET"
  limiter: true
  public_instance: false
  image_proxy: false

valkey:
  # The deployment supplies SEARXNG_VALKEY_URL.
  url: valkey://valkey:6379/0

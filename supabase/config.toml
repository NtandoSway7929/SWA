[functions.send-email]
verify_jwt = true

[functions.sync-email-inbox]
# The function validates admin JWTs itself and also validates a Vault-held token
# for the scheduled server-side poll. Do not remove its application-level checks.
verify_jwt = false

[functions.delete-email-messages]
verify_jwt = true

[functions.generate-invoice]
verify_jwt = true

# This function validates the hashed private portal token before serving client-owned files.
[functions.client-portal-documents]
verify_jwt = false

[functions.request-client-review]
verify_jwt = true

[functions.send-admin-push]
verify_jwt = false

[functions.submit-enquiry]
verify_jwt = false

# Public website chat is protected by origin/session rate limits in its public route.
# All private workspace actions enforce user JWT and Swayphics-admin checks in the function.
[functions.swayphics-ai]
verify_jwt = false

# Yoco payment endpoints authenticate private portal tokens, provider signatures,
# or administrator JWTs inside the handlers. The gateway JWT check is disabled
# so those distinct credentials can be validated by the application code.
[functions.create-payment-checkout]
verify_jwt = false

[functions.yoco-payment-webhook]
verify_jwt = false

[functions.get-payment-status]
verify_jwt = false

[functions.reconcile-payment]
verify_jwt = false
